<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendario del equipo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap">
<style>:root {
  /* Solo modo claro por ahora: el modo oscuro tendrá su propia paleta en una
     fase aparte. Los estilos oscuros parciales anteriores se quitaron porque
     chocaban con la paleta del rediseño. */
  color-scheme: light;
  font-family: "Inter", system-ui, sans-serif;

  /* Identidad visual — ver docs/brand/identidad-visual.md */
  --font-display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --font-mono: "Victor Mono", ui-monospace, monospace;

  /* Paleta del rediseño (2026-09-25): colores del logo, ver el Design System
     de Cycles. brand-blue (#3080fc) marca estado y selección; para texto y
     botones con texto blanco se usa un paso más oscuro que cumple 4.5:1. */
  --color-brand: #3080fc;
  --color-blue: #1a66dd;
  --color-blue-hover: #155ccc;
  --color-blue-tint: #eaf2ff;
  /* Tonos de azul de marca para la cadena de ejercicios y las tarjetas de datos. */
  --color-blue-50: #f3f8ff;
  --color-blue-100: #eaf2ff;
  --color-blue-200: #d6e4ff;
  --color-blue-300: #a9c8fd;
  --color-blue-400: #6fa6fc;
  --color-blue-700: #1450b0;
  /* Fondo de las pantallas con tarjetas con sombra (Inicio del coach). */
  --color-page: #f3f5f8;
  --shadow-card: 0 1px 2px rgba(31, 34, 40, 0.05), 0 6px 18px -8px rgba(31, 34, 40, 0.14);
  /* Escala de radios (docs/diseno/inicio-coach): rectángulos con esquinas
     redondeadas; la cápsula queda solo para etiquetas pequeñas. */
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 10px;
  --radius-xl: 12px;
  --radius-pill: 999px;
  --color-bg: #ffffff;
  --color-ink: #1f2228;
  --color-ink-secondary: #5c6068;
  --color-gray-light: #f6f7f9;
  --color-gray-border: #dfe2e7;
  --color-control-border: #8a8f98;
  --color-gray-mid: #8a8f98;

  --color-ok-bg: #e9f5ec;
  --color-ok-ink: #1e6b32;
  --color-warn-bg: #fff1e3;
  --color-warn-ink: #9a4a00;
  --color-warn-fill: #e08a2e;
  --color-pain-bg: #fdecec;
  --color-pain-ink: #a3282c;

  /* Elevación en tres niveles, sombras en capas de baja opacidad (sin brillos):
     e1 en reposo, e2 para lo destacado, e3 para lo que flota. Ver
     docs/diseno/ciclo-en-calendario. */
  --shadow-e1: 0 0 0 1px rgba(31, 34, 40, 0.06), 0 1px 2px rgba(31, 34, 40, 0.06), 0 3px 8px -2px rgba(31, 34, 40, 0.08);
  --shadow-e2: 0 0 0 1px rgba(31, 34, 40, 0.06), 0 2px 4px rgba(31, 34, 40, 0.06), 0 12px 24px -8px rgba(31, 34, 40, 0.18);
  --shadow-e3: 0 0 0 1px rgba(31, 34, 40, 0.07), 0 4px 8px rgba(31, 34, 40, 0.08), 0 20px 40px -12px rgba(31, 34, 40, 0.3);

  /* Sesión hecha: verde sombreado, hundido, que se lee como un día que ya pasó. */
  --color-done-bg: #e3f1e7;
  --color-done-ring: #bcdac5;
  --color-done-ink: #24472f;
  --color-done-ink-2: #3f5f49;

  /* Esqueletos de carga. */
  --color-skeleton: #dde2ea;
  --app-header-h: 57px;
}

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-ink);
}

.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  background: var(--color-bg);
  border-bottom: 1px solid var(--color-gray-border);
}

.app-header-left {
  display: flex;
  align-items: center;
  gap: 32px;
}

.app-logo {
  display: block;
  height: 26px;
  width: auto;
}

.app-nav {
  display: flex;
  gap: 20px;
}

.app-nav-link {
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--color-ink-secondary);
  text-decoration: none;
  padding: 6px 2px;
  border-bottom: 2px solid transparent;
}

.app-nav-link:hover {
  color: var(--color-ink);
}

.app-nav-link-active {
  color: var(--color-ink);
  border-bottom-color: var(--color-brand);
}

.app-main {
  flex: 1;
  padding: 32px 24px;
  max-width: 1120px;
  width: 100%;
  margin: 0 auto;
  box-sizing: border-box;
}

/* Inicio del coach: usa casi todo el ancho de la ventana (docs/diseno/inicio-coach). */
.app-main-inicio {
  max-width: 1680px;
}

@media (min-width: 1280px) {
  .app-main-inicio {
    padding-left: 32px;
    padding-right: 32px;
  }
}

.user-menu {
  position: relative;
}

.user-menu-trigger {
  border: none;
  background: none;
  padding: 0;
  cursor: pointer;
}

.user-avatar {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--color-ink);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 700;
}

.user-menu-panel {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: 220px;
  background: var(--color-bg);
  border: 1px solid var(--color-gray-border);
  border-radius: var(--radius-xl);
  box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.18);
  padding: 8px;
}

.user-menu-info {
  padding: 8px 10px 10px;
  border-bottom: 1px solid var(--color-gray-light);
  margin-bottom: 6px;
}

.user-menu-name {
  margin: 0;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--color-ink);
}

.user-menu-email {
  margin: 2px 0 0;
  font-size: 0.78rem;
  color: var(--color-ink-secondary);
}

.user-menu-item {
  display: block;
  box-sizing: border-box;
  width: 100%;
  text-align: left;
  text-decoration: none;
  padding: 8px 10px;
  border: none;
  background: none;
  border-radius: var(--radius-md);
  font-size: 0.88rem;
  color: var(--color-ink);
  cursor: pointer;
}

.user-menu-item:hover {
  background: var(--color-gray-light);
}

/* Celular: el atleta registra desde el gimnasio. */
@media (max-width: 640px) {
  /* Dos filas: logo y avatar arriba, pestañas repartidas abajo. Así no se
     cortan con cuatro enlaces en un ancho de 360px. */
  .app-header {
    display: grid;
    grid-template-areas: "logo menu" "nav nav";
    grid-template-columns: 1fr auto;
    row-gap: 10px;
    padding: 12px 16px 0;
  }

  .app-header-left {
    display: contents;
  }

  .app-logo {
    grid-area: logo;
  }

  .app-header-right {
    grid-area: menu;
  }

  .app-nav {
    grid-area: nav;
    justify-content: space-between;
    gap: 8px;
    overflow-x: auto;
  }

  .app-nav-link {
    padding: 10px 2px;
    white-space: nowrap;
  }

  .app-main {
    padding: 20px 16px 32px;
  }
}

/* ===== Campana de avisos (docs/diseno/notificaciones) ===== */
.app-header .notif {
  position: relative;
}

.app-header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.notif-bell {
  position: relative;
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  background: none;
  color: var(--color-ink);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.notif-bell:hover,
.notif-bell-open {
  background: var(--color-gray-light);
}

.notif-bell:focus-visible {
  outline: 2px solid var(--color-blue);
  outline-offset: 2px;
}

.notif-badge {
  position: absolute;
  top: 3px;
  right: 2px;
  min-width: 20px;
  height: 20px;
  padding: 0 4px;
  box-sizing: border-box;
  border: 2px solid var(--color-bg);
  border-radius: 10px;
  background: var(--color-blue);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 700;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.notif-panel {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: 380px;
  z-index: 20;
  background: var(--color-bg);
  border: 1px solid var(--color-gray-border);
  border-radius: 14px;
  box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.18);
  overflow: hidden;
}

.notif-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 10px;
}

.notif-head h2 {
  margin: 0;
  font-family: var(--font-display, inherit);
  font-size: 1.05rem;
}

.notif-link {
  border: none;
  background: none;
  padding: 6px 4px;
  border-radius: var(--radius-sm);
  color: var(--color-blue);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
}

.notif-link:hover {
  text-decoration: underline;
}

.notif-list {
  list-style: none;
  margin: 0;
  padding: 0;
  max-height: min(70vh, 520px);
  overflow-y: auto;
}

.notif-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  min-height: 44px;
  padding: 12px 16px;
  border: none;
  border-top: 1px solid var(--color-gray-border);
  background: var(--color-bg);
  text-align: left;
  font: inherit;
  color: var(--color-ink);
  cursor: pointer;
}

.notif-item:hover {
  background: var(--color-gray-light);
}

.notif-unread {
  background: var(--color-blue-tint);
}

.notif-unread:hover {
  background: var(--color-blue-200);
}

.notif-bead {
  box-sizing: border-box;
  flex: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.notif-bead b {
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.notif-unread .notif-bead {
  background: var(--color-blue);
  color: #ffffff;
}

.notif-read .notif-bead {
  background: var(--color-bg);
  border: 1.5px solid var(--color-gray-border);
  color: var(--color-ink-secondary);
}

.notif-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.notif-title {
  font-weight: 700;
  font-size: 0.92rem;
  line-height: 1.3;
}

.notif-text {
  font-size: 0.88rem;
  line-height: 1.4;
}

.notif-read .notif-text {
  color: var(--color-ink-secondary);
}

.notif-when {
  flex: none;
  padding-top: 2px;
  font-size: 0.78rem;
  color: var(--color-ink-secondary);
  white-space: nowrap;
}

.notif-state {
  position: relative;
  overflow: hidden;
  padding: 30px 24px 34px;
  text-align: center;
}

.notif-state > :not(.notif-chain) {
  position: relative;
}

.notif-state h3 {
  margin: 10px 0 4px;
  font-family: var(--font-display, inherit);
  font-size: 1.05rem;
}

.notif-state p {
  margin: 0 auto;
  max-width: 260px;
  font-size: 0.9rem;
  color: var(--color-ink-secondary);
}

.notif-chain {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0.55;
  pointer-events: none;
}

.notif-retry {
  margin-top: 14px;
  padding: 8px 18px;
  border: 1.5px solid var(--color-ink);
  border-radius: 999px;
  background: var(--color-bg);
  font: inherit;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
}

.notif-skeleton {
  cursor: default;
}

.notif-skeleton .notif-bead {
  background: var(--color-gray-light);
}

.notif-lines {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 4px;
}

.notif-lines span {
  height: 10px;
  border-radius: 5px;
  background: var(--color-gray-light);
}

.notif-lines span:last-child {
  width: 70%;
}

@media (max-width: 640px) {
  /* En celular el panel ocupa el ancho con 12 px de margen. */
  .app-header .notif {
    position: static;
  }

  .notif-panel {
    top: calc(100% + 8px);
    left: 12px;
    right: 12px;
    width: auto;
  }
}

/* Componentes de la Fase 3 (ejecución y seguimiento). Ver el lienzo
   "Cycles — Pantallas web" y docs/prds/features/PRD-EjecucionYSeguimiento.md. */

.page-header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  margin-bottom: 24px;
}

.page-title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 2.25rem;
  line-height: 1.1;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.page-back {
  display: inline-block;
  margin-bottom: 8px;
  font-size: 0.9rem;
  color: var(--color-ink-secondary);
  text-decoration: none;
}

.section-title {
  margin: 0;
  font-size: 1.15rem;
  font-weight: 700;
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.button-inline {
  width: auto;
}

.button-compact {
  width: auto;
  padding: 7px 14px;
  font-size: 0.88rem;
}

.button-ghost {
  display: inline-flex;
  align-items: center;
  padding: 7px 10px;
  border: none;
  background: none;
  color: var(--color-blue);
  font: 600 0.88rem Inter, system-ui, sans-serif;
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
}

/* ---------- Etiquetas de estado: siempre con texto, nunca solo color ---------- */
.pill {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 700;
  white-space: nowrap;
  background: var(--color-gray-light);
  color: var(--color-ink-secondary);
}

.pill-ok {
  background: var(--color-ok-bg);
  color: var(--color-ok-ink);
}

.pill-warn {
  background: var(--color-warn-bg);
  color: var(--color-warn-ink);
}

.pill-blue {
  background: var(--color-blue-tint);
  color: var(--color-blue);
}

.pill-pain {
  background: var(--color-pain-bg);
  color: var(--color-pain-ink);
}

/* ---------- Necesitan atención ---------- */
.card {
  padding: 20px 24px;
  border: 1px solid var(--color-gray-border);
  border-radius: 16px;
  background: var(--color-bg);
}

/* Estado vacío: tarjeta sobre el motivo de proteína. */
.empty-state {
  display: flex;
  justify-content: center;
  padding: 48px 16px;
  border-radius: 16px;
  background-color: var(--color-gray-light);
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
}

.empty-state-card {
  width: 100%;
  max-width: 420px;
  box-sizing: border-box;
  padding: 24px;
  border: 1px solid var(--color-gray-border);
  border-radius: 16px;
  background: var(--color-bg);
}

.empty-state-card p {
  margin: 8px 0 0;
  line-height: 1.5;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding-bottom: 12px;
}

.alert-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.alert-row {
  display: grid;
  grid-template-columns: 110px minmax(0, 1fr) auto;
  gap: 16px;
  align-items: center;
  padding: 14px 0;
  border-top: 1px solid var(--color-gray-border);
}

.alert-row p {
  margin: 0;
  line-height: 1.45;
}

.alert-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}

.plan-alert {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px 24px;
  padding: 14px 18px;
  margin-bottom: 16px;
  border-radius: 12px;
  background: var(--color-warn-bg);
}

@media (max-width: 720px) {
  .alert-row {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .alert-actions {
    justify-content: flex-start;
  }
}

/* ---------- Resumen del atleta ---------- */
.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 16px 40px;
  margin: 0;
  padding: 16px 20px;
  border: 1px solid var(--color-gray-border);
  border-radius: 12px;
}

.stats dt {
  font-size: 0.82rem;
  color: var(--color-ink-secondary);
}

.stats dd {
  margin: 2px 0 0;
  font-size: 1.4rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.chart-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 20px;
}

.chart-card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 20px 24px;
  border: 1px solid var(--color-gray-border);
  border-radius: 16px;
  min-width: 0;
}

.chart-card svg {
  width: 100%;
  height: auto;
  overflow: visible;
}

.chart-card text {
  font-family: Inter, system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 0.82rem;
  color: var(--color-ink-secondary);
}

.legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.legend i {
  width: 10px;
  height: 10px;
  border-radius: 3px;
}

.table-scroll {
  overflow-x: auto;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}

.data-table th {
  padding: 10px 12px;
  text-align: left;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--color-ink-secondary);
  border-bottom: 1px solid var(--color-gray-border);
  white-space: nowrap;
}

.data-table td {
  padding: 12px;
  border-bottom: 1px solid var(--color-gray-border);
  vertical-align: middle;
}

.rir-chip {
  display: inline-block;
  min-width: 28px;
  padding: 3px 6px;
  border-radius: 6px;
  text-align: center;
  font-size: 0.82rem;
  font-weight: 600;
  background: var(--color-gray-light);
}

/* ---------- Registro del atleta (pensado para el celular) ---------- */
.log-shell {
  max-width: 520px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.log-progress {
  display: flex;
  gap: 4px;
}

.log-progress span {
  flex-grow: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--color-gray-border);
}

.log-progress span[data-done="true"] {
  background: var(--color-brand);
}

.target-values {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 0;
}

.target-values div {
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--color-gray-light);
}

.target-values dt {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--color-ink-secondary);
}

.target-values dd {
  margin: 2px 0 0;
  font-size: 1.05rem;
  font-weight: 700;
}

.set-list {
  list-style: none;
  margin: 0;
  padding: 0;
  border-top: 1px solid var(--color-gray-border);
}

.set-row {
  display: grid;
  grid-template-columns: 72px 1fr 1fr 36px;
  gap: 8px;
  align-items: center;
  min-height: 52px;
  border-bottom: 1px solid var(--color-gray-border);
  font-variant-numeric: tabular-nums;
}

.set-done {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--color-ok-bg);
  color: var(--color-ok-ink);
  font-weight: 700;
}

.current-set {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 16px;
  border: 2px solid var(--color-brand);
  border-radius: 16px;
}

.stepper-row {
  display: flex;
  gap: 12px;
}

.stepper {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
  min-width: 0;
}

.stepper label {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--color-ink-secondary);
}

.stepper-control {
  display: flex;
  align-items: center;
  height: 52px;
  border: 1px solid var(--color-control-border);
  border-radius: 12px;
}

.stepper-control button {
  width: 48px;
  height: 52px;
  border: none;
  background: none;
  font-size: 1.4rem;
  color: var(--color-ink);
  cursor: pointer;
}

.stepper-control input {
  width: 100%;
  min-width: 0;
  border: none;
  background: transparent;
  text-align: center;
  font: 600 1.25rem Inter, system-ui, sans-serif;
  color: var(--color-ink);
}

.choice-fieldset {
  margin: 0;
  padding: 0;
  border: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

  padding: 0 0 8px;
  font-size: 1rem;
  font-weight: 700;
}

.choice-grid {
  display: grid;
  gap: 8px;
}

.choice-grid button {
  min-height: 48px;
  border-radius: 12px;
  border: 1px solid var(--color-control-border);

  color: var(--color-ink);
  font: 700 1.1rem Inter, system-ui, sans-serif;
  cursor: pointer;
}

.choice-grid button[aria-pressed="true"] {
  border: 2px solid var(--color-blue);
  background: var(--color-blue-tint);
  color: var(--color-blue);
}

.choice-hint {
  font-size: 0.82rem;
  color: var(--color-ink-secondary);
}

.button-big {
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  min-height: 52px;
  font-size: 1.05rem;
}

.today-list {
  list-style: none;
  margin: 0;
  padding: 0;
  border-top: 1px solid var(--color-gray-border);
}

.today-list li {

  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--color-gray-border);

.today-list li span:last-child {
  color: var(--color-ink-secondary);

}

.field textarea {
  padding: 10px 12px;
  border: 1px solid var(--color-control-border);
  border-radius: 8px;
  font: 400 0.95rem Inter, system-ui, sans-serif;
  color: var(--color-ink);
  resize: vertical;
}

/* ---------- Descanso entre series ---------- */
.rest-timer {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 20px 16px;
  border-radius: 16px;
  background: var(--color-gray-light);
}

.rest-timer .button-big {
  width: 100%;
}

.rest-ring {
  position: relative;
  width: min(232px, 70vw);
  aspect-ratio: 1;
}

.rest-ring svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.rest-ring circle {
  fill: none;
  stroke-width: 14;
}

.rest-ring-track {
  stroke: var(--color-gray-border);
}

.rest-ring-progress {
  stroke: var(--color-brand);
  stroke-linecap: round;
  transition: stroke-dashoffset 0.25s linear;
}

}

.rest-ring-center {

.rest-adjust {

  grid-template-columns: 1fr 1fr;

@media (max-width: 640px) {
  .page-title {

  }

  }

/* Nota del coach por ejercicio (CYC-61/62). Texto libre: se respeta el salto de línea. */

.ex-note-form textarea,
.rt-note textarea {

/* Comentario del RM en el registro de la serie (CYC-312): texto, sin subtítulos grises. */

/* «Hoy» con dos ciclos a la vez (CYC-314): una tarjeta por ciclo. */
.tc-list { gap: 14px; }

/* Constructor de rutinas por bloques (CYC-275): bloques a la izquierda, panel fijo a la derecha. */
.bld-page *, .bld-page *::before, .bld-page *::after { box-sizing: border-box; }
.bld-page { display: flex; flex-direction: column; gap: 12px; padding-bottom: 72px; }

.bld-block { background: var(--color-bg); border-radius: var(--radius-xl); box-shadow: var(--shadow-e1); overflow: hidden; }
.bld-blocks { display: flex; flex-direction: column; gap: 10px; }

.bld-dropstrip { margin: 4px 10px 8px; padding: 8px; border: 1px dashed var(--color-control-border); border-radius: var(--radius-md); font-size: 0.8rem; text-align: center; color: var(--color-ink-secondary); }
.bld-bh { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 10px; background: color-mix(in srgb, var(--block-color) 11%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--block-color) 25%, transparent); }
.bld-fold { flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--radius-md); background: transparent; cursor: pointer; display: grid; place-items: center; }

.bld-chev { width: 8px; height: 8px; border-right: 2px solid var(--color-ink-secondary); border-bottom: 2px solid var(--color-ink-secondary); transform: rotate(45deg); transition: transform 0.15s; }
.bld-chev[data-open="false"] { transform: rotate(-45deg); }
.bld-pearl { flex: none; width: 14px; height: 14px; border-radius: var(--radius-pill); background: var(--block-color); }
.bld-title { display: flex; flex-direction: column; min-width: 0; }
.bld-title strong { font-size: 1rem; line-height: 1.2; }
.bld-type { font-size: 0.76rem; font-weight: 600; color: var(--color-ink-secondary); }
.bld-sum { margin-left: auto; font-size: 0.8rem; font-weight: 600; color: var(--color-ink-secondary); white-space: nowrap; }
.bld-icon { width: 30px; height: 30px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--color-ink-secondary); font-size: 1.2rem; line-height: 1; cursor: pointer; }
.bld-icon:hover { background: var(--color-gray-light); color: var(--color-ink); }

.bld-menu { position: relative; }
.bld-menu-list { position: absolute; right: 0; top: 100%; z-index: 30; min-width: 190px; padding: 4px; background: var(--color-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-e2); display: flex; flex-direction: column; }
.bld-menu-list button { text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: var(--radius-sm); font: inherit; font-size: 0.86rem; cursor: pointer; color: var(--color-ink); }
.bld-menu-list button:hover:not(:disabled) { background: var(--color-gray-light); }
.bld-menu-list button:disabled { opacity: 0.4; cursor: default; }
.bld-menu-list .bld-danger, .bld-danger { color: var(--color-pain-ink); }

.bld-body { padding: 2px 10px 8px; }
.bld-bnote { margin: 8px 0 4px; font-size: 0.86rem; color: var(--color-ink-secondary); }
.bld-cols, .bld-ex { display: grid; grid-template-columns: 20px minmax(0, 1fr) 52px 52px 112px 62px 58px 32px; gap: 6px; align-items: center; }
.bld-cols { padding: 6px 0 2px; font-size: 0.72rem; font-weight: 600; color: var(--color-gray-mid); }
.bld-ex { padding: 8px 0; border-top: 1px solid var(--color-gray-border); }
.bld-cols + .bld-ex { border-top: 0; }
.bld-ex-name { display: flex; flex-direction: column; min-width: 0; }
.bld-ex-name b { font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; }
.bld-note { align-self: flex-start; max-width: 100%; border: 0; background: none; padding: 0; font: inherit; font-size: 0.78rem; color: var(--color-ink-secondary); text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bld-cell { display: block; }
.bld-cell > span { display: none; font-size: 0.7rem; font-weight: 600; color: var(--color-gray-mid); }
.bld-f { width: 100%; height: 34px; padding: 0 6px; border: 1px solid var(--color-control-border); border-radius: var(--radius-md); background: var(--color-bg); font: inherit; font-size: 0.88rem; text-align: center; }
.bld-f:focus-visible { outline: 2px solid var(--color-ink); outline-offset: 1px; }
.bld-bad { border-color: var(--color-pain-ink); background: var(--color-pain-bg); }
.bld-note-edit { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 4px; }
.bld-note-edit textarea, .bld-settings textarea, .bld-settings input, .bld-settings select { width: 100%; padding: 6px 8px; border: 1px solid var(--color-control-border); border-radius: var(--radius-md); font: inherit; font-size: 0.88rem; }
.bld-lbl { display: block; margin-bottom: 4px; font-size: 0.78rem; font-weight: 600; }

.bld-add { padding-top: 8px; border-top: 1px solid var(--color-gray-border); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.bld-link { border: 0; background: none; padding: 4px 0; font: inherit; font-size: 0.86rem; font-weight: 600; color: var(--color-blue); cursor: pointer; }
.bld-btn { height: 36px; padding: 0 14px; border: 1px solid var(--color-control-border); border-radius: var(--radius-md); background: var(--color-bg); font: inherit; font-size: 0.86rem; font-weight: 600; cursor: pointer; }
.bld-btn:hover:not(:disabled) { background: var(--color-gray-light); }
.bld-primary { background: var(--color-blue); border-color: var(--color-blue); color: #fff; }
.bld-primary:hover:not(:disabled) { background: var(--color-blue-hover); }
.bld-btn:disabled { opacity: 0.6; cursor: default; }

.bld-settings { display: flex; flex-direction: column; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--color-gray-border); background: var(--color-gray-light); }
.bld-settings .bld-btn { align-self: flex-start; }
.bld-swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.bld-swatch { width: 28px; height: 28px; border-radius: var(--radius-pill); border: 2px solid transparent; cursor: pointer; }
.bld-swatch[aria-checked="true"] { border-color: var(--color-ink); box-shadow: 0 0 0 2px var(--color-bg) inset; }

.bld-addblock { padding: 10px 12px 12px; background: var(--color-gray-light); box-shadow: none; border: 1px dashed var(--color-control-border); }
.bld-addblock h3 { margin: 0 0 8px; font-size: 0.92rem; }
.bld-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.bld-chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--color-gray-border); border-radius: var(--radius-pill); background: var(--color-bg); font: inherit; font-size: 0.84rem; font-weight: 600; cursor: pointer; }
.bld-chip i { width: 10px; height: 10px; border-radius: var(--radius-pill); background: var(--block-color); }
.bld-chip:hover { background: var(--color-gray-light); }

.bld-side { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--color-bg); border-radius: var(--radius-xl); box-shadow: var(--shadow-e1); }
.bld-name { width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--color-control-border); border-radius: var(--radius-md); font: inherit; }
.bld-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bld-kpis div { background: var(--color-gray-light); border-radius: var(--radius-md); padding: 8px 10px; }
.bld-kpis span { display: block; font-size: 0.72rem; font-weight: 600; color: var(--color-ink-secondary); }
.bld-kpis b { font-size: 1.05rem; }
.bld-leave { display: flex; flex-direction: column; gap: 8px; }
.bld-leave p { margin: 0; font-size: 0.86rem; font-weight: 600; }
.bld-foot { margin: 0; font-size: 0.74rem; color: var(--color-ink-secondary); }
.bld-bar { display: none; }

@media (max-width: 960px) {
  .bld-layout { grid-template-columns: minmax(0, 1fr); }
  .bld-side { position: static; order: -1; }
  .bld-side .bld-primary { display: none; }
  .bld-foot { display: none; }
  .bld-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; background: var(--color-bg); box-shadow: 0 -1px 0 var(--color-gray-border); font-size: 0.86rem; font-weight: 600; }
}
@media (max-width: 640px) {
  .bld-cols { display: none; }
  .bld-ex { grid-template-columns: 20px repeat(5, minmax(0, 1fr)) 32px; }
  .bld-ex > .bld-grip { grid-row: 1; grid-column: 1; }
  .bld-ex-name { grid-row: 1; grid-column: 2 / 7; }
  .bld-ex > .bld-menu { grid-row: 1; grid-column: 7; justify-self: end; }
  .bld-ex > .bld-cell { grid-row: 2; }
  .bld-ex-name + .bld-cell { grid-column: 2; }
  .bld-ex-name + .bld-cell + .bld-cell { grid-column: 3; }
  .bld-ex-name + .bld-cell + .bld-cell + .bld-cell { grid-column: 4; }
  .bld-ex-name + .bld-cell + .bld-cell + .bld-cell + .bld-cell { grid-column: 5; }
  .bld-ex-name + .bld-cell + .bld-cell + .bld-cell + .bld-cell + .bld-cell { grid-column: 6; }
  .bld-cell > span { display: block; }
  .bld-bh { flex-wrap: wrap; row-gap: 2px; }
  .bld-sum { order: 5; flex-basis: 100%; margin-left: 38px; }
}
@media (prefers-reduced-motion: reduce) { .bld-chev { transition: none; } }

.bld-result { font-size: 0.78rem; font-weight: 600; color: var(--color-ok-ink); }
.bld-fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.bld-fieldset:disabled .bld-grip { cursor: default; opacity: 0.4; }
.bld-lock { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: var(--radius-lg); background: var(--color-ok-bg); color: var(--color-ok-ink); font-size: 0.9rem; font-weight: 600; }
.bld-field { display: flex; flex-direction: column; gap: 4px; }
.bld-field input, .bld-field select { width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--color-control-border); border-radius: var(--radius-md); font: inherit; background: var(--color-bg); }

/* Carga: número + menú «kg / % RM» (CYC-312). */
.bld-load { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0; align-items: center; }
.bld-load .bld-f { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.bld-unit { height: 34px; padding: 0 8px; border: 1px solid var(--color-control-border); border-left: 0; border-radius: 0 var(--radius-md) var(--radius-md) 0; background: var(--color-gray-light); font: inherit; font-size: 0.8rem; font-weight: 700; color: var(--color-blue); cursor: pointer; white-space: nowrap; }
.bld-unit:focus-visible { outline: 2px solid var(--color-ink); outline-offset: 1px; }
.bld-load-menu { position: absolute; left: 0; top: 100%; z-index: 30; width: 230px; margin-top: 4px; padding: 4px; background: var(--color-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-e2); display: flex; flex-direction: column; }
.bld-load-menu button { display: flex; flex-direction: column; gap: 2px; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: var(--radius-sm); font: inherit; cursor: pointer; color: var(--color-ink); }
.bld-load-menu button b { font-size: 0.9rem; }
.bld-load-menu button span { font-size: 0.8rem; color: var(--color-ink-secondary); }
.bld-load-menu button:hover { background: var(--color-gray-light); }
.bld-load-menu button[aria-checked="true"] { background: var(--color-blue-soft, var(--color-gray-light)); }
.bld-load-menu button[aria-checked="true"] b { color: var(--color-blue); }
.bld-load-menu .bld-load-off { cursor: not-allowed; }
.bld-load-menu .bld-load-off b { color: var(--color-gray-mid); }
.bld-load-menu .bld-load-off span { color: var(--color-warn-ink, var(--color-ink-secondary)); }
.bld-weight { grid-column: 1 / -1; justify-self: start; margin-top: 4px; padding: 2px 8px; border-radius: var(--radius-pill); background: var(--color-ok-bg); color: var(--color-ok-ink); font-size: 0.78rem; font-weight: 700; }
.bld-weight-off { background: var(--color-gray-light); color: var(--color-ink-secondary); }

/* Ficha del atleta: sección RM, calculadora e historial (CYC-312). */
.rm-section { display: flex; flex-direction: column; gap: 12px; }
.rm-h { margin: 8px 0 0; font-size: 1.1rem; }
.rm-banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: var(--radius-lg); background: var(--color-blue-bg, var(--color-gray-light)); font-size: 0.92rem; }
.rm-table { width: 100%; border-collapse: collapse; background: var(--color-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-e1); overflow: hidden; }
.rm-table th { padding: 10px 14px; text-align: left; font-size: 0.78rem; font-weight: 700; color: var(--color-ink-secondary); background: var(--color-gray-light); }
.rm-table td { padding: 10px 14px; border-top: 1px solid var(--color-gray-border); font-size: 0.92rem; }
.rm-table .rm-current { background: var(--color-gray-light); }
.rm-name { border: 0; background: none; padding: 0; font: inherit; font-weight: 700; cursor: pointer; color: var(--color-ink); text-align: left; }
.rm-name:hover { text-decoration: underline; }
.rm-actions { display: flex; gap: 14px; justify-content: flex-end; }
.rm-tag { display: inline-block; padding: 2px 10px; border-radius: var(--radius-pill); background: var(--color-gray-light); font-size: 0.78rem; font-weight: 700; }
.rm-tag-coach { background: var(--color-blue-bg, var(--color-gray-light)); color: var(--color-blue); }
.rm-from { font-size: 0.8rem; color: var(--color-ink-secondary); }
.rm-note, .rm-callout { margin: 0; padding: 10px 14px; border-radius: var(--radius-lg); background: var(--color-gray-light); font-size: 0.88rem; }
.rm-callout { background: var(--color-blue-bg, var(--color-gray-light)); }
.rm-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rm-static { display: flex; align-items: center; }
.rm-formula { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: var(--radius-lg); background: var(--color-blue-bg, var(--color-gray-light)); font-size: 0.9rem; }
.rm-formula-eq { font-size: 1.05rem; font-weight: 700; color: var(--color-blue); }
.rm-result { padding: 12px 14px; border-radius: var(--radius-lg); background: var(--color-blue-bg, var(--color-gray-light)); font-size: 1.2rem; font-weight: 800; }
.rm-rules { margin: 0; padding-left: 20px; font-size: 0.86rem; color: var(--color-ink-secondary); display: flex; flex-direction: column; gap: 4px; }
@media (max-width: 640px) { .rm-pair { grid-template-columns: 1fr; } .rm-table { display: block; overflow-x: auto; } .rm-banner { flex-direction: column; align-items: flex-start; } }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.bld-load-menu .bld-load-exit { display: block; padding: 8px 10px; border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 700; color: var(--color-blue); text-decoration: none; border-top: 1px solid var(--color-gray-border); }
.bld-load-menu .bld-load-exit:first-of-type { margin-top: 4px; }
.bld-load-menu .bld-load-exit:hover { background: var(--color-gray-light); }

/* Vista previa con el RM de una persona, sobre las filas de la rutina (CYC-312). */
.bld-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.bld-preview { display: flex; align-items: center; justify-content: flex-end; gap: 10px; font-size: 0.9rem; font-weight: 600; }
.bld-preview select { width: auto; min-width: 200px; text-align: left; }

/* Agregar una rutina a varios atletas (CYC-312). */
.bd-modal.rm-wide { width: min(860px, 100%); }
.rm-chips { display: flex; gap: 8px; }
.rm-chip { height: 34px; padding: 0 14px; border: 0; border-radius: var(--radius-pill); background: var(--color-gray-light); font: inherit; font-size: 0.9rem; font-weight: 700; color: var(--color-ink-secondary); cursor: pointer; }
.rm-chip-on { background: var(--color-blue-bg, var(--color-gray-light)); color: var(--color-blue); }
.rm-cell { display: inline-block; min-width: 72px; padding: 6px 10px; border-radius: var(--radius-md); text-align: center; font-size: 0.86rem; font-weight: 700; }
.rm-cell-ok { background: var(--color-ok-bg); color: var(--color-ok-ink); }
.rm-cell-off { background: var(--color-warn-bg); color: var(--color-warn-ink); }
.rm-off { opacity: 0.5; }
.rm-warn { margin: 0; padding: 12px 14px; border: 1px solid var(--color-warn-fill); border-radius: var(--radius-lg); background: var(--color-warn-bg); color: var(--color-ink); font-size: 0.9rem; }

/* Elegir las fechas de un ciclo (CYC-314, docs/diseno/ciclo-del-equipo): esquinas casi rectas. */
.cy-picker { display: flex; flex-direction: column; gap: 8px; }
.cy-cal { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 8px 12px 12px; border: 1px solid var(--color-gray-border); border-radius: 6px; }
.cy-mhead { display: flex; align-items: center; justify-content: space-between; }
.cy-mhead b { font-size: 0.95rem; font-weight: 600; }
.cy-nav { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 5px; background: none; font: inherit; font-size: 1.2rem; cursor: pointer; }
button.cy-nav:hover:not(:disabled) { background: var(--color-gray-light); }
.cy-nav:disabled { opacity: 0.3; cursor: default; }
.cy-nav-narrow { visibility: hidden; }
.cy-month table { width: 100%; border-collapse: separate; border-spacing: 0 2px; table-layout: fixed; }
.cy-month th { padding: 4px 0; color: var(--color-gray-mid); font-size: 0.72rem; font-weight: 600; }
.cy-month td { padding: 0; text-align: center; }
.cy-day { position: relative; width: 100%; height: 34px; border: 1px solid transparent; border-radius: 0; background: none; font: inherit; font-size: 0.88rem; cursor: pointer; color: var(--color-ink); }
.cy-day:hover:not(.cy-day-off) { background: var(--color-gray-light); }
.cy-day:focus-visible { outline: 2px solid var(--color-ink); outline-offset: -2px; }
.cy-day-today { border-color: var(--color-ink); border-radius: 5px; }
.cy-day-in, .cy-day-in:hover { background: var(--color-blue-bg, #e8eefb); }
.cy-day-edge, .cy-day-edge:hover:not(.cy-day-off) { background: var(--color-blue); border-radius: 5px; color: #fff; }
.cy-day-off { color: var(--color-control-border); cursor: not-allowed; }
.cy-day-edge.cy-day-off { color: #fff; }
.cy-day-busy { background: var(--color-warn-bg, #fdeede); color: #8f4410; }
.cy-dot { position: absolute; left: 50%; bottom: 3px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--color-warn-fill); }
.cy-summary { margin: 0; font-size: 0.92rem; font-weight: 600; }
.cy-note { margin: 0; padding: 10px 14px; border: 1px solid #b9c8ec; border-radius: 6px; background: var(--color-blue-bg, #e8eefb); font-size: 0.9rem; }
.cy-warn { position: sticky; top: 0; z-index: 2; margin: 0; padding: 10px 14px; border: 1px solid #f0c9a0; border-radius: 6px; background: #fdeede; color: #5b2d0a; font-size: 0.9rem; }
.cy-modal.bd-modal { width: min(660px, 100%); border-radius: 8px; }
.cy-modal .bd-inp, .cy-modal .bd-btn { border-radius: 6px; }
.cy-modal h2 { font-weight: 600; }
.cy-link { align-self: flex-start; border: 0; background: none; padding: 0; font: inherit; font-size: 0.88rem; font-weight: 600; color: var(--color-blue); cursor: pointer; }
@media (max-width: 640px) {
  .cy-cal { grid-template-columns: 1fr; }
  .cy-month-2 { display: none; }
  .cy-nav-narrow { visibility: visible; }
  .cy-day { height: 40px; }
}

/* Inicio del coach. Lenguaje con tarjetas con sombra suave y una tarjeta oscura
   arriba: excepción a "líneas finas, sin sombras" documentada en
   docs/brand/identidad-visual.md. */
body.hm-bg {
  background: var(--color-page);
}

.hm-page {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.hm-invite {
  width: auto;
  padding: 8px 16px;
}

/* ---------- Tarjeta oscura ---------- */
.hm-hero {
  position: relative;
  overflow: hidden;
  margin-bottom: 20px;
  padding: 28px 28px 26px;
  border-radius: 22px;
  background: var(--color-ink);
  color: #ffffff;
}

.hm-hero-art {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 52%;
  background-repeat: no-repeat;
  background-position: right center;
  background-size: cover;
}

.hm-hero-body {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 14px;
  max-width: 46%;
}

.hm-hero p {
  margin: 0;
}

.hm-hero-big {
  font-family: var(--font-display);
  font-size: 4rem;
  line-height: 0.95;
  font-weight: 700;
}

.hm-hero-big-text {
  font-size: 2.2rem;
  line-height: 1.05;
}

.hm-hero-big small {
  margin-left: 10px;
  font-family: Inter, system-ui, sans-serif;
  font-size: 1.15rem;
  font-weight: 500;
  color: #cfd6e4;
}

.hm-hero-line {
  font-size: 0.95rem;
  color: #e6ebf5;
}

.hm-hero-line b {
  color: #ffffff;
}

.hm-hero-cta {
  display: inline-flex;
  align-items: center;
  height: 40px;
  padding: 0 20px;
  border-radius: 999px;
  background: var(--color-brand);
  color: #06142e;
  font: 700 0.92rem Inter, system-ui, sans-serif;
  text-decoration: none;
}

.hm-hero-cta:hover {
  background: #5a9bfd;
}

.hm-hero-cta:focus-visible {
  outline: 2px solid #ffffff;
  outline-offset: 2px;
}

/* ---------- Cuerpo ---------- */
.hm-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 32px;
  align-items: start;
}

.hm-main {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
}

.hm-card {
  padding: 18px 20px;
  border: 0;
  border-radius: 18px;
  background: var(--color-bg);
  box-shadow: var(--shadow-card);
}

.hm-group-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 4px;
}

.hm-group-name {
  flex: 1;
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
}

.hm-avatar {
  display: flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--color-ink);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 700;
}

.hm-avatar-sm {
  width: 32px;
  height: 32px;
  font-size: 0.74rem;
}

/* Los avisos van apilados dentro de la tarjeta: etiqueta, texto y acciones. */
.hm-group .alert-row {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
}

.hm-group .alert-actions {
  flex-wrap: wrap;
}

/* ---------- Tus atletas ---------- */
.hm-side {
  position: sticky;
  top: 84px;
}

.hm-ath-list {
  margin: 8px 0 0;
  padding: 0;
  list-style: none;
}

.hm-ath-list li + li {
  border-top: 1px solid var(--color-gray-border);
}

.hm-ath {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  color: inherit;
  text-decoration: none;
}

a.hm-ath:hover .hm-ath-who b {
  text-decoration: underline;
}

.hm-ath-who {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-width: 0;
}

.hm-ath-who b {
  overflow: hidden;
  font-size: 0.92rem;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.hm-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  color: var(--color-ink-secondary);
}

.hm-dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.hm-dot-attention {
  background: var(--color-warn-fill);
}

.hm-dot-ok {
  background: #3b9b57;
}

.hm-dot-no_plan {
  background: var(--color-gray-mid);
}

.hm-dot-pending {
  border: 1.5px solid var(--color-gray-mid);
}

.hm-week {
  display: flex;
  align-items: center;
  gap: 6px;
}

.hm-beads {
  display: flex;
  gap: 4px;
}

.hm-bead {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--color-blue-200);
}

.hm-bead-done {
  background: var(--color-brand);
}

.hm-week-text {
  font-size: 0.74rem;
  color: var(--color-ink-secondary);
  font-variant-numeric: tabular-nums;
}

.hm-muted {
  margin: 8px 0 0;
  font-size: 0.88rem;
  color: var(--color-ink-secondary);
}

.hm-all {
  margin-top: 8px;
  padding-left: 0;
}

@media (max-width: 900px) {
  .hm-layout {
    grid-template-columns: minmax(0, 1fr);
  }

  .hm-side {
    position: static;
  }
}

@media (max-width: 760px) {
  .hm-hero-art {
    width: 100%;
    opacity: 0.35;
  }

  .hm-hero-body {
    max-width: 100%;
  }
}

@media (max-width: 640px) {
  .hm-hero {
    padding: 22px 20px;
  }

  .hm-hero-big {
    font-size: 3rem;
  }

  .hm-hero-big-text {
    font-size: 1.8rem;
  }
}

/* Detalle de un plan: cadena vertical de semanas. Comparte el lenguaje del
   Inicio del coach (fondo gris azulado, tarjetas con sombra, tarjeta oscura;
   ver home.css). Diseño en docs/diseno/grilla-del-plan/. */
.pl-page {
  display: flex;
  flex-direction: column;
}

.pl-title {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.pl-chips {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

/* Sobre el fondo gris azulado las etiquetas van en blanco con un borde fino. */
.pl-chips .pill {
  background: var(--color-bg);
  box-shadow: inset 0 0 0 1px var(--color-gray-border);
}

.pl-chips .pill-blue {
  background: var(--color-blue-100);
  color: var(--color-blue);
  box-shadow: none;
}

.pl-who {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--color-ink);
  font-size: 0.88rem;
  font-weight: 600;
  text-decoration: none;
}

.pl-who:hover {
  text-decoration: underline;
}

.pl-objective {
  margin: 0;
  max-width: 62ch;
}

.pl-edit {
  width: auto;
  padding: 8px 16px;
}

.pl-form {
  max-width: 460px;
  margin-bottom: 20px;
}

/* ---------- Cadena de semanas de la tarjeta oscura ---------- */
.pl-chain {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 0;
}

.pl-chain-bead {
  flex: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #34425c;
}

.pl-chain-bead.pl-chain-done {
  background: var(--color-brand);
}

.pl-chain-bead.pl-chain-now {
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(48, 128, 252, 0.4);
}

.pl-chain-link {
  flex: none;
  display: block;
  width: 14px;
  height: 2px;
  background: #34425c;
}

.pl-chain-link.pl-chain-done {
  background: var(--color-brand);
}

/* ---------- Asignar rutina ---------- */
.pl-panel {
  box-shadow: var(--shadow-e3);
  margin-bottom: 16px;
}

.pl-panel h2 {
  margin: 0 0 12px;
  font-size: 1.1rem;
  font-weight: 700;
}

.pl-panel .field {
  max-width: 360px;
}

.pl-check {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 4px 0 12px;
  font-size: 0.88rem;
}

.pl-check input {
  margin-top: 3px;
}

.pl-panel-actions {
  display: flex;
  gap: 8px;
}

.pl-panel-actions .button-primary,
.pl-panel-actions .button-secondary {
  width: auto;
  padding: 10px 20px;
}

/* ---------- Semanas ---------- */
.pl-section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin: 8px 0 12px;
}

.pl-section-head h2 {
  margin: 0;
  font-size: 1.1rem;
  font-weight: 700;
}

.pl-hint {
  font-size: 0.82rem;
  color: var(--color-ink-secondary);
  font-variant-numeric: tabular-nums;
}

.pl-spacer {
  flex: 1;
}

/* Cabecera del ciclo más baja para que el calendario quede a la vista
   (docs/diseno/ciclo-en-calendario). */
.pl-page .page-header {
  margin-bottom: 12px;
}

.pl-page .pl-objective {
  font-size: 0.9rem;
  color: var(--color-ink-secondary);
}

.pl-section-head .pc-legend {
  margin-left: auto;
}

/* Ficha del atleta: vistas Ciclo y Resumen, y selector de ciclo. */
.pl-views {
  display: inline-flex;
  gap: 4px;
  margin: 8px 0 16px;
  padding: 4px;
  border-radius: var(--radius-md);
  background: var(--color-bg);
  box-shadow: var(--shadow-e1);
}

.pl-view {
  min-height: 36px;
  padding: 0 18px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--color-ink-secondary);
  font: 600 0.9rem Inter, system-ui, sans-serif;
  cursor: pointer;
}

.pl-view-on {
  background: var(--color-ink);
  color: #fff;
}

.pl-view:focus-visible {
  outline: 2px solid var(--color-blue);
  outline-offset: 2px;
}

.pl-cycle-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.pl-cycle-select select {
  min-height: 40px;
  max-width: 280px;
  padding: 0 12px;
  border: 1px solid var(--color-control-border);
  border-radius: var(--radius-md);
  background: var(--color-bg);
  font: 600 0.95rem Inter, system-ui, sans-serif;
}

/* Calendario del atleta, tipo marcador de hábito (docs/diseno/plan-del-atleta). */
.cal-page {
  max-width: 760px;
  margin: 0 auto;
}

.cal-title {
  margin: 0 0 18px;
  font-family: var(--font-display);
  font-size: 2.25rem;
  line-height: 1.1;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.cal-weekdots {
  display: flex;
  gap: 6px;
}

.cal-weekdots i {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #3a3f48;
}

.cal-weekdots i.cal-dot-done {
  background: var(--color-brand);
}

.cal-mhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 14px 4px 8px;
}

.cal-mhead h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.3rem;
  text-transform: capitalize;
}

.cal-mnav {
  display: flex;
  gap: 4px;
}

.cal-mnav button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  background: none;
  color: var(--color-ink);
  cursor: pointer;
}

.cal-mnav button:hover:not(:disabled) {
  background: var(--color-gray-light);
}

.cal-mnav button:disabled {
  opacity: 0.35;
  cursor: default;
}

.cal-card {
  padding: 14px 10px 10px;
  border-radius: 18px;
  background: var(--color-bg);
  box-shadow: var(--shadow-card);
}

.cal-dow,
.cal-wk {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}

.cal-dow b {
  padding: 2px 0 8px;
  text-align: center;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--color-ink-secondary);
}

.cal-cell {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 50px;
  padding: 0;
  border: none;
  background: none;
  cursor: pointer;
}

.cal-m {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--color-ink);
}

.cal-m svg {
  width: 20px;
  height: 20px;
}

.cal-out .cal-m {
  color: #bfc4cc;
}

.cal-done .cal-m {
  background: var(--color-blue);
  color: #ffffff;
}

/* Los días seguidos se unen con una banda: la cadena de la marca. */
.cal-band::before {
  content: "";
  position: absolute;
  top: 50%;
  left: -1px;
  right: -1px;
  height: 22px;
  margin-top: -11px;
  background: var(--color-blue-200);
}

.cal-band.cal-first::before {
  left: 50%;
}

.cal-band.cal-last::before {
  right: 50%;
}

.cal-band.cal-first.cal-last::before {
  display: none;
}

.cal-skip .cal-m {
  background: var(--color-warn-bg);
  box-shadow: inset 0 0 0 1.5px var(--color-warn-fill);
  color: var(--color-warn-ink);
}

.cal-plan .cal-m {
  box-shadow: inset 0 0 0 1.5px var(--color-brand);
  color: var(--color-blue);
}

.cal-today .cal-m {
  font-weight: 800;
  box-shadow: 0 0 0 3px rgba(48, 128, 252, 0.35);
}

.cal-today.cal-plan .cal-m {
  box-shadow:
    inset 0 0 0 1.5px var(--color-brand),
    0 0 0 3px rgba(48, 128, 252, 0.35);
}

.cal-sel .cal-m {
  outline: 2px solid var(--color-ink);
  outline-offset: 2px;
}

.cal-cell:focus-visible .cal-m {
  outline: 2px solid var(--color-blue);
  outline-offset: 2px;
}

.cal-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 18px;
  margin-top: 6px;
  padding: 10px 12px 4px;
  border-top: 1px solid var(--color-gray-border);
  font-size: 0.82rem;
  color: var(--color-ink-secondary);
}

.cal-legend span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.cal-legend i {
  display: inline-block;
  width: 16px;
  height: 16px;
  border-radius: 50%;
}

.cal-lg-done {
  background: var(--color-blue);
}

.cal-lg-plan {
  box-shadow: inset 0 0 0 1.5px var(--color-brand);
}

.cal-lg-skip {
  background: var(--color-warn-bg);
  box-shadow: inset 0 0 0 1.5px var(--color-warn-fill);
}

.cal-dayhead {
  margin: 18px 4px 10px;
  font-family: var(--font-display);
  font-size: 1.1rem;
}

.cal-rows {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.cal-row {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 72px;
  padding: 14px 16px;
  border-radius: 18px;
  background: var(--color-bg);
  box-shadow: var(--shadow-card);
  color: inherit;
  text-decoration: none;
}

.cal-row-next {
  box-shadow:
    0 0 0 2px var(--color-brand),
    var(--shadow-card);
}

.cal-row:focus-visible {
  outline: 2px solid var(--color-blue);
  outline-offset: 2px;
}

.cal-node {
  display: flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border: 1.5px solid var(--color-gray-border);
  border-radius: 50%;
  background: var(--color-bg);
  font-weight: 700;
  color: var(--color-ink-secondary);
}

.cal-node svg {
  width: 18px;
  height: 18px;
}

.cal-node-done {
  border-color: var(--color-blue);
  background: var(--color-blue);
  color: #ffffff;
}

.cal-node-warn {
  border-color: var(--color-warn-fill);
  background: var(--color-warn-bg);
  color: var(--color-warn-ink);
}

.cal-row-next .cal-node {
  border-color: var(--color-blue);
  color: var(--color-blue);
}

.cal-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.cal-info b {
  font-size: 1rem;
  line-height: 1.3;
}

.cal-info span {
  font-size: 0.88rem;
  color: var(--color-ink-secondary);
}

.cal-row > svg {
  flex: none;
  color: var(--color-gray-mid);
}

.cal-empty {
  padding: 26px 22px;
  border-radius: 18px;
  background: var(--color-bg);
  box-shadow: var(--shadow-card);
  text-align: center;
  color: var(--color-ink-secondary);
}

@media (max-width: 640px) {
  .cal-title {
    font-size: 1.75rem;
  }

  .cal-cell {
    height: 46px;
  }

  .cal-m {
    width: 36px;
    height: 36px;
  }
}

/* Calendario del ciclo y tablero "Esta semana" del Inicio del coach.
   Diseño en docs/diseno/ciclo-en-calendario/. Tres niveles de elevación
   (--shadow-e1/e2/e3, ver global.css) y esqueletos de carga. Espaciado en
   escala de 4 px. */

/* ---------- Sesión hecha: check en círculo verde ---------- */
.ok-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--color-ok-ink);
  color: #ffffff;
  box-shadow: 0 1px 2px rgba(30, 107, 50, 0.35);
}

.ok-badge svg {
  width: 14px;
  height: 14px;
}

.ok-badge-sm {
  width: 16px;
  height: 16px;
}

.ok-badge-sm svg {
  width: 11px;
  height: 11px;
}

/* ---------- Franja oscura delgada (ciclo e Inicio) ---------- */
.cy-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 16px;
  margin-bottom: 12px;
  padding: 16px 20px;
  border-radius: 16px;
  background: var(--color-ink);
  color: #ffffff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), var(--shadow-e2);
}

.cy-strip-week {
  display: flex;
  align-items: baseline;
  gap: 8px;
  color: #cfd6e4;
  font-size: 0.92rem;
}

.cy-strip-title {
  font-family: var(--font-display);
  font-size: 1.5rem;
  line-height: 1;
  font-weight: 700;
  color: #ffffff;
}

.cy-strip-line {
  flex: 1;
  min-width: 200px;
  margin: 0;
  font-size: 0.92rem;
  color: #e6ebf5;
}

.cy-strip-cta {
  display: inline-flex;
  align-items: center;
  height: 36px;
  padding: 0 16px;
  border-radius: 999px;
  background: #2b3038;
  box-shadow: inset 0 0 0 1px #4a5160;
  color: #ffffff;
  font: 600 0.88rem Inter, system-ui, sans-serif;
  text-decoration: none;
  transition: background-color 120ms ease;
}

.cy-strip-cta:hover {
  background: #353b46;
}

.cy-strip-cta:focus-visible {
  outline: 2px solid #ffffff;
  outline-offset: 2px;
}

/* ---------- Leyenda ---------- */
.pc-legend {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px;
  font-size: 0.8rem;
  color: var(--color-ink-secondary);
}

.pc-legend > span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.pc-legend-swatch {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 4px;
  background: var(--color-bg);
  box-shadow: var(--shadow-e1);
}

.pc-legend-skip {
  background: var(--color-warn-bg);
}

/* ---------- Calendario del ciclo ---------- */
.pc-head,
.pc-week {
  display: grid;
  grid-template-columns: 112px repeat(7, minmax(0, 1fr)) 132px;
  gap: 8px;
  padding: 0 16px;
}

.pc-head {
  position: sticky;
  top: var(--app-header-h);
  z-index: 3;
  padding-top: 8px;
  padding-bottom: 8px;
  background: var(--color-page);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--color-ink-secondary);
}

.pc-head span {
  padding: 0 4px;
}

.pc-weeks {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.pc-week {
  align-items: stretch;
  padding-top: 12px;
  padding-bottom: 12px;
  border-radius: 16px;
  background: var(--color-bg);
  box-shadow: var(--shadow-e1);
  animation: cy-rise 220ms ease-out both;
}

.pc-week-past {
  box-shadow: 0 0 0 1px rgba(31, 34, 40, 0.06), 0 1px 2px rgba(31, 34, 40, 0.04);
}

.pc-week-current {
  box-shadow: 0 0 0 2px var(--color-brand), var(--shadow-e2);
}

.pc-weeklabel {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 6px 8px;
  border: 0;
  border-radius: 10px;
  background: none;
  color: var(--color-ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: background-color 120ms ease;
}

.pc-weeklabel:hover {
  background: var(--color-gray-light);
}

.pc-weeklabel:focus-visible,
.pc-cell:focus-visible,
.pc-add:focus-visible,
.pc-chip:focus-visible {
  outline: 2px solid var(--color-blue);
  outline-offset: 2px;
}

.pc-weeklabel b {
  font-size: 0.95rem;
}

.pc-weeklabel small {
  font-size: 0.8rem;
  color: var(--color-ink-secondary);
}

.pc-now {
  font-size: 0.74rem;
  font-weight: 700;
  color: var(--color-blue);
}

.pc-day {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.pc-day-name {
  display: none;
}

.pc-day-today {
  border-radius: 14px;
  background: var(--color-blue-50);
  padding: 4px;
  margin: -4px;
}

.pc-cell {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
  min-height: 88px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--color-bg);
  box-shadow: var(--shadow-e1);
  color: var(--color-ink);
  text-decoration: none;
  transition: box-shadow 150ms ease, transform 150ms ease;
}

.pc-cell:hover {
  box-shadow: var(--shadow-e2);
  transform: translateY(-2px);
}

.pc-cell:active {
  transform: none;
  box-shadow: var(--shadow-e1);
}

.pc-day-today .pc-cell {
  box-shadow: 0 0 0 2px var(--color-brand), var(--shadow-e2);
}

.pc-cell b {
  padding-right: 22px;
  overflow: hidden;
  font-size: 0.92rem;
  font-weight: 600;
  line-height: 1.25;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pc-cell-day {
  position: absolute;
  top: 10px;
  right: 12px;
  font-size: 0.78rem;
  color: var(--color-ink-secondary);
  font-variant-numeric: tabular-nums;
}

.pc-cell-state {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  min-width: 0;
}

.pc-cell-state .pill {
  max-width: 100%;
  overflow: hidden;
  font-size: 0.76rem;
  text-overflow: ellipsis;
}

.pc-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 0.8rem;
  color: var(--color-ink-secondary);
  font-variant-numeric: tabular-nums;
}

.pc-pending {
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--color-ink-secondary);
}

.pc-note {
  font-size: 0.8rem;
  color: var(--color-warn-ink);
}

/* Hecha: verde sombreado, hundido. */
.pc-cell-done {
  background: var(--color-done-bg);
  color: var(--color-done-ink);
  box-shadow: 0 0 0 1px var(--color-done-ring), inset 0 3px 6px rgba(30, 107, 50, 0.16);
}

.pc-cell-done:hover {
  box-shadow: 0 0 0 1px #a7cfb3, inset 0 3px 6px rgba(30, 107, 50, 0.16), 0 6px 14px -6px rgba(30, 107, 50, 0.3);
}

.pc-cell-done .pc-facts,
.pc-cell-done .pc-cell-day {
  color: var(--color-done-ink-2);
}

.pc-cell-skip {
  background: var(--color-warn-bg);
  box-shadow: 0 0 0 1px #f0d3b3, 0 1px 2px rgba(154, 74, 0, 0.1), 0 3px 8px -2px rgba(154, 74, 0, 0.12);
}

.pc-add {
  position: relative;
  flex: 1;
  min-height: 88px;
  border: 1.5px dashed var(--color-control-border);
  border-radius: 12px;
  background: transparent;
  color: var(--color-ink-secondary);
  font: 600 1.15rem Inter, system-ui, sans-serif;
  cursor: pointer;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
}

.pc-add .pc-cell-day {
  color: #a2a7b0;
}

/* Otra sesión en un día ocupado: un «+» pequeño y tenue bajo las sesiones. */
.pc-add-more {
  flex: none;
  min-height: 28px;
  border-color: transparent;
  color: #a2a7b0;
  font-size: 1rem;
}

.pc-add-more .pc-cell-day {
  display: none;
}

.pc-day:hover .pc-add-more,
.pc-add-more:focus-visible {
  border-color: var(--color-control-border);
  color: var(--color-ink-secondary);
}

/* Panel de asignar abierto sobre este día. */
.pc-add-open,
.pc-add-open:hover {
  border-style: solid;
  border-color: var(--color-brand);
  background: var(--color-blue-50);
  color: var(--color-blue);
}

.pc-add:hover {
  border-color: var(--color-brand);
  background: var(--color-blue-50);
  color: var(--color-blue);
}

.pc-day-today .pc-add {
  background: var(--color-blue-50);
}

.pc-none {
  display: block;
  min-height: 88px;
}

/* Semana pasada plegada: una línea con una etiqueta por sesión. */
.pc-mini {
  grid-column: 2 / 9;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 0 4px;
  font-size: 0.84rem;
  color: var(--color-ink-secondary);
}

.pc-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 12px;
  border-radius: 999px;
  background: var(--color-bg);
  box-shadow: var(--shadow-e1);
  color: var(--color-ink);
  font-weight: 600;
  text-decoration: none;
}

.pc-chip-done {
  background: var(--color-done-bg);
  color: var(--color-done-ink);
  box-shadow: 0 0 0 1px var(--color-done-ring), inset 0 2px 4px rgba(30, 107, 50, 0.14);
}

.pc-chip-skip {
  background: var(--color-warn-bg);
  color: var(--color-warn-ink);
}

.pc-summary {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding-left: 4px;
  font-size: 0.82rem;
  color: var(--color-ink-secondary);
  font-variant-numeric: tabular-nums;
}

.pc-summary b {
  font-size: 0.95rem;
  color: var(--color-ink);
}

/* ---------- Tablero "Esta semana" del Inicio ---------- */
.cb-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin: 4px 4px 12px;
}

.cb-bar .section-title {
  margin: 0;
}

.cb-spacer {
  flex: 1;
}

.cb-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 5px 14px;
  border: 0;
  border-radius: var(--radius-md);
  background: var(--color-bg);
  box-shadow: var(--shadow-e1);
  color: var(--color-ink-secondary);
  font: 700 0.82rem Inter, system-ui, sans-serif;
  cursor: pointer;
  transition: box-shadow 150ms ease, background-color 120ms ease;
}

.cb-chip:hover {
  box-shadow: var(--shadow-e2);
}

.cb-chip:focus-visible {
  outline: 2px solid var(--color-blue);
  outline-offset: 2px;
}

.cb-chip[aria-pressed="true"] {
  background: var(--color-ink);
  color: #ffffff;
}

.cb-chip em {
  padding: 0 7px;
  border-radius: 999px;
  background: var(--color-pain-bg);
  color: var(--color-pain-ink);
  font-size: 0.74rem;
  font-style: normal;
}

.cb-head,
.cb-row {
  display: grid;
  grid-template-columns: 220px repeat(7, minmax(116px, 1fr)) 88px;
  gap: 8px;
}

.cb-head {
  position: sticky;
  top: var(--app-header-h);
  z-index: 3;
  padding: 8px 16px;
  background: var(--color-page);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--color-ink-secondary);
}

.cb-head span {
  padding: 0 4px;
}

.cb-head .cb-head-today {
  color: var(--color-blue);
}

.cb-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.cb-card {
  border-radius: var(--radius-lg);
  background: var(--color-bg);
  box-shadow: var(--shadow-e1);
  transition: box-shadow 150ms ease, transform 150ms ease;
  animation: cy-rise 220ms ease-out both;
}

.cb-card:hover {
  box-shadow: var(--shadow-e2);
  transform: translateY(-1px);
}

.cb-card-pain {
  box-shadow: inset 4px 0 0 #d5484d, var(--shadow-e1);
}

.cb-card-warn {
  box-shadow: inset 4px 0 0 var(--color-warn-fill), var(--shadow-e1);
}

.cb-row {
  align-items: stretch;
  padding: 12px 16px;
}

.cb-who {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.cb-who-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  font-size: 0.95rem;
}

.cb-who-text b,
.cb-who-text a {
  overflow: hidden;
  color: var(--color-ink);
  font-weight: 700;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cb-who-text a:hover {
  text-decoration: underline;
}

.cb-who-text small {
  overflow: hidden;
  font-size: 0.8rem;
  color: var(--color-ink-secondary);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cb-badge {
  align-self: flex-start;
  margin-top: 2px;
  border: 0;
  font-family: inherit;
  cursor: pointer;
}

.cb-badge:hover {
  filter: brightness(0.96);
}

.cb-badge:focus-visible {
  outline: 2px solid var(--color-blue);
  outline-offset: 2px;
}

.cb-day {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
  padding: 2px;
  border-radius: var(--radius-sm);
}

.cb-day-today {
  background: var(--color-blue-50);
}

.cb-tile {
  position: relative;
  display: flex;
  flex: none;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  min-height: 76px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: var(--color-bg);
  box-shadow: var(--shadow-e1);
  color: var(--color-ink);
  font-size: 0.84rem;
  font-weight: 600;
  line-height: 1.3;
  text-decoration: none;
  transition: box-shadow 150ms ease, transform 150ms ease;
}

.cb-tile:hover {
  box-shadow: var(--shadow-e2);
  transform: translateY(-2px);
}

.cb-tile:focus-visible {
  outline: 2px solid var(--color-blue);
  outline-offset: 2px;
}

.cb-day-today .cb-tile {
  box-shadow: 0 0 0 2px var(--color-brand), var(--shadow-e2);
}

.cb-tile-name {
  display: -webkit-box;
  overflow: hidden;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow-wrap: anywhere;
}

/* Más de tres sesiones en un día: se ven tres y el resto se abre con este botón. */
.cb-more {
  min-height: 32px;
  padding: 4px 6px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--color-blue);
  font: 700 0.78rem Inter, system-ui, sans-serif;
  text-decoration: underline;
  white-space: nowrap;
  cursor: pointer;
}

.cb-more:hover {
  background: var(--color-blue-100);
}

.cb-more:focus-visible {
  outline: 2px solid var(--color-blue);
  outline-offset: 2px;
}

.cb-tile-state {
  display: flex;
  align-items: center;
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--color-ink-secondary);
}

.cb-tile em {
  font-size: 0.76rem;
  font-style: normal;
  font-weight: 700;
  color: var(--color-pain-ink);
}

.cb-glyph {
  display: none;
  width: 18px;
  height: 18px;
}

.cb-tile-done {
  background: var(--color-done-bg);
  color: var(--color-done-ink);
  box-shadow: 0 0 0 1px var(--color-done-ring), inset 0 3px 6px rgba(30, 107, 50, 0.16);
}

.cb-tile-done:hover {
  box-shadow: 0 0 0 1px #a7cfb3, inset 0 3px 6px rgba(30, 107, 50, 0.16), 0 6px 14px -6px rgba(30, 107, 50, 0.3);
}

.cb-tile-skip {
  background: var(--color-warn-bg);
  color: var(--color-warn-ink);
  box-shadow: 0 0 0 1px #f0d3b3, 0 1px 2px rgba(154, 74, 0, 0.1);
}

.cb-tile-skip .cb-tile-state {
  color: var(--color-warn-ink);
}

.cb-message {
  grid-column: 2 / 9;
  align-self: center;
  margin: 0;
  font-size: 0.9rem;
  color: var(--color-ink-secondary);
}

.cb-summary {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-left: 4px;
  font-variant-numeric: tabular-nums;
}

.cb-summary b {
  font-size: 1rem;
}

.cb-summary small {
  font-size: 0.76rem;
  color: var(--color-ink-secondary);
}

.cb-detail {
  padding: 0 16px 16px;
  border-top: 1px solid var(--color-gray-light);
}

.cb-none {
  padding: 32px;
  border-radius: var(--radius-lg);
  background: var(--color-bg);
  box-shadow: var(--shadow-e1);
  color: var(--color-ink-secondary);
  text-align: center;
}

/* Grilla de la semana en pantallas anchas: una línea fina separa cada día, de
   arriba a abajo de la tarjeta; «hoy» se marca más y el fin de semana va en un
   gris apenas más oscuro. (En angosto cada día lleva su propia etiqueta.) */
@media (min-width: 1280px) {
  .cb-head-day,
  .cb-day,
  .cb-summary {
    position: relative;
  }

  .cb-head-day::after,
  .cb-day::after,
  .cb-summary::after {
    content: "";
    position: absolute;
    left: -5px;
    top: -12px;
    bottom: -12px;
    width: 1px;
    background: var(--color-gray-border);
    pointer-events: none;
  }

  .cb-head-day::after {
    top: -8px;
    bottom: -8px;
  }

  /* Los días ocupan todo el alto de la fila, no solo el de sus sesiones. */
  .cb-day {
    margin: -12px 0;
    padding: 14px 2px;
    border-radius: 0;
  }

  .cb-day-weekend {
    background: var(--color-gray-light);
  }

  .cb-day-today {
    background: var(--color-blue-100);
  }

  .cb-head-today::before {
    content: "";
    position: absolute;
    inset: -8px 0 -8px 0;
    z-index: -1;
    background: var(--color-blue-100);
  }

  /* Las columnas de la ficha y el resumen no se ven afectadas por el margen. */
  .cb-day-empty {
    min-height: 76px;
  }
}

/* Tablero en tablet y portátil chico (hasta 1279 px): el nombre y el resumen van
   arriba y los siete días debajo, sin barra horizontal. */
@media (max-width: 1279px) {
  .cb-head {
    display: none;
  }

  .cb-row {
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px 12px;
    padding: 12px;
  }

  .cb-who {
    grid-column: 1;
  }

  .cb-summary {
    grid-column: 2;
    grid-row: 1;
    align-items: flex-end;
    padding: 0;
  }

  .cb-row > .cb-day,
  .cb-row > .cb-message {
    grid-row: 2;
  }

  /* Siete columnas de ancho completo: el resumen va arriba, junto al nombre,
     y no le quita ancho a los días. */
  .cb-row {
    grid-template-columns: repeat(7, minmax(0, 1fr));
  }

  .cb-who {
    grid-column: 1 / 6;
  }

  .cb-summary {
    grid-column: 6 / 8;
  }

  .cb-message {
    grid-column: 1 / 8;
  }

  .cb-day::before {
    content: attr(data-d);
    display: block;
    text-align: center;
    white-space: nowrap;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--color-ink-secondary);
  }

  .cb-day-today::before {
    color: var(--color-blue);
  }

  .cb-row > .cb-day {
    grid-column: span 1;
  }

  .cb-tile {
    min-height: 76px;
    padding: 8px 6px;
    border-radius: 6px;
    font-size: 0.78rem;
  }

  .cb-tile-state {
    font-size: 0.72rem;
  }

  .cb-day-empty::after {
    content: "";
    display: block;
    min-height: 76px;
    border-radius: 6px;
    background: var(--color-gray-light);
  }
}

/* Móvil: cada sesión es un glifo de 44 px; varias en un día se apilan. */
@media (max-width: 640px) {
  .cb-tile {
    flex: none;
    height: 44px;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 6px 2px;
    text-align: center;
  }

  .cb-tile-name,
  .cb-tile-state,
  .cb-tile em {
    display: none;
  }

  .cb-glyph {
    display: block;
  }

  .cb-tile-done .cb-glyph {
    color: var(--color-ok-ink);
  }

  .cb-day-empty::after {
    min-height: 44px;
  }
}

@media (max-width: 1000px) {
  .pc-head {
    display: none;
  }
}

@media (max-width: 1000px) and (min-width: 761px) {
  .pc-head,
  .pc-week {
    grid-template-columns: 92px repeat(7, minmax(0, 1fr)) 100px;
    gap: 6px;
    padding: 0 12px;
  }

  .pc-head {
    display: grid;
  }

  .pc-cell {
    padding: 8px;
  }

  .pc-cell b {
    font-size: 0.84rem;
  }
}

@media (max-width: 760px) {
  .pc-week {
    display: block;
    padding: 12px 16px;
  }

  .pc-weeklabel {
    flex-direction: row;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
  }

  .pc-summary {
    flex-direction: row;
    flex-wrap: wrap;
    gap: 12px;
    padding: 8px;
  }

  .pc-day {
    flex-direction: row;
    gap: 12px;
    margin-top: 8px;
    padding: 0;
  }

  .pc-day-today {
    margin: 8px -4px 0;
    padding: 4px;
  }

  .pc-day-rest {
    display: none;
  }

  .pc-day-name {
    display: block;
    flex: none;
    width: 52px;
    padding-top: 10px;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--color-ink-secondary);
  }

  .pc-cell,
  .pc-add {
    flex: 1;
    min-height: 72px;
  }

  .pc-add > .pc-cell-day {
    display: none;
  }

  .pc-add-more {
    flex: none;
    width: 40px;
    min-height: 72px;
  }

  .pc-cell > .pc-cell-day {
    display: none;
  }

  .pc-cell b {
    padding-right: 0;
  }

  .pc-mini {
    padding: 8px 4px 0;
  }
}

/* ---------- Esqueletos de carga ---------- */
.sk {
  display: block;
  max-width: 100%;
  border-radius: 8px;
  background: var(--color-skeleton);
  animation: cy-pulse 1.4s ease-in-out infinite;
}

.sk-circle {
  border-radius: 50%;
}

.sk-tile {
  border-radius: var(--radius-sm);
}

.cy-strip .sk {
  background: #3a4150;
}

.cy-sk-strip {
  min-height: 64px;
}

.cy-sk-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.pc-skeleton {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.pc-sk-week {
  align-items: center;
}

.pc-sk-label,
.cb-sk-label {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.cb-sk-row {
  align-items: center;
  border-radius: var(--radius-lg);
  background: var(--color-bg);
  box-shadow: var(--shadow-e1);
}

.cb-sk-who {
  display: flex;
  align-items: center;
  gap: 12px;
}

.cb-sk-who .cb-sk-label {
  flex: 1;
}

.cb-sk-cell,
.pc-sk-cell {
  min-width: 0;
}

@keyframes cy-pulse {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.45;
  }
}

@keyframes cy-rise {
  from {
    opacity: 0.4;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@media (max-width: 1279px) {
  .cb-sk-row {
    grid-template-columns: repeat(7, minmax(0, 1fr)) auto;
  }

  .cb-sk-who {
    grid-column: 1 / 8;
  }

  .cb-sk-sum {
    grid-column: 8;
    grid-row: 1;
  }
}

@media (max-width: 760px) {
  .pc-sk-week {
    display: block;
  }

  .pc-sk-cell {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .sk {
    animation: none;
    opacity: 0.7;
  }

  .pc-week,
  .cb-card {
    animation: none;
  }

  .pc-cell,
  .cb-tile,
  .cb-card {
    transition: none;
  }

  .pc-cell:hover,
  .cb-tile:hover,
  .cb-card:hover {
    transform: none;
  }
}

/* Sesión sin fecha: cae en el día que sugiere el ciclo y se marca como tentativa. */
.pc-cell-tent {
  outline: 1.5px dashed var(--color-control-border);
  outline-offset: -1.5px;
}

.pc-tent {
  font-size: 0.74rem;
  font-weight: 600;
  color: var(--color-ink-secondary);
}

.pc-tent-note {
  margin: 0 0 12px;
  font-size: 0.84rem;
  color: var(--color-ink-secondary);
}

/* ---------- Inicio del coach: escala de radios nueva (CYC-207) ----------
   Solo el Inicio: el resto de la app sigue con sus radios hasta CYC-208. */
.app-main-inicio .cy-strip {
  border-radius: var(--radius-lg);
}

.app-main-inicio .cy-strip-cta,
.app-main-inicio .hm-invite {
  min-height: 40px;
  border-radius: var(--radius-md);
}

/* Pizarra del ciclo (CYC-179). Diseño en docs/diseno/ciclos-pizarra: variante A,
   panel de rutinas a la derecha. Los colores salen de los tokens de global.css. */
body.wide-main .app-main { max-width: 1360px; }
.bd { display: flex; flex-direction: column; gap: 0; }

.bd-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--color-bg); color: var(--color-ink); box-shadow: var(--shadow-e1); font: inherit; font-size: 0.86rem; font-weight: 600; text-decoration: none; white-space: nowrap; cursor: pointer; transition: box-shadow 150ms ease, transform 150ms ease, background-color 120ms ease; }
.bd-btn:hover { box-shadow: var(--shadow-e2); transform: translateY(-1px); }
.bd-btn:active { transform: none; box-shadow: var(--shadow-e1); }
.bd-btn-p { background: var(--color-blue); color: #fff; }
.bd-btn-p:hover { background: var(--color-blue-hover); }
.bd-btn-sm { height: 30px; padding: 0 12px; font-size: 0.8rem; }
.bd-btn[disabled] { opacity: 0.5; cursor: not-allowed; transform: none; }
.bd-ghost { height: 30px; padding: 0 10px; border: 0; border-radius: 999px; background: transparent; color: var(--color-ink-secondary); font: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
.bd-ghost:hover { background: var(--color-gray-light); color: var(--color-ink); }
.bd button:focus-visible, .bd a:focus-visible, .bd select:focus-visible, .bd input:focus-visible, .bd [tabindex]:focus-visible,
.bd-pop button:focus-visible, .bd-pop select:focus-visible, .bd-pop input:focus-visible, .bd-pop a:focus-visible { outline: 2px solid var(--color-blue); outline-offset: 2px; }

.bd-hint { margin: 4px 0; font-size: 0.8rem; color: var(--color-ink-secondary); }
.bd-lbl { display: block; font-size: 0.78rem; font-weight: 700; color: var(--color-ink-secondary); margin-bottom: 4px; }
.bd-inp { box-sizing: border-box; width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--color-control-border); border-radius: var(--radius-md); background: var(--color-bg); font: inherit; font-size: 0.92rem; }

/* Barra del calendario */
.bd-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; margin: 4px 0 12px; }
.bd-bar h2 { margin: 0; font-size: 1rem; font-weight: 700; }

.bd-sw { display: inline-block; width: 12px; height: 12px; border-radius: var(--radius-xs); background: var(--color-bg); box-shadow: inset 0 0 0 1px var(--color-gray-border); }
.bd-sw-skip { background: var(--color-warn-bg); box-shadow: inset 0 0 0 1px #f0d3b3; }
.bd-save { display: inline-flex; align-items: center; gap: 6px; min-width: 96px; font-size: 0.8rem; font-weight: 600; color: var(--color-ink-secondary); }
