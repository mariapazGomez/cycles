.bd-save-err { color: var(--color-pain-ink); }
.bd-spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--color-blue-200); border-top-color: var(--color-blue); animation: bd-rot 0.8s linear infinite; }
@keyframes bd-rot { to { transform: rotate(360deg); } }
.bd-rail-toggle { display: none; }

.bd-banner { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 12px; padding: 10px 16px; border-radius: var(--radius-lg); background: var(--color-bg); box-shadow: var(--shadow-e1); font-size: 0.88rem; }
.bd-banner > span { flex: 1; min-width: 200px; }
.bd-banner-info { background: var(--color-blue-50); color: var(--color-blue-700); }
.bd-banner-warn { background: var(--color-warn-bg); color: var(--color-warn-ink); }
.bd-banner-err { background: var(--color-pain-bg); color: var(--color-pain-ink); }

/* Composición: calendario + panel */
.bd-layout { display: grid; grid-template-columns: minmax(0, 1fr) 272px; gap: 16px; align-items: start; }
.bd-layout-ro { grid-template-columns: minmax(0, 1fr); }
.bd-main { min-width: 0; }
.bd-rail { position: sticky; top: calc(var(--app-header-h) + 8px); display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - var(--app-header-h) - 24px); overflow: auto; padding: 12px; border-radius: var(--radius-lg); background: var(--color-bg); box-shadow: var(--shadow-e2); }
.bd-rail > *, .bd-rlist li { min-width: 0; }
.bd-rail-head h2 { margin: 0; font-size: 1rem; }
.bd-search { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: var(--radius-md); background: var(--color-gray-light); box-shadow: inset 0 0 0 1px var(--color-gray-border); }
.bd-search svg { width: 16px; height: 16px; flex: none; color: var(--color-control-border); }
.bd-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; font-size: 0.86rem; }
.bd-rlist { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.bd-ritem { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 12px; background: var(--color-bg); color: var(--color-ink); box-shadow: var(--shadow-e1); font: inherit; text-align: left; cursor: grab; user-select: none; transition: box-shadow 150ms ease, transform 150ms ease; }
.bd-ritem:hover { box-shadow: var(--shadow-e2); transform: translateY(-1px); }
.bd-ritem:active { cursor: grabbing; }
.bd-ritem-lift { opacity: 0.5; box-shadow: 0 0 0 2px var(--color-brand); }
.bd-ritem-dis { opacity: 0.5; cursor: not-allowed; }
.bd-rlist-pop { max-height: 240px; overflow: auto; padding: 2px; }
.bd-rlist-pop .bd-ritem { cursor: pointer; }
.bd-grip { color: var(--color-control-border); flex: none; display: inline-flex; }
.bd-grip svg { width: 16px; height: 16px; }
.bd-nm { display: flex; flex: 1; flex-direction: column; gap: 2px; min-width: 0; }
.bd-nm b { font-size: 0.88rem; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.bd-nm small { font-size: 0.74rem; color: var(--color-ink-secondary); }
.bd-new { margin-top: 2px; }
.bd-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px 16px; border-radius: var(--radius-lg); background: var(--color-gray-light); text-align: center; }
.bd-empty p { margin: 0; font-size: 0.86rem; color: var(--color-ink-secondary); }

/* Calendario */
.bd-gh, .bd-wr { display: grid; grid-template-columns: 104px repeat(7, minmax(0, 1fr)); gap: 6px; padding: 0 10px; }
.bd-gh { padding-bottom: 6px; font-size: 0.78rem; font-weight: 600; color: var(--color-ink-secondary); }

.bd-weeks { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.bd-wr { padding-top: 10px; padding-bottom: 10px; border-radius: var(--radius-lg); background: var(--color-bg); box-shadow: var(--shadow-e1); align-items: stretch; }
.bd-wr-cur { box-shadow: 0 0 0 2px var(--color-brand), var(--shadow-e2); }
.bd-wl { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 4px; font-size: 0.84rem; }
.bd-wl b { font-size: 0.92rem; }
.bd-wl small { color: var(--color-ink-secondary); font-size: 0.78rem; }
.bd-wsum { font-size: 0.74rem; font-weight: 600; color: var(--color-ink-secondary); }

.bd-dc { position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 104px; padding: 8px; border-radius: 12px; background: var(--color-bg); box-shadow: inset 0 0 0 1px var(--color-gray-border); transition: background-color 120ms ease, box-shadow 120ms ease; }
.bd-dc-today { background: var(--color-blue-50); box-shadow: inset 0 0 0 2px var(--color-brand); }
.bd-top { display: flex; align-items: center; justify-content: space-between; gap: 4px; min-height: 24px; }
.bd-dn { font-size: 0.76rem; color: var(--color-ink-secondary); font-variant-numeric: tabular-nums; }
.bd-dn-w { display: none; }
.bd-dc-today .bd-dn { color: var(--color-blue); font-weight: 700; }
.bd-plus { display: flex; align-items: center; justify-content: center; flex: none; width: 24px; height: 24px; padding: 0; border: 1.5px solid var(--color-control-border); border-radius: 50%; background: var(--color-bg); color: var(--color-ink-secondary); cursor: pointer; transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, transform 150ms ease; }
.bd-plus svg { width: 12px; height: 12px; }
.bd-plus:hover, .bd-plus[aria-expanded="true"] { background: var(--color-blue); border-color: var(--color-blue); color: #fff; transform: scale(1.08); }
.bd-plus-faint { background: transparent; color: var(--color-ink-secondary); }

.bd-cards { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

/* Días que no aceptan sesiones: fuera del ciclo (rayado) y días pasados */
.bd-dc-off { color: var(--color-control-border); }
.bd-dc-out { background: repeating-linear-gradient(135deg, #f6f7f9, #f6f7f9 6px, #eef0f3 6px, #eef0f3 12px); }
.bd-dc-off:not(.bd-dc-has)::after, .bd-dc-dropbad::after { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); font-size: 0.68rem; font-weight: 600; white-space: nowrap; pointer-events: none; }
.bd-dc-off:not(.bd-dc-has)::after { color: var(--color-ink-secondary); }
.bd-dc[data-why="out"]:not(.bd-dc-has)::after { content: "Fuera del ciclo"; }

.bd-dc-dropbad::after { padding: 1px 8px; border-radius: var(--radius-pill); background: var(--color-pain-ink); color: #fff; }
.bd-dc-dropbad[data-why="out"]::after { content: "Fuera del ciclo"; }
.bd-dc-dropbad[data-why="past"]::after { content: "Día pasado"; }

/* Tarjeta de sesión */
.bd-ses { position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 8px 8px 8px 10px; border-radius: 12px; background: var(--color-bg); color: var(--color-ink); box-shadow: var(--shadow-e1); transition: box-shadow 150ms ease, transform 150ms ease; }
.bd-ses-drag { cursor: grab; }
.bd-ses-drag:hover { box-shadow: var(--shadow-e2); transform: translateY(-1px); }
.bd-ses-drag:active { cursor: grabbing; }
.bd-nr { display: flex; align-items: flex-start; gap: 2px; min-width: 0; }
.bd-nr b, .bd-ses-name { flex: 1; min-width: 0; font-size: 0.84rem; font-weight: 600; line-height: 1.25; color: inherit; text-decoration: none; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.bd-ses-name:hover { text-decoration: underline; }
.bd-mn { display: flex; align-items: center; justify-content: center; flex: none; width: 24px; height: 24px; margin: -3px -5px 0 0; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--color-ink-secondary); cursor: pointer; }
.bd-mn:hover, .bd-mn[aria-expanded="true"] { background: var(--color-gray-light); color: var(--color-ink); }
.bd-mn svg { width: 16px; height: 16px; }
.bd-st { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.bd-pend { font-size: 0.74rem; font-weight: 600; color: var(--color-ink-secondary); }
.bd-tentl { font-size: 0.72rem; font-weight: 600; color: var(--color-ink-secondary); }
.bd-facts { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.72rem; color: var(--color-ink-secondary); }
.bd-ses-done { background: var(--color-done-bg); color: var(--color-done-ink); box-shadow: 0 0 0 1px var(--color-done-ring), inset 0 3px 6px rgba(30, 107, 50, 0.16); }
.bd-ses-done .bd-facts, .bd-ses-done .bd-lock { color: var(--color-done-ink-2); }
.bd-lock { display: inline-flex; white-space: nowrap; align-items: center; gap: 4px; font-size: 0.7rem; font-weight: 700; }
.bd-lock svg { width: 12px; height: 12px; }
.bd-ses-skip { background: var(--color-warn-bg); box-shadow: 0 0 0 1px #f0d3b3, 0 1px 2px rgba(154, 74, 0, 0.1), 0 3px 8px -2px rgba(154, 74, 0, 0.12); }
.bd-ses-tent { outline: 1.5px dashed var(--color-control-border); outline-offset: -1.5px; }
.bd-ses-lift { opacity: 0.45; outline: 2px dashed var(--color-brand); outline-offset: -2px; background: var(--color-blue-50); box-shadow: none; }
.bd-ses-saving { box-shadow: 0 0 0 2px var(--color-blue-200), var(--shadow-e1); }

/* Popovers y avisos */
.bd-pop { position: fixed; z-index: 95; display: flex; flex-direction: column; gap: 8px; max-width: calc(100vw - 16px); padding: 10px; border-radius: var(--radius-lg); background: var(--color-bg); box-shadow: var(--shadow-e3); }
.bd-pop-title { margin: 0; padding: 2px 4px; font-size: 0.92rem; font-weight: 700; }
.bd-pop-body { display: flex; flex-direction: column; gap: 8px; }
.bd-actions { display: flex; gap: 8px; }
.bd-mlist { display: flex; flex-direction: column; }
.bd-mlist button { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 10px; background: none; color: var(--color-ink); font: inherit; font-size: 0.88rem; font-weight: 600; text-align: left; cursor: pointer; }
.bd-mlist button:hover { background: var(--color-gray-light); }
.bd-mlist button[disabled] { opacity: 0.45; cursor: not-allowed; }
.bd-mlist button svg { width: 16px; height: 16px; color: var(--color-ink-secondary); }
.bd-mlist .bd-danger { color: var(--color-pain-ink); }

.bd-mlist .bd-hint { padding: 0 10px; }
.bd-toast { position: fixed; left: 50%; bottom: 20px; z-index: 90; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 18px; border-radius: 999px; background: var(--color-ink); color: #fff; box-shadow: var(--shadow-e3); font-size: 0.86rem; font-weight: 600; transform: translateX(-50%); }
.bd-toast button { padding: 4px 14px; border: 0; border-radius: 999px; background: #fff; color: var(--color-ink); font: inherit; font-weight: 700; cursor: pointer; }

/* Tablet: el panel pasa a una hoja que se abre con «Rutinas» */
@media (max-width: 1100px) {
  .bd-layout { grid-template-columns: minmax(0, 1fr); }
  .bd-rail-toggle { display: inline-flex; }
  .bd-rail { display: none; }
  .bd-rail-open { position: fixed; z-index: 80; display: flex; top: 0; right: 0; bottom: 0; width: 320px; max-width: 100%; max-height: none; border-radius: 18px 0 0 18px; box-shadow: var(--shadow-e3); }

/* Pestaña Atletas: tarjetas por atleta, filtros y búsqueda. Comparte el
   lenguaje de elevación del calendario (--shadow-e1/e2/e3, ver global.css y
   week-views.css). Espaciado en escala de 4 px. */
.at-page {
  display: flex;
  flex-direction: column;
}

.at-invite-btn {
  width: auto;
  padding: 8px 20px;
}

/* ---------- Invitar ---------- */
.at-invite {
  margin-bottom: 16px;
  padding: 18px 20px;
  border-radius: var(--radius-lg);
  background: var(--color-bg);
  box-shadow: var(--shadow-e3);
  animation: cy-rise 220ms ease-out both;
}

.at-invite h2 {
  margin: 0 0 12px;
  font-size: 1.1rem;
  font-weight: 700;
}

.at-invite-form {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 12px 16px;
}

.at-invite-form .field {
  flex: 1 1 220px;
  max-width: 320px;
  margin: 0;
}

.at-invite-form .button-primary {
  width: auto;
  padding: 10px 20px;
}

/* ---------- Filtros y búsqueda ---------- */
.at-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 16px;
  margin-bottom: 16px;
}

.at-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.cb-chip em.at-count {
  background: var(--color-gray-light);
  color: var(--color-ink-secondary);
}

.cb-chip[aria-pressed="true"] em.at-count {
  background: rgba(255, 255, 255, 0.2);
  color: #ffffff;
}

.at-search {
  margin-left: auto;
  min-width: 220px;
}

.at-search input {
  width: 100%;
  height: 36px;
  padding: 0 14px;
  border: 0;
  border-radius: var(--radius-md);
  background: var(--color-bg);
  box-shadow: var(--shadow-e1);
  font: 500 0.88rem Inter, system-ui, sans-serif;
  color: var(--color-ink);
  transition: box-shadow 150ms ease;
}

.at-search input:hover {
  box-shadow: var(--shadow-e2);
}

.at-search input:focus-visible {
  outline: 2px solid var(--color-blue);
  outline-offset: 2px;
}

.at-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.at-none {
  padding: 32px;
  border-radius: var(--radius-lg);
  background: var(--color-bg);
  box-shadow: var(--shadow-e1);
  color: var(--color-ink-secondary);
  text-align: center;
}

/* ---------- Tarjetas ---------- */
.at-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.at-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px 20px;
  border-radius: var(--radius-lg);
  background: var(--color-bg);
  box-shadow: var(--shadow-e1);
  transition: box-shadow 150ms ease, transform 150ms ease;
  animation: cy-rise 220ms ease-out both;
}

.at-card:hover {
  box-shadow: var(--shadow-e2);
  transform: translateY(-1px);
}

.at-card-pain {
  box-shadow: inset 4px 0 0 #d5484d, var(--shadow-e1);
}

.at-card-warn {
  box-shadow: inset 4px 0 0 var(--color-warn-fill), var(--shadow-e1);
}

.at-top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.at-id {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.at-id a,
.at-id b {
  overflow: hidden;
  color: var(--color-ink);
  font-size: 1rem;
  font-weight: 700;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.at-id a:hover {
  text-decoration: underline;
}

.at-id small {
  overflow: hidden;
  font-size: 0.8rem;
  color: var(--color-ink-secondary);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.at-badge {
  align-self: flex-start;
  text-decoration: none;
}

.at-badge:hover {
  filter: brightness(0.96);
}

.at-note {
  margin: 0;
  font-size: 0.9rem;
  color: var(--color-ink-secondary);
}

.at-cycle {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 12px;
}

.at-cycle a {
  color: var(--color-ink);
  font-size: 0.92rem;
  font-weight: 600;
  text-decoration: none;
}

.at-cycle a:hover {
  text-decoration: underline;
}

.at-cycle span {
  font-size: 0.82rem;
  color: var(--color-ink-secondary);
  font-variant-numeric: tabular-nums;
}

/* Varios ciclos a la vez: un bloque por ciclo, separados por una línea. */
.at-block {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 12px;
  border-top: 1px solid var(--color-gray-border);
}

.at-block .at-cycle a {
  color: var(--color-blue);
}

/* Semana: siete casillas con la marca de cada sesión. */
.at-week {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
}

.at-day {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 6px 0;
  border-radius: var(--radius-sm);
}

.at-day-today {
  background: var(--color-blue-50);
}

.at-day-name {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--color-ink-secondary);
}

.at-day-today .at-day-name {
  color: var(--color-blue);
}

.at-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: 50%;
}

.at-mark-none {
  background: var(--color-gray-light);
  width: 6px;
  height: 6px;
  margin: 6px 0;
}

.at-mark-pending {
  box-shadow: inset 0 0 0 2px var(--color-control-border);
}

.at-mark-skip {
  background: var(--color-warn-fill);
  color: #ffffff;
}

.at-mark-skip svg {
  width: 11px;
  height: 11px;
}

.at-adherence {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 0.82rem;
  color: var(--color-ink-secondary);
  font-variant-numeric: tabular-nums;
}

.at-bar {
  height: 8px;
  overflow: hidden;
  border-radius: var(--radius-xs);
  background: var(--color-gray-light);
  box-shadow: inset 0 1px 2px rgba(31, 34, 40, 0.1);
}

.at-bar i {
  display: block;
  height: 100%;
  border-radius: var(--radius-xs);
  background: var(--color-ok-ink);
}

.at-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: auto;
}

.at-actions .button-secondary,
.at-actions .button-primary {
  width: auto;
  padding: 8px 16px;
  text-decoration: none;
}

.at-card-sk {
  pointer-events: none;
}

@media (max-width: 520px) {
  .at-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .at-search {
    flex: 1 1 100%;
    margin-left: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .at-card,
  .at-invite {
    animation: none;
    transition: none;
  }

  .at-card:hover {
    transform: none;
  }
}

/* Calendario de actividades del atleta en el perfil, para el coach (CYC-253) */
.ev-panel { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: var(--radius-lg); background: var(--color-bg); box-shadow: var(--shadow-e1); min-width: 0; }

.ev-seg button { min-height: 32px; padding: 0 16px; border: 0; border-radius: var(--radius-sm); background: transparent; font: 700 0.88rem Inter, system-ui, sans-serif; color: var(--color-ink-secondary); cursor: pointer; }
.ev-seg button[aria-pressed="true"] { background: var(--color-ink); color: #fff; }
.ev-title { font-size: 1rem; }
.ev-arrows { display: inline-flex; gap: 6px; }
.ev-arrows button { width: 32px; height: 32px; border: 1px solid var(--color-gray-border); border-radius: var(--radius-md); background: var(--color-bg); font-size: 1.1rem; line-height: 1; cursor: pointer; }

.ev-switch input { width: 18px; height: 18px; accent-color: var(--color-ink); }
.ev-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 0 auto; padding: 0; list-style: none; font-size: 0.8rem; color: var(--color-ink-secondary); }

.ev-note { margin: 0; font-size: 0.9rem; color: var(--color-ink-secondary); }

.ev-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (min-width: 1100px) { .ev-layout.ev-with-detail { grid-template-columns: minmax(0, 1fr) 280px; } }
.ev-board { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

.ev-month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.ev-head { text-align: center; font-size: 0.8rem; font-weight: 700; color: var(--color-ink-secondary); padding: 2px 0; }
.ev-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-height: 64px; padding: 5px 6px; border: 1px solid transparent; border-radius: var(--radius-sm); background: var(--color-gray-light); text-align: left; cursor: pointer; font: inherit; min-width: 0; }

.ev-cell:focus-visible, .ev-wday:focus-visible { outline: 2px solid var(--color-blue); outline-offset: 1px; }
.ev-num { font-size: 0.6875rem; font-weight: 700; color: var(--color-ink-secondary); }
.ev-cell-out { opacity: 0.45; }

.ev-pearls, .ev-wlayer { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; }
.ev-pearl { flex: none; }
.ev-more { font-size: 0.6875rem; font-weight: 700; color: var(--color-ink-secondary); }

.ev-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.ev-wday { display: flex; flex-direction: column; gap: 6px; min-height: 72px; padding: 6px; border: 1px solid var(--color-gray-border); border-radius: var(--radius-sm); background: var(--color-bg); text-align: left; cursor: pointer; font: inherit; min-width: 0; }

/* Escala de radios en la web del coach (CYC-208, diseño CYC-206: docs/diseno/inicio-coach).
   Las clases que comparten el coach, el atleta y el inicio de sesión no se tocan:
   aquí se ajustan solo dentro del shell del coach (.app-shell-coach). Se importa al
   final para ganar la cascada. Botones, chips y campos: radio md (8); tarjetas y
   paneles: lg (10); diálogos: xl (12); etiquetas pequeñas: píldora. */

/* Botones */

.app-shell-coach .button-secondary,
.app-shell-coach .button-ghost,
.app-shell-coach .cy-strip-cta,

/* Tarjetas, paneles y listas vacías */

.app-shell-coach .empty-state,
.app-shell-coach .empty-state-card,
.app-shell-coach .chart-card,
.app-shell-coach .stats,
.app-shell-coach .plan-alert,
.app-shell-coach .ex-note,
.app-shell-coach .cy-strip,
.app-shell-coach .pc-week,
.app-shell-coach .notif-panel {
  border-radius: var(--radius-lg);
}

/* Celdas y tarjetas pequeñas dentro de una tarjeta */
.app-shell-coach .pc-cell,

<style>
.nov{width:100%;max-width:520px;background:#fff;border-radius:8px;overflow:hidden}
.nov-stage{position:relative;height:200px;background:#eef1f6;padding:20px}

.nov-body{padding:18px 24px 22px}.nov-body h3{margin:0 0 6px;font-size:1.2rem}.nov-body p{margin:0 0 14px}
@keyframes novC{0%,15%{transform:translate(0,0);opacity:1}55%{transform:translate(170px,-92px);opacity:1}65%,92%{transform:translate(170px,-92px);opacity:0}100%{opacity:1;transform:translate(0,0)}}
@keyframes novT{0%,35%,70%,100%{box-shadow:none}45%,60%{box-shadow:inset 0 0 0 2px var(--color-brand)}}
@keyframes novE{0%,62%{opacity:0}68%,92%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.nov-chip{animation:none}.nov-days .t{animation:none}.nov-days em{animation:none;opacity:1}}
</style>
<script>
const TODAY='2026-11-26';
const WD=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const iso=d=>d.toISOString().slice(0,10);
const day=s=>new Date(s+'T12:00:00Z');
const add=(s,n)=>{const d=day(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const mon=s=>add(s,-((day(s).getUTCDay()+6)%7));
const short=s=>`${day(s).getUTCDate()} ${MES[day(s).getUTCMonth()].slice(0,3)}`;
const dayText=s=>`${['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][day(s).getUTCDay()]} ${day(s).getUTCDate()}`;
const CYCLE={name:'Base de pretemporada',start:'2026-11-16',end:'2026-12-13',n:10,m:12};
const ROUTINES=[['Fuerza de piernas',6],['Tren superior',5],['Potencia y saltos',4],['Zona media',4],['Movilidad',5]];
const seed=()=>[
 {d:'2026-11-17',n:'Fuerza de piernas',done:9},{d:'2026-11-19',n:'Tren superior',done:10},{d:'2026-11-24',n:'Fuerza de piernas',done:8},
 {d:'2026-11-26',n:'Potencia y saltos',done:3},{d:'2026-11-28',n:'Tren superior',done:0},{d:'2026-12-01',n:'Fuerza de piernas',done:0,adj:1}];
const OWN={'2026-11-25':['Rehabilitación de hombro','1 de 1'],'2026-11-27':['Carrera suave','Pendiente']};
const EVENTS={'2026-11-29':'Partido amistoso'};
const ATH=['Camila Rojas','Diego Fuentes','Paula Soto','Matías León'];
const inCycle=(s,c)=>c&&s>=c.start&&s<=c.end;
const state=(s,v)=>!inCycle(s,v.cycle)?'none':s<TODAY?'past':'ok';
const WHY={none:'Sin ciclo',past:'Día pasado'};
const blocked=v=>v.person?'Estás viendo a una persona. Para asignar al equipo, elige «Todas las personas». Para cambiar solo lo de esa persona, abre su ficha.':v.type!=='all'&&v.type!=='sessions'?'Muestra las sesiones para asignar rutinas.':'';
const canEdit=v=>v.cycle&&!blocked(v);
function sesCard(x,i,v){
 const past=x.d<TODAY,drag=canEdit(v)&&!past;
 const badge=past||x.done?`<span class="tms-pill tms-pill-${x.done===CYCLE.n?'ok':'warn'}">${x.done} de ${CYCLE.n}</span>`:`<span class="tms-pill">Llega a ${CYCLE.n}</span>`;
 return `<div class="tms-card tcx-ses" draggable="${drag}" data-s="${i}"><div class="bd-nr"><span class="tms-card-name">${x.n}</span>${canEdit(v)?`<button type="button" class="bd-mn" data-a="menu" data-i="${i}" aria-label="Acciones de ${x.n}, ${dayText(x.d)}">⋯</button>`:''}</div>${badge}${x.adj?'<span class="tmc-tag tmc-tag-warn">1 ajustada</span>':''}</div>`;
}
const teamOn=(s,v)=>v.sessions.map((x,i)=>[x,i]).filter(([x])=>x.d===s&&v.cycle).map(([x,i])=>sesCard(x,i,v)).join('');
const ownOn=s=>OWN[s]?`<div class="tms-card"><span class="tms-card-name">${OWN[s][0]}</span><span class="tms-pill${OWN[s][1]==='1 de 1'?' tms-pill-ok':''}">${OWN[s][1]}</span><span class="tcx-own">Ciclo propio</span></div>`:'';
const plus=(s,v,has)=>canEdit(v)&&state(s,v)==='ok'?`<button type="button" class="bd-plus${has?' bd-plus-faint':''}" data-a="plus" data-d="${s}" aria-label="Asignar rutina el ${dayText(s)}">+</button>`:'<span></span>';
function dropCls(s,v){const c=inCycle(s,v.cycle)?' tcx-in':'';if(!v.hover||v.hover!==s)return [c,''];const st=state(s,v);return [c+(st==='ok'?' tcx-ok':' tcx-bad'),`<span class="tcx-why">${st==='ok'?'Soltar aquí':WHY[st]}</span>`]}
function month(v){
 const first=`${v.anchor.slice(0,7)}-01`;let s=mon(first),rows=[];
 do{let tds='';for(let k=0;k<7;k++,s=add(s,1)){const inM=s.slice(0,7)===first.slice(0,7);const [c,why]=inM?dropCls(s,v):['',''];
   const own=inM?teamOn(s,v)+(v.cycle?ownOn(s):''):'';
   const ev=inM&&v.cycle&&EVENTS[s]?`<div class="tms-card"><span class="tms-card-name">${EVENTS[s]}</span><span class="tms-pill tme-pill-team">Equipo</span></div>`:'';
   const num=s===TODAY?`Hoy <b>${day(s).getUTCDate()}</b>`:day(s).getUTCDate();
   tds+=`<td class="${inM?'':'tms-out'}${c}" ${inM?`data-day="${s}"`:''}><div class="tcx-top">${inM?plus(s,v,!!own):'<span></span>'}<div class="tms-daynum">${num}</div></div>${own}${ev}${why}</td>`}
  rows.push(`<tr>${tds}</tr>`)}while(s.slice(0,7)===first.slice(0,7));
 return `<table class="tms-month"><thead><tr>${WD.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;
}
function week(v){
 const w=[...Array(7)].map((_,i)=>add(mon(v.anchor),i));
 const plan=`<tr class="tcx-plan"><th scope="row">Plan del equipo</th>${w.map(s=>{const [c,why]=dropCls(s,v);const h=teamOn(s,v);return `<td class="${c}" data-day="${s}"><div class="tcx-top">${plus(s,v,!!h)}</div>${h}${why}</td>`}).join('')}</tr>`;
 const marks=ATH.map((a,r)=>`<tr data-row="1"><th scope="row"><span class="tm-athlete"><span class="hm-avatar hm-avatar-sm">${a.split(' ').map(x=>x[0]).join('')}</span><span>${a}</span></span></th>${w.map(s=>{const has=v.cycle&&v.sessions.some(x=>x.d===s);if(!has)return '<td><span class="tms-mark tms-mark-none"></span></td>';const done=s<TODAY&&!(r===2&&s==='2026-11-24');return `<td><span class="tms-mark ${done?'tms-mark-done':s<TODAY?'tms-mark-skip':s===TODAY?'tms-mark-today':'tms-mark-pending'}">${done?'✓':s<TODAY?'✕':''}</span></td>`}).join('')}</tr>`).join('');
 return `<table class="tms-week"><thead><tr><th>Atleta</th>${w.map((s,i)=>`<th>${WD[i]} ${day(s).getUTCDate()}</th>`).join('')}</tr></thead><tbody>${plan}${marks}</tbody></table>`;
}
function rail(v){
 const why=blocked(v),off=!canEdit(v);
 if(why)return `<aside class="bd-rail" aria-label="Rutinas"><header class="bd-rail-head"><h2>Rutinas</h2></header><p class="tcx-note">${why}</p></aside>`;
 return `<aside class="bd-rail" aria-label="Rutinas"><header class="bd-rail-head"><h2>Rutinas</h2></header>${off?'<p class="tcx-note">Crea un ciclo del equipo para poder asignarlas.</p>':''}<label class="bd-search"><input type="search" placeholder="Buscar rutina" aria-label="Buscar rutina"></label><ul class="bd-rlist">${ROUTINES.map((r,i)=>`<li class="bd-rrow"><div class="bd-ritem${off?' bd-ritem-dis':''}" draggable="${!off}" tabindex="${off?-1:0}" role="button" data-r="${i}"><span class="bd-grip">⠿</span><span class="bd-nm"><b>${r[0]}</b><small>${r[1]} ejercicios</small></span></div></li>`).join('')}</ul>${off?'':'<button type="button" class="bd-btn bd-btn-p bd-new">Crear rutina nueva</button>'}</aside>`;
}
const title=v=>{if(v.mode==='week'){const a=mon(v.anchor);return `Semana del ${short(a)} al ${short(add(a,6))}`}const d=day(v.anchor);const t=`${MES[d.getUTCMonth()]} de ${d.getUTCFullYear()}`;return t[0].toUpperCase()+t.slice(1)};

function menuPop(v){
 if(v.menu==null)return '';const x=v.sessions[v.menu],past=x.d<TODAY;
 return `<div class="bd-pop" style="right:320px;top:260px;width:230px"><div class="bd-mlist"><button type="button" data-a="close">Editar ejercicios</button><button type="button" data-a="close"${past?' disabled':''}>Mover a otro día…</button><button type="button" data-a="close">Duplicar en otro día…</button><button type="button" class="bd-danger" data-a="remove">Quitar de este día</button></div></div>`;

function pickPop(v){
 if(!v.pick)return '';
 return `<div class="bd-pop" style="left:50%;top:220px;width:260px;transform:translateX(-50%)"><h3 class="bd-pop-title">Asignar el ${dayText(v.pick)}</h3><ul class="bd-rlist">${ROUTINES.map((r,i)=>`<li><button type="button" class="bd-ritem" data-a="pick" data-i="${i}"><span class="bd-nm"><b>${r[0]}</b><small>${r[1]} ejercicios</small></span></button></li>`).join('')}</ul><button type="button" class="bd-ghost" data-a="close">Cancelar</button></div>`;
}
function view(v){
 const c=v.cycle;
 const strip=c?`<div class="tcx-cycle"><b>${c.name}</b><span class="tmc-chip">${short(c.start)} – ${short(c.end)} 2026</span><span class="tmc-chip">${c.n} de ${c.m} atletas</span><span class="bd-save bd-save-ok">${v.saved?'Guardado':''}</span><button type="button" class="tms-btn">Ver ciclo</button></div>`:`<div class="tcx-empty"><span>Este equipo aún no tiene ciclo. Créalo para poner rutinas en el calendario.</span><button type="button" class="tms-primary" data-a="newcycle">Agregar ciclo</button></div>`;
 return `${header}<div class="tms-shell">${side}<section class="tms-main"><header class="tms-head"><h1 class="tms-title">Calendario</h1><div class="tms-head-actions"><button type="button" class="tms-primary" data-a="newcycle">Agregar ciclo</button><button type="button" class="tms-btn">12 atletas</button><button type="button" class="tms-btn" aria-label="Más acciones">⋯</button></div></header>
 ${v.mode==='month'?`<div class="tms-filters"><select class="tms-filter" data-a="type" aria-label="Tipo"><option value="all">Todos los tipos</option><option value="events"${v.type==='events'?' selected':''}>Actividades de los atletas</option></select><select class="tms-filter" data-a="person" aria-label="Persona"><option value="">Todas las personas</option><option value="1"${v.person?' selected':''}>Camila Rojas</option></select></div>`:''}
 <div class="bd tmc-board"><div class="bd-bar"><span class="bd-grow"></span><button type="button" class="bd-btn bd-rail-toggle" data-a="sheet">Rutinas</button></div><div class="bd-layout"><div class="bd-main"><section class="tms-cal"><div class="tms-cal-bar"><h2 class="tms-cal-title">${title(v)}</h2><div class="tms-cal-tools"><div class="tms-seg"><button type="button" data-a="mode" data-i="week" aria-pressed="${v.mode==='week'}">Semana</button><button type="button" data-a="mode" data-i="month" aria-pressed="${v.mode==='month'}">Mes</button></div><button type="button" class="tms-btn" data-a="today">Hoy</button><button type="button" class="tms-btn" data-a="prev" aria-label="Anterior">‹</button><button type="button" class="tms-btn" data-a="next" aria-label="Siguiente">›</button></div></div>${strip}${v.mode==='month'?month(v):week(v)}</section></div>${rail(v)}</div></div></section></div>${menuPop(v)}${pickPop(v)}${v.toast?`<div class="bd-toast" role="status"><span>${v.toast}</span>${v.undo?'<button type="button" data-a="undo">Deshacer</button>':''}</div>`:''}`;
}
const V=o=>Object.assign({mode:'month',anchor:TODAY,cycle:CYCLE,sessions:seed(),type:'all',person:'',hover:null,menu:null,pick:null,toast:'',undo:null,saved:false},o);
const msg=(n,d)=>`«${n}» agregada el ${dayText(d)}: llega a ${CYCLE.n} atletas.`;
function phone(v){
 const w=[...Array(7)].map((_,i)=>add(mon(v.anchor),i));
 return `<div style="background:var(--color-bg);padding:14px 0"><div style="padding:0 12px"><div class="tms-head"><h1 class="tms-title">Calendario</h1><button type="button" class="tms-primary">Agregar ciclo</button></div></div><div style="padding:10px 12px"><section class="tms-cal"><div class="tms-cal-bar"><h2 class="tms-cal-title">${title({...v,mode:'week'})}</h2></div><div class="tcx-cycle"><b>${CYCLE.name}</b><span class="tmc-chip">${short(CYCLE.start)} – ${short(CYCLE.end)}</span></div><h3 class="tcx-h">Plan del equipo</h3><ul class="tcx-list">${w.map((s,i)=>`<li><b>${WD[i]} ${day(s).getUTCDate()}</b><div>${teamOn(s,v)||(state(s,v)==='past'?'<span class="tcx-own">Día pasado</span>':'<span class="tcx-own">Sin sesión</span>')}</div>${plus(s,v,true)}</li>`).join('')}</ul></section></div></div>`;
}
function still(id,cap,v){return `<h2 class="sec">${cap}</h2><div class="win" id="${id}">${view(v)}</div>`}
const added=seed().concat({d:'2026-11-30',n:'Zona media',done:0});
document.getElementById('stills').innerHTML=[
 still('mes','Mes con el panel de rutinas',V({})),
 still('arrastre','Arrastrando sobre un día del ciclo',V({hover:'2026-11-30'})),
 still('soltada','Al soltar: se guarda y se puede deshacer',V({sessions:added,saved:true,toast:msg('Zona media','2026-11-30'),undo:true})),
 still('pasado','Un día pasado no acepta rutinas',V({hover:'2026-11-23'})),
 still('sin-ciclo-dia','Un día sin ciclo tampoco',V({anchor:'2026-12-10',hover:'2026-12-17'})),
 still('semana','Semana: solo la fila del plan recibe rutinas',V({mode:'week',hover:'2026-11-27'})),
 still('menu','Menú de una sesión del equipo',V({menu:4})),
 still('persona','Viendo a una persona no se asigna',V({person:'1'})),
 still('sin-ciclo','Equipo sin ciclo',V({cycle:null}))
].join('')+`<h2 class="sec">En el teléfono: sin arrastre, con «+» por día</h2><div class="ph" id="telefono">${phone(V({}))}</div>`;
/* Prototipo */
const live=document.getElementById('live');let v=V({}),drag=null,before=null,timer;
const paint=()=>{live.innerHTML=view(v)};
const keep=()=>{before=v.sessions.map(x=>({...x}))};
const say=(t,u)=>{v.toast=t;v.undo=u;clearTimeout(timer);timer=setTimeout(()=>{v.toast='';paint()},8000)};
function put(r,d){keep();v.sessions=v.sessions.concat({d,n:ROUTINES[r][0],done:0});v.saved=true;say(msg(ROUTINES[r][0],d),true)}
live.addEventListener('dragstart',e=>{const r=e.target.closest('[data-r]'),s=e.target.closest('[data-s]');if(!r&&!s)return;drag=r?{r:+r.dataset.r}:{s:+s.dataset.s};e.dataTransfer.setData('text/plain','x')});
live.addEventListener('dragover',e=>{if(!drag)return;const c=e.target.closest('[data-day]');const d=c?c.dataset.day:null;if(d&&state(d,v)==='ok')e.preventDefault();if(v.hover!==d){v.hover=d;
 live.querySelectorAll('[data-day]').forEach(x=>{x.classList.remove('tcx-ok','tcx-bad');x.querySelector('.tcx-why')?.remove()});
 if(c){const ok=state(d,v)==='ok';c.classList.add(ok?'tcx-ok':'tcx-bad');c.insertAdjacentHTML('beforeend',`<span class="tcx-why">${ok?'Soltar aquí':WHY[state(d,v)]}</span>`)}}});
live.addEventListener('drop',e=>{e.preventDefault();const d=v.hover;if(drag&&d&&state(d,v)==='ok'){if(drag.r!=null)put(drag.r,d);else if(v.sessions[drag.s].d!==d){keep();v.sessions[drag.s]={...v.sessions[drag.s],d};v.saved=true;say(`Sesión movida al ${dayText(d)}.`,true)}}drag=null;v.hover=null;paint()});
live.addEventListener('dragend',()=>{if(!drag)return;drag=null;v.hover=null;paint()});
live.addEventListener('change',e=>{const a=e.target.dataset.a;if(a==='person'||a==='type'){v[a]=e.target.value;paint()}});
let chosen=null;
live.addEventListener('click',e=>{
 const r=e.target.closest('[data-r]');if(r&&canEdit(v)){chosen=+r.dataset.r;say('En la web, al elegirla se abre el selector de día. Aquí, usa «+» o arrástrala.',false);paint();return}
 const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i;
 if(a==='mode')v.mode=i;else if(a==='today')v.anchor=TODAY;
 else if(a==='prev'||a==='next'){const k=a==='next'?1:-1;if(v.mode==='week')v.anchor=add(v.anchor,7*k);else{const d=day(v.anchor.slice(0,7)+'-15');d.setUTCMonth(d.getUTCMonth()+k);v.anchor=iso(d)}}
 else if(a==='plus')v.pick=b.dataset.d;else if(a==='menu')v.menu=+i;
 else if(a==='close'){v.menu=null;v.pick=null}
 else if(a==='pick'){const d=v.pick;v.pick=null;put(+i,d)}
 else if(a==='remove'){keep();v.sessions.splice(v.menu,1);v.menu=null;say('Sesión quitada.',false)}
 else if(a==='undo'){v.sessions=before;say('Se deshizo el cambio.',false)}
 else if(a==='newcycle')say('Abre la ventana «Nuevo ciclo» que ya existe.',false);
 paint()});
paint();
</script>
