<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guía de primer uso Cycles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
<style>
/* Concepto v3: la guía no es una pantalla, es una capa. La app se ve tal cual; un halo marca el elemento real y un globo corto pide la acción. El halo no bloquea clics y el resto no se oscurece, salvo bajo diálogos. Contrastado con origin/main de25ad6. Solo modo claro. Datos de ejemplo. */
:root{
  --font-display:"Bricolage Grotesque","Inter",system-ui,sans-serif;--font-body:"Inter",system-ui,sans-serif;
  --brand:#3080fc;--blue:#1a66dd;--blue-100:#eaf2ff;--bg:#fff;--ink:#1f2228;--ink2:#5c6068;--gray:#f6f7f9;--line:#dfe2e7;--page:#f3f5f8;--ctl:#8a8f98;
  --ok-bg:#e9f5ec;--ok-ink:#1e6b32;--warn-bg:#fff1e3;--warn-ink:#9a4a00;
  --e1:0 0 0 1px rgba(31,34,40,.06),0 1px 2px rgba(31,34,40,.06),0 3px 8px -2px rgba(31,34,40,.08);--pop:0 8px 24px -8px rgba(0,0,0,.25);
  --radius-sm:6px;--radius-md:8px;--radius-lg:10px;--radius-pill:999px;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
h1,h2,h3{font-family:var(--font-display);margin:0}
.ctl{max-width:1240px;margin:0 auto;padding:16px 16px 0;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.ctl h1{font-size:1.3rem;width:100%}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.grp>span{font-size:.78rem;font-weight:700;color:var(--ink2)}
.seg{display:flex;flex-wrap:wrap;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-md);padding:3px}
.seg button{border:0;background:none;padding:6px 11px;min-height:34px;border-radius:var(--radius-sm);font-size:.82rem;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.note{max-width:1240px;margin:10px auto 0;padding:0 16px;font-size:.86rem;color:var(--ink2);min-height:2.6em}
.stage{padding:12px 16px 40px;overflow-x:auto}
.win{margin:0 auto;background:var(--page);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;position:relative}
.hdr{display:flex;align-items:center;gap:22px;padding:10px 22px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-family:var(--font-display);font-weight:700;font-size:1.15rem}
.nav{display:flex;gap:16px;flex:1;overflow:hidden}
.nav a{font-size:.9rem;font-weight:600;color:var(--ink2);padding:6px 3px;border-bottom:2px solid transparent;text-decoration:none;white-space:nowrap}
.nav a.on{color:var(--ink);border-bottom-color:var(--brand)}
.av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.pgc{padding:22px 28px 90px;min-height:470px}.w-m .pgc{padding:14px 14px 120px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.ph h2{font-size:1.9rem}.w-m .ph h2{font-size:1.5rem}
.btn{border:1px solid var(--ctl);background:var(--bg);border-radius:var(--radius-md);padding:8px 16px;min-height:40px;font-weight:600;font-size:.9rem}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.card{background:var(--bg);border-radius:var(--radius-lg);box-shadow:var(--e1);padding:16px 18px;margin-bottom:12px}
.card h3{font-size:1.1rem;margin-bottom:8px}
.strip{background:var(--ink);color:#fff;border-radius:var(--radius-lg);padding:14px 18px;margin-bottom:14px}.strip b{font-family:var(--font-display);font-size:1.3rem}.strip p{margin:2px 0 0;font-size:.9rem;color:#dfe2e7}
.chip{display:inline-flex;gap:8px;align-items:center;border:0;border-radius:var(--radius-md);background:var(--bg);box-shadow:var(--e1);padding:6px 12px;min-height:36px;font-size:.84rem;font-weight:700;color:var(--ink2)}
.chip em{background:#fdecec;color:#a3282c;border-radius:var(--radius-pill);padding:0 7px;font-style:normal;font-size:.74rem}
.tabs{display:flex;gap:4px;margin:6px 0 12px}.tabs span{padding:6px 12px;border-radius:var(--radius-md);font-weight:600;font-size:.88rem;color:var(--ink2)}.tabs span.on{background:var(--ink);color:#fff}
.field{margin-bottom:10px}.field label{display:block;font-size:.82rem;font-weight:700;margin-bottom:3px}.inp{border:1px solid var(--ctl);border-radius:var(--radius-md);padding:8px 12px;min-height:40px;background:var(--bg);width:100%;max-width:380px}
.empty{padding:22px;text-align:center;color:var(--ink2)}.empty h3{color:var(--ink);margin-bottom:4px}
.menu{position:absolute;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--pop);padding:6px;width:210px;z-index:3;margin-top:4px}.menu div{padding:9px 12px;border-radius:var(--radius-sm);font-size:.9rem}
.rel{position:relative;display:inline-block}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.day{background:var(--bg);border-radius:var(--radius-sm);min-height:64px;padding:6px;font-size:.78rem;color:var(--ink2);position:relative}.day i{position:absolute;right:6px;bottom:6px;font-style:normal;width:28px;height:28px;border:1px solid var(--line);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink)}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden}.seg2 span{padding:6px 14px;font-weight:600;font-size:.85rem;color:var(--ink2)}.seg2 .on{background:var(--ink);color:#fff}
.dlg{background:var(--bg);border-radius:var(--radius-lg);box-shadow:var(--pop);padding:20px;width:340px;max-width:90%;position:absolute;left:50%;top:90px;transform:translateX(-50%);z-index:3}
.dim{position:absolute;inset:0;background:rgba(31,34,40,.12);z-index:2}
/* guía */
.halo{position:absolute;pointer-events:none;border:2px solid var(--brand);background:rgba(48,128,252,.10);z-index:8}
.ball{position:absolute;z-index:9;background:var(--ink);color:#fff;border-radius:var(--radius-lg);padding:12px 14px;width:280px;box-shadow:var(--pop)}
.w-t .ball{width:260px}
.ball small{display:block;font-size:.74rem;color:#c8ced8;font-weight:600;margin-bottom:2px}
.ball p{margin:0 0 10px;font-size:.92rem;line-height:1.35}
.ball .ac{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ball .b{border:0;background:#fff;color:var(--ink);border-radius:var(--radius-md);padding:6px 14px;min-height:40px;font-weight:700;font-size:.86rem}
.ball .l{border:0;background:none;color:#fff;text-decoration:underline;font-weight:600;font-size:.82rem;padding:6px 4px;min-height:40px}
.ball:after{content:"";position:absolute;width:12px;height:12px;background:var(--ink);transform:rotate(45deg)}
.ball.side:after{top:14px;right:-6px;left:auto}
.ball.dn:after{top:-6px;left:var(--ax,24px)}.ball.up:after{bottom:-6px;left:var(--ax,24px)}.ball.dock:after{display:none}
.w-m .ball{left:12px!important;right:12px;width:auto;bottom:12px;top:auto!important}
.gchip{position:absolute;left:16px;bottom:16px;z-index:9;background:var(--ink);color:#fff;border-radius:var(--radius-md);padding:8px 12px;display:flex;gap:10px;align-items:center;font-size:.86rem;box-shadow:var(--pop)}
.gchip .b{border:0;background:#fff;color:var(--ink);border-radius:var(--radius-sm);padding:4px 12px;min-height:36px;font-weight:700}
.step{max-width:1240px;margin:10px auto 0;padding:0 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step .cnt{font-size:.84rem;font-weight:700}
/* teléfono */
.row{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}.cap{font-size:.82rem;font-weight:700;color:var(--ink2);text-align:center;margin:0 0 6px}
.phone{width:300px;height:560px;background:#f3f5f8;border:1px solid var(--line);border-radius:28px;overflow:hidden;position:relative;flex:none}
.phone .scr{padding:44px 14px 90px}.ph-t{font-family:var(--font-display);font-weight:700;font-size:1.5rem;margin-bottom:10px}
.hero{background:var(--ink);color:#fff;border-radius:16px;padding:14px}.hero b{font-family:var(--font-display);font-size:1.3rem}
.hero .go{display:block;background:#fff;color:var(--ink);border-radius:10px;text-align:center;font-weight:700;padding:11px;margin-top:12px}
.mc{background:#fff;border-radius:14px;padding:12px;margin-top:8px;font-size:.88rem}
.isl{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;background:#fff;border-radius:999px;box-shadow:var(--pop);display:flex;padding:5px;z-index:6}
.isl span{width:60px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:999px;color:var(--ink2);position:relative}
.isl span.on{background:var(--blue-100);color:var(--blue)}.isl svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mh{position:absolute;border:2px solid var(--brand);background:rgba(48,128,252,.10);pointer-events:none;z-index:7}
.mb{position:absolute;left:14px;right:14px;z-index:7;background:var(--ink);color:#fff;border-radius:10px;padding:12px 14px}
.mb small{display:block;font-size:.74rem;color:#c8ced8;font-weight:600}.mb p{margin:0 0 8px;font-size:.9rem}
.mb .ac{display:flex;justify-content:space-between;align-items:center}.mb .b{border:0;background:#fff;color:var(--ink);border-radius:8px;padding:8px 16px;min-height:44px;font-weight:700}.mb .l{border:0;background:none;color:#fff;text-decoration:underline;font-weight:600;min-height:44px}
.old-dim{position:absolute;inset:0;background:rgba(31,34,40,.35);z-index:5}
.tbl{width:100%;max-width:880px;margin:0 auto;border-collapse:collapse;font-size:.88rem;background:#fff;border-radius:10px;overflow:hidden}.tbl td,.tbl th{padding:10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}.tbl th{font-size:.76rem;color:var(--ink2);border-top:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pop{margin-top:10px;max-width:260px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--pop);padding:12px}.pop p{margin:0 0 8px;font-size:.88rem}
.ritem{border:1px solid var(--line);border-radius:var(--radius-md);padding:8px 12px;margin-top:6px;background:var(--bg)}.ritem small{display:block;color:var(--ink2);font-size:.78rem}
.drw{position:absolute;top:0;right:0;bottom:0;width:340px;max-width:92%;background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--pop);padding:20px;z-index:3}.drw h3{font-size:1.2rem;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:var(--blue-100);color:var(--blue);border-radius:var(--radius-sm);padding:4px 10px;font-size:.84rem;font-weight:600}
.intro{position:absolute;right:20px;bottom:20px;width:440px;max-width:calc(100% - 40px);background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--pop);padding:18px;z-index:9}
.intro h3{font-size:1.25rem;margin-bottom:10px}.intro p{margin:0 0 4px;font-size:.92rem}
.nest{border:2px solid var(--ink);border-radius:var(--radius-lg);padding:10px;margin:10px 0 12px}.nest>b{font-size:.84rem}
.nest .r{border:2px solid var(--brand);border-radius:var(--radius-md);padding:8px;margin-top:8px;background:var(--blue-100)}.nest .r>b{font-size:.8rem;color:var(--blue)}
.nest .r div{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.nest .r span{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:2px 8px;font-size:.78rem;font-weight:600}
.nest .rr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ball small .lv{background:#3a3f48;border-radius:var(--radius-sm);padding:0 6px;margin-left:6px;color:#fff}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></symbol>
 <symbol id="i-bar" viewBox="0 0 24 24"><path d="M3 12h18M6 8v8M18 8v8M3 10v4M21 10v4"/></symbol>
 <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></symbol>
 <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></symbol>
</svg>
<div class="ctl">
  <h1>Guía de primer uso v3 · marcas sobre la app real</h1>
  <div class="grp"><span>Parada</span><div class="seg" id="g-p"></div></div>
  <div class="grp"><span>Ancho</span><div class="seg" id="g-w"><button data-k="d" aria-pressed="true">Escritorio</button><button data-k="t" aria-pressed="false">Tablet 820</button><button data-k="m" aria-pressed="false">Móvil 390</button></div></div>
  <div class="grp"><span>Atenuar resto</span><div class="seg" id="g-a"><button data-k="0" aria-pressed="true">No (recomendado)</button><button data-k="1" aria-pressed="false">12 %</button></div></div>
</div>
<p class="note" id="note"></p>
<div class="step" id="stepbar"></div>
<div class="stage" id="stage"></div>

<script>
// Paradas y marcas. t = elemento resaltado (data-t), s = pantalla, x = opciones de pantalla.
const P=[
 {id:'i',n:'Así se arma un ciclo',note:'Explicación breve antes de la guía: un ciclo contiene rutinas y las rutinas contienen ejercicios. Tarjeta pequeña, sin velo, con la app visible detrás.',m:[{s:'inicio',intro:1,lab:'Explicación inicial'}]},
 {id:'1',n:'1 · Tu atleta',note:'Primero, el prerrequisito: un ciclo se crea para una atleta que ya aceptó. Invitar toma días, por eso va primero.',m:[
  {s:'inicio',t:'nav-at',tx:'Primero, tu atleta. Entra a Atletas.',k:'Paso 1 de 6',lv:'Atleta'},
  {s:'atletas',t:'inv-form',tx:'Escribe su nombre y el email con el que se registrará.',k:'Paso 1 de 6',lv:'Atleta'},
  {s:'atletas',t:'inv-send',tx:'Toca Enviar invitación.',k:'Paso 1 de 6',lv:'Atleta'}]},
 {id:'e',n:'Espera',note:'Sin marca: la pantalla queda libre y solo hay un chip discreto. Cuando la atleta acepta, el chip lo dice.',m:[
  {s:'inicio',chip:'Guía · Paso 1 de 6 · Esperando a Camila',btn:'Seguir',lab:'Esperando'},
  {s:'inicio',chip:'Camila ya aceptó. Crea su ciclo.',btn:'Seguir',lab:'Ya aceptó'}]},
 {id:'2',n:'2 · Ciclo',note:'La caja grande: el ciclo. Se crea desde la ficha de la atleta.',m:[
  {s:'atletas2',t:'row-cam',tx:'Abre a Camila para crearle un ciclo.',k:'Paso 2 de 6',lv:'Ciclo'},
  {s:'ficha2',x:'empty',t:'new-cyc',tx:'Toca Nuevo ciclo.',k:'Paso 2 de 6',lv:'Ciclo'},
  {s:'ficha2',x:'dlg',t:'cyc-ok',tx:'Ponle nombre, inicio y semanas.',k:'Paso 2 de 6',lv:'Ciclo',dim:1}]},
 {id:'3',n:'3 · Rutina',note:'Una caja dentro del ciclo. Se crea sin salir de la pizarra: «Crear rutina nueva» abre un cajón.',m:[
  {s:'ficha2',x:'board',t:'plus',tx:'Toca «+» en un día.',k:'Paso 3 de 6',lv:'Rutina'},
  {s:'ficha2',x:'pop',t:'new-rut',tx:'Crea la rutina de ese día.',k:'Paso 3 de 6',lv:'Rutina'},
  {s:'ficha2',x:'drawer',t:'rut-name',tx:'Ponle nombre. Por ejemplo, Torso A.',k:'Paso 3 de 6',lv:'Rutina',dim:1}]},
 {id:'4',n:'4 · Ejercicios',note:'Las fichas dentro de la rutina. Si falta un ejercicio, «Crear «nombre»» lo crea y lo agrega ahí mismo: no hace falta pasar por Ejercicios.',m:[
  {s:'ficha2',x:'drawer',t:'ex-search',tx:'Busca y agrega 2 o 3 ejercicios.',k:'Paso 4 de 6',lv:'Ejercicios',dim:1},
  {s:'ficha2',x:'drawerc',t:'ex-create',tx:'¿Falta uno? Toca Crear «Remo con mancuerna».',k:'Paso 4 de 6',lv:'Ejercicios',skip:1,dim:1},
  {s:'ficha2',x:'drawerd',t:'rut-ok',tx:'Cuando termines, toca Crear rutina.',k:'Paso 4 de 6',lv:'Ejercicios',dim:1}]},
 {id:'5',n:'5 · Ponla en un día',note:'Se cierra el ciclo: al asignar la primera sesión queda activo y la atleta lo ve en Hoy.',m:[
  {s:'ficha2',x:'pick',t:'pick-r',tx:'Elige la rutina para ese día.',k:'Paso 5 de 6',lv:'Ciclo'}]},
 {id:'6',n:'6 · Seguimiento',note:'Cierra mostrando dónde mirar cada día: Inicio y Resumen de la atleta.',m:[
  {s:'inicio2',t:'chip-att',tx:'En Inicio ves quién necesita tu atención.',k:'Paso 6 de 6'},
  {s:'ficha2',x:'resumen',t:'res',tx:'En Resumen ves su carga y adherencia.',k:'Paso 6 de 6',last:1},
  {s:'inicio2',t:'avatar',tx:'Listo. Reabre la guía en Cómo usar Cycles.',k:'Cierre',b:['Entendido'],lab:'Cierre'}]},
 {id:'a',n:'Atleta (web)',note:'La atleta en el navegador usa el mismo mecanismo: tres marcas sobre su menú.',m:[
  {s:'hoy',t:'nav-hoy',tx:'Aquí está tu sesión de hoy.',k:'Paso 1 de 3'},{s:'hoy',t:'nav-cal',tx:'Aquí ves tu semana y tu ciclo.',k:'Paso 2 de 3'},{s:'hoy',t:'nav-mc',tx:'Aquí están los ciclos que te asigna tu coach.',k:'Paso 3 de 3'}]},
 {id:'mob',n:'App móvil (ajustes)',note:'Veredicto para CYC-192: marcas que piden hacer, atenuado al 12 % o nada y sin cubrir la isla. No depende del orden del ciclo.',m:[]}
];

let pi=0,mi=0,w='d',dimOn=false;
const ctl=(id,fn)=>document.getElementById(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;fn(b.dataset.k);render()});
ctl('g-p',k=>{pi=+k;mi=0});ctl('g-w',k=>w=k);ctl('g-a',k=>dimOn=k==='1');
const NAV=(on,role='coach')=>role==='coach'?[['inicio','Inicio','nav-in'],['atletas','Atletas','nav-at'],['biblioteca','Biblioteca','nav-bib'],['ejercicios','Ejercicios','nav-ej']]:[['hoy','Hoy','nav-hoy'],['cal','Calendario','nav-cal'],['mc','Mis ciclos','nav-mc']];
function head(active,role){return `<div class="hdr"><span class="logo">Cycles</span><nav class="nav">${NAV(active,role).map(n=>`<a data-t="${n[2]}" class="${n[0]===active?'on':''}">${n[1]}</a>`).join('')}</nav><span class="av" data-t="avatar">LG</span></div>`}
function screen(s,x){
 const emptyEx=`<div class="tabs"><span class="on">Míos 0</span><span>Catálogo 120</span></div><div class="card empty"><h3>Todavía no creaste ejercicios</h3>Aquí van los que crees tú. El catálogo de Cycles ya tiene 120 para empezar.</div>`;
 const form=`<div class="card"><h3>Nuevo ejercicio</h3><div class="field"><label>Nombre</label><div class="inp">Remo con mancuerna</div></div><div class="field"><label>Grupo muscular</label><div class="inp">Espalda</div></div><button class="btn p" data-t="save-ex">Guardar</button></div>`;
 switch(s){
 case 'inicio': return head('inicio')+`<div class="pgc"><div class="ph"><h2>Inicio</h2><button class="btn">Invitar atleta</button></div><div class="strip"><b>Empieza invitando a un atleta</b><p>Cuando acepte tu invitación, aquí verás cómo le va.</p></div><div class="card empty"><h3>Aún no hay semana que mostrar</h3>Cuando tu atleta tenga un ciclo, aparecerá aquí.</div></div>`;
 case 'inicio2': return head('inicio')+`<div class="pgc"><div class="ph"><h2>Inicio</h2><button class="btn">Invitar atleta</button></div><div class="strip"><b>2 sesiones hoy</b><p>1 atleta necesita tu atención.</p></div><div style="margin-bottom:10px"><b style="font-family:var(--font-display);font-size:1.1rem">Esta semana</b> &nbsp; <button class="chip" data-t="chip-att">Necesitan atención <em>1</em></button></div><div class="card" style="display:flex;gap:12px"><b>Camila Rojas</b><span style="color:var(--ink2)">Fuerza · semana 1</span></div></div>`;
 case 'ejercicios': return head('ejercicios')+`<div class="pgc"><div class="ph"><h2>Ejercicios</h2><button class="btn p" data-t="new-ex">Nuevo ejercicio</button></div>${x==='form'?form:''}${emptyEx}</div>`;
 case 'biblioteca': return head('biblioteca')+`<div class="pgc"><div class="ph"><h2>Biblioteca</h2><div class="rel"><button class="btn p" data-t="crear">Crear</button>${x==='menu'?`<div class="menu" style="right:0"><div data-t="item-rut">Rutina</div><div>Ciclo para un atleta</div><div>Ciclo para la Biblioteca</div></div>`:''}</div></div><div class="card empty"><h3>Tu biblioteca está vacía</h3>Aquí vivirán tus rutinas y tus ciclos. Empieza armando una rutina.</div></div>`;
 case 'editor': return head('biblioteca')+`<div class="pgc"><div class="ph"><h2>Nueva rutina</h2></div><div class="card"><div class="field"><label>Nombre</label><div class="inp" data-t="rut-name">Torso A</div></div><div class="field"><label>Agregar ejercicio</label><div class="inp">Buscar en el catálogo</div></div></div><button class="btn p" data-t="rut-save">Crear rutina</button></div>`;
 case 'atletas': return head('atletas')+`<div class="pgc"><div class="ph"><h2>Atletas</h2></div><div class="card" data-t="inv-form"><h3>Invita a tu primer atleta</h3><div class="field"><label>Nombre</label><div class="inp">Camila Rojas</div></div><div class="field"><label>Email</label><div class="inp">camila@ejemplo.com</div></div><button class="btn p" data-t="inv-send">Enviar invitación</button></div></div>`;
 case 'atletas2': return head('atletas')+`<div class="pgc"><div class="ph"><h2>Atletas</h2><button class="btn p">Invitar atleta</button></div><div class="card" data-t="row-cam" style="display:flex;gap:12px;align-items:center"><b>Camila Rojas</b><span style="color:var(--ink2)">Sin ciclo</span></div></div>`;
 case 'ficha': return head('atletas')+`<div class="pgc"><div class="ph"><h2>Camila Rojas</h2><div class="seg2"><span class="on">Ciclo</span><span data-t="res">Resumen</span></div></div>${x==='dlg'?'':`<div style="margin-bottom:10px"><button class="btn" data-t="new-cyc">Nuevo ciclo</button></div>`}${x==='dlg'?`<div class="dim"></div><div class="dlg" role="dialog"><h3>Nuevo ciclo</h3><div class="field"><label>Nombre</label><div class="inp">Fuerza base</div></div><div class="field"><label>Inicio y semanas</label><div class="inp">Lun 9 nov · 4 semanas</div></div><button class="btn p" data-t="cyc-ok">Crear</button></div>`:`<div class="card"><b>Fuerza base</b><div class="days" style="margin-top:8px">${['L','M','M','J','V','S','D'].map((d,i)=>`<div class="day">${d} ${9+i}${i===1?'<i data-t="plus">+</i>':'<i>+</i>'}</div>`).join('')}</div></div>`}</div>`;
 case 'ficha2': {
  const board=`<div class="card"><b>Fuerza base</b> <span style="color:var(--ink2);font-size:.84rem">· Lun 9 nov · 6 semanas</span><div class="days" style="margin-top:8px">${['L','M','M','J','V','S','D'].map((d,i)=>`<div class="day">${d} ${9+i}${i===1?'<i data-t="plus">+</i>':'<i>+</i>'}${(x==='drawerd'||x==='pick')&&i===1&&x==='pick'?'':''}</div>`).join('')}</div>${x==='pop'?`<div class="pop"><p>Todavía no tienes rutinas.</p><button class="btn p" data-t="new-rut">Crear rutina nueva</button></div>`:''}${x==='pick'?`<div class="pop"><div class="inp" style="margin-bottom:6px">Buscar rutina</div><div class="ritem" data-t="pick-r"><b>Torso A</b><small>3 ejercicios</small></div></div>`:''}</div>`;
  const side=`<div class="card side"><h3>Rutinas</h3><p style="margin:0 0 8px;font-size:.86rem;color:var(--ink2)">Aún no hay rutinas.</p><button class="btn" data-t="new-rut">Crear rutina nueva</button></div>`;
  if(x==='empty')return head('atletas')+`<div class="pgc"><div class="ph"><h2>Camila Rojas</h2><div class="seg2"><span class="on">Ciclo</span><span>Resumen</span></div></div><div class="card" style="max-width:520px"><p style="margin:0 0 10px">Camila todavía no tiene ciclos. Asigna uno de la Biblioteca o crea uno nuevo aquí.</p><button class="btn p" data-t="new-cyc">Nuevo ciclo</button></div></div>`;
  if(x==='dlg')return head('atletas')+`<div class="pgc"><div class="ph"><h2>Camila Rojas</h2></div><div class="dim"></div><div class="dlg" role="dialog"><h3>Nuevo ciclo</h3><div class="field"><label>Nombre</label><div class="inp">Fuerza base</div></div><div class="field"><label>Inicio y semanas</label><div class="inp">Lun 9 nov · 6 semanas</div></div><button class="btn p" data-t="cyc-ok">Crear</button></div></div>`;
  if(x==='resumen')return head('atletas')+`<div class="pgc"><div class="ph"><h2>Camila Rojas</h2><div class="seg2"><span>Ciclo</span><span class="on" data-t="res">Resumen</span></div></div><div class="card">Carga semanal y adherencia</div></div>`;
  const drawer=(sub)=>`<div class="dim"></div><aside class="drw" role="dialog" aria-label="Crear rutina"><h3>Crear rutina</h3><div class="field"><label>Nombre</label><div class="inp" data-t="rut-name">${x==='drawer'?'Torso A':'Torso A'}</div></div><div class="field"><label>Ejercicios</label><div class="inp" data-t="ex-search">${sub.q}</div></div>${sub.list}<button class="btn p" data-t="rut-ok" style="margin-top:8px">Crear rutina</button></aside>`;
  if(x==='drawer')return head('atletas')+`<div class="pgc"><div class="ph"><h2>Camila Rojas</h2></div>${board}</div>`+drawer({q:'Buscar ejercicio',list:''});
  if(x==='drawerc')return head('atletas')+`<div class="pgc"><div class="ph"><h2>Camila Rojas</h2></div>${board}</div>`+drawer({q:'Remo con mancuerna',list:'<div class="ritem" data-t="ex-create"><b>Crear «Remo con mancuerna»</b><small>Se crea y se agrega a la rutina</small></div>'});
  if(x==='drawerd')return head('atletas')+`<div class="pgc"><div class="ph"><h2>Camila Rojas</h2></div>${board}</div>`+drawer({q:'Buscar ejercicio',list:'<div class="chips"><span>Press banca</span><span>Remo con mancuerna</span><span>Fondos</span></div>'});
  return head('atletas')+`<div class="pgc"><div class="ph"><h2>Camila Rojas</h2><div class="seg2"><span class="on">Ciclo</span><span>Resumen</span></div></div><div style="display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px">${board}${side}</div></div>`}
 case 'hoy': return head('hoy','ath')+`<div class="pgc"><div class="ph"><h2>Hoy</h2></div><div class="card empty"><h3>Tu coach está preparando tu ciclo</h3>Cuando te asigne tu primera sesión, la verás aquí.</div></div>`;
 }
}
function mobile(){
 const sc=(inner,extra,dim)=>`<div class="phone"><div class="scr"><div class="ph-t">${inner}</div></div>${extra}<div class="isl"><span class="on"><svg><use href="#i-bar"/></svg></span><span><svg><use href="#i-cal"/></svg></span><span><svg><use href="#i-chart"/></svg></span><span><svg><use href="#i-chat"/></svg></span></div></div>`;
 return `<div class="row">
 <div><p class="cap">v2 (antes): velo al 35 % y solo «Siguiente»</p><div class="phone"><div class="scr"><div class="ph-t">Inicio</div><div class="hero"><small>Semana 1</small><br><b>Torso A</b><span class="go">Empezar sesión</span></div><div class="mc">Press banca · 4 × 8</div></div><div class="old-dim"></div><div class="mb" style="bottom:80px"><p>En Inicio está tu sesión de hoy. Toca <b>Empezar sesión</b> cuando vayas a entrenar.</p><div class="ac"><button class="l">Saltar</button><button class="b">Siguiente</button></div></div><div class="isl" style="z-index:6"><span class="on"><svg><use href="#i-bar"/></svg></span><span><svg><use href="#i-cal"/></svg></span><span><svg><use href="#i-chart"/></svg></span><span><svg><use href="#i-chat"/></svg></span></div></div></div>
 <div><p class="cap">v3 · M1: halo sobre «Empezar sesión», sin velo</p><div class="phone"><div class="scr"><div class="ph-t">Inicio</div><div class="hero"><small>Semana 1</small><br><b>Torso A</b><span class="go">Empezar sesión</span></div><div class="mc">Press banca · 4 × 8</div></div><div class="mh" style="left:20px;right:20px;top:152px;height:46px;border-radius:12px"></div><div class="mb" style="top:214px"><small>Paso 1 de 3</small><p>Toca Empezar sesión cuando vayas a entrenar.</p><div class="ac"><button class="l">Saltar</button><button class="b">Siguiente</button></div></div><div class="isl"><span class="on"><svg><use href="#i-bar"/></svg></span><span><svg><use href="#i-cal"/></svg></span><span><svg><use href="#i-chart"/></svg></span><span><svg><use href="#i-chat"/></svg></span></div></div></div>
 <div><p class="cap">v3 · M2: pide tocar la pestaña</p><div class="phone"><div class="scr"><div class="ph-t">Inicio</div><div class="hero"><small>Semana 1</small><br><b>Torso A</b><span class="go">Empezar sesión</span></div><div class="mc">Press banca · 4 × 8</div></div><div class="mb" style="bottom:84px"><small>Paso 2 de 3</small><p>Toca Calendario.</p><div class="ac"><button class="l">Saltar</button><button class="b">Siguiente</button></div></div><div class="isl"><span class="on"><svg><use href="#i-bar"/></svg></span><span id="mh2"><svg><use href="#i-cal"/></svg></span><span><svg><use href="#i-chart"/></svg></span><span><svg><use href="#i-chat"/></svg></span></div><div class="mh" style="left:112px;bottom:15px;width:64px;height:48px;border-radius:999px"></div></div></div></div>
 <p style="max-width:880px;margin:16px auto 0;font-size:.86rem;color:var(--ink2)">M3: atenuar al 12 % o nada y nunca cubrir la isla ni el botón resaltado. M4: mismo globo que la web (paso, hasta 12 palabras, Siguiente y Saltar). M5: se conservan la pista de la primera serie, el cierre de la primera sesión y «Cómo usar Cycles» en el avatar.</p>`}
function place(win,mk){
 const q=sel=>win.querySelector(`[data-t="${sel}"]`);
 const wr=win.getBoundingClientRect(),z=+win.dataset.z||1;
 win.querySelectorAll('.halo,.ball,.gchip').forEach(e=>e.remove());
 if(mk.intro){const c=document.createElement('div');c.className='intro';c.setAttribute('role','dialog');c.setAttribute('aria-labelledby','it');c.innerHTML=`<h3 id="it">Así se arma un ciclo</h3><div class="nest"><b>Ciclo · Fuerza base · 6 semanas</b><div class="rr"><div class="r"><b>Rutina · Torso A</b><div><span>Press banca</span><span>Remo</span></div></div><div class="r"><b>Rutina · Pierna</b><div><span>Sentadilla</span><span>Prensa</span></div></div></div></div><p>Un ciclo organiza las semanas de tu atleta.</p><p>Contiene rutinas: la sesión de cada día.</p><p>Cada rutina contiene ejercicios.</p><p style="margin:8px 0 12px;font-weight:700">Lo armamos en ese orden.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p">Empezar la guía</button><button class="btn">Ahora no</button></div>`;win.appendChild(c);return}
 if(mk.chip){const c=document.createElement('div');c.className='gchip';c.innerHTML=`<span>${mk.chip}</span><button class="b">${mk.btn}</button>`;win.appendChild(c);return}
 const el=q(mk.t);if(!el)return;
 const r=el.getBoundingClientRect(),pad=4;
 const left=(r.left-wr.left)/z-pad,top=(r.top-wr.top)/z-pad,wd=r.width/z+pad*2,ht=r.height/z+pad*2;
 const rad=getComputedStyle(el).borderRadius;
 const h=document.createElement('div');h.className='halo';Object.assign(h.style,{left:left+'px',top:top+'px',width:wd+'px',height:ht+'px',borderRadius:(rad==='50%'?'999px':rad==='0px'?'6px':rad)});win.appendChild(h);
 const b=document.createElement('div');b.className='ball';b.setAttribute('role','complementary');b.setAttribute('aria-label','Guía de inicio');
 const btns=(mk.b||(mk.last?['Listo']:['Siguiente'])).map(x=>`<button class="b">${x}</button>`).join('');
 const ls=mk.l||(mk.skip?['Saltar paso','Salir de la guía']:['Salir de la guía']);
 b.innerHTML=`<small>${mk.k||'Bienvenida'}${mk.lv?`<span class="lv">${mk.lv}</span>`:''}</small><p>${mk.tx}</p><div class="ac">${btns}${ls.map(x=>`<button class="l">${x}</button>`).join('')}</div>`;
 win.appendChild(b);
 const bw=b.offsetWidth,bh=b.offsetHeight,ww=wr.width/z,wh=wr.height/z;
 if(win.classList.contains('w-m')){b.className='ball dock';return}
 if(el.closest('.menu')){b.className='ball';b.style.left=Math.max(8,left-bw-12)+'px';b.style.top=top+'px';b.style.setProperty('--ax','0px');b.classList.add('side');return}
 let bl=Math.min(Math.max(8,left),ww-bw-8),bt,dir;
 if(top+ht+bh+14<wh-10){bt=top+ht+10;dir='dn'}else{bt=top-bh-10;dir='up'}
 b.style.left=bl+'px';b.style.top=bt+'px';b.classList.add(dir);b.style.setProperty('--ax',Math.min(Math.max(14,left+wd/2-bl-6),bw-26)+'px');
}
function render(){
 const g=document.getElementById('g-p');g.innerHTML=P.map((p,i)=>`<button data-k="${i}" aria-pressed="${i===pi}">${p.n}</button>`).join('');
 [...document.getElementById('g-w').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===w));
 [...document.getElementById('g-a').children].forEach(b=>b.setAttribute('aria-pressed',(b.dataset.k==='1')===dimOn));
 const p=P[pi];document.getElementById('note').textContent=p.note;
 const stage=document.getElementById('stage'),sb=document.getElementById('stepbar');
 if(p.id==='mob'){sb.innerHTML='';stage.innerHTML=mobile();return}
 const mk=p.m[mi]||p.m[0];
 sb.innerHTML=`<button class="btn" id="prev" ${mi===0?'disabled':''}>← Marca anterior</button><span class="cnt">Marca ${mi+1} de ${p.m.length}${mk.lab?' · '+mk.lab:''}</span><button class="btn p" id="next" ${mi===p.m.length-1?'disabled':''}>Marca siguiente →</button>`;
 document.getElementById('prev').onclick=()=>{mi--;render()};document.getElementById('next').onclick=()=>{mi++;render()};
 const width=w==='d'?1180:w==='t'?820:390;
 const avail=Math.max(320,document.documentElement.clientWidth-32),z=Math.min(1,avail/width);
 stage.innerHTML=`<div style="width:${width*z}px;margin:0 auto"><div class="win ${w==='m'?'w-m':w==='t'?'w-t':''}" id="win" data-z="${z}" style="width:${width}px;zoom:${z}">${screen(mk.s,mk.x)}${dimOn&&!mk.dim?'<div class="dim" style="z-index:5"></div>':''}${mk.dim&&mk.x!=='dlg'?'<div class="dim"></div>':''}</div></div>`;
 const win=document.getElementById('win');
 requestAnimationFrame(()=>place(win,mk));
}
window.addEventListener('resize',()=>{const win=document.getElementById('win');const p=P[pi];if(win&&p.m.length)place(win,p.m[mi]||p.m[0])});
render();
</script>
