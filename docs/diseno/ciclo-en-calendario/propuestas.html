<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ciclo en calendario Cycles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
<style>
/* Concepto: el calendario es lo primero que se ve y se adapta al ancho de la pantalla, sin barra horizontal. Cada semana (en el ciclo) y cada atleta (en el Inicio) es su propia tarjeta elevada. Lenguaje de elevación: tres niveles de sombra en capas, de baja opacidad (e1 reposo, e2 destacado, e3 flotante), sin gradientes ni brillos. Al cargar se muestran esqueletos que respetan la forma final. Espaciado en escala de 4 px. Solo modo claro. */
:root{
  --font-display:"Bricolage Grotesque","Inter",system-ui,sans-serif; --font-body:"Inter",system-ui,sans-serif;
  --brand:#3080fc; --blue:#1a66dd; --blue-hover:#155ccc; --b50:#f3f8ff; --b100:#eaf2ff; --b200:#d6e4ff; --b300:#a9c8fd; --b700:#1450b0;
  --bg:#ffffff; --ink:#1f2228; --ink2:#5c6068; --gray:#f6f7f9; --line:#dfe2e7; --ctl:#8a8f98;
  --ok-bg:#e9f5ec; --ok-ink:#1e6b32; --warn-bg:#fff1e3; --warn-ink:#9a4a00; --warn-fill:#e08a2e; --pain-bg:#fdecec; --pain-ink:#a3282c;
  --page:#eceff4;
  --e1:0 0 0 1px rgba(31,34,40,.06),0 1px 2px rgba(31,34,40,.06),0 3px 8px -2px rgba(31,34,40,.08);
  --e2:0 0 0 1px rgba(31,34,40,.06),0 2px 4px rgba(31,34,40,.06),0 12px 24px -8px rgba(31,34,40,.18);
  --e3:0 0 0 1px rgba(31,34,40,.07),0 4px 8px rgba(31,34,40,.08),0 20px 40px -12px rgba(31,34,40,.30);
  --sk:#dde2ea; color-scheme:light; --hdr:56px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
button,a,select{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hdr{position:sticky;top:0;z-index:20;height:var(--hdr);background:var(--bg);box-shadow:0 1px 0 rgba(31,34,40,.08),0 4px 12px -6px rgba(31,34,40,.12)}
.hdr-in{max-width:1320px;height:100%;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:32px}
.hdr img{height:26px;display:block}
.nav{display:flex;gap:20px;flex:1;height:100%}
.nav a{display:flex;align-items:center;font-size:.92rem;font-weight:600;color:var(--ink2);text-decoration:none;border-bottom:2px solid transparent;padding-top:2px}
.nav a.on{color:var(--ink);border-bottom-color:var(--brand)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 2px #fff,0 1px 3px rgba(31,34,40,.25)}
.avatar.sm{width:32px;height:32px;font-size:.72rem}
.ctrl{max-width:1320px;margin:0 auto;padding:12px 24px 0;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border-radius:999px;padding:3px;background:var(--bg);box-shadow:var(--e1)}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 14px;font-size:.8rem;font-weight:600;color:var(--ink2);cursor:pointer;transition:background-color 120ms ease,color 120ms ease}
.seg button[aria-pressed=true]{background:var(--b100);color:var(--ink)}
main{max-width:1320px;margin:0 auto;padding:16px 24px 64px}
h1{margin:0;font-family:var(--font-display);font-size:1.9rem;line-height:1.1;font-weight:700;letter-spacing:-.01em}
h2{margin:0;font-size:1.05rem;font-weight:700}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;min-height:40px}
.head .back{font-size:.9rem;color:var(--ink2);text-decoration:none}
.sp{flex:1}
.who{display:inline-flex;align-items:center;gap:8px;font-size:.92rem;font-weight:600}
.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:.76rem;font-weight:700;background:var(--bg);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.pill.blue{background:var(--b100);color:var(--blue);box-shadow:none}.pill.ok{background:var(--ok-bg);color:var(--ok-ink);box-shadow:none}.pill.warn{background:var(--warn-bg);color:var(--warn-ink);box-shadow:none}.pill.pain{background:var(--pain-bg);color:var(--pain-ink);box-shadow:none}
.btn{height:36px;padding:0 16px;border-radius:999px;border:0;background:var(--bg);box-shadow:var(--e1);font-size:.88rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;white-space:nowrap;transition:box-shadow 150ms ease,transform 150ms ease,background-color 120ms ease}
.btn:hover{box-shadow:var(--e2);transform:translateY(-1px)}.btn:active{transform:none;box-shadow:var(--e1)}
.btn.p{background:var(--blue);color:#fff}.btn.p:hover{background:var(--blue-hover)}
.btn.ghost{background:#2b3038;color:#fff;box-shadow:inset 0 0 0 1px #4a5160}.btn.ghost:hover{background:#353b46}
.link{font-size:.88rem;font-weight:600;color:var(--blue);white-space:nowrap;background:none;border:0;cursor:pointer;padding:0}.link:hover{text-decoration:underline}

/* Franja de avance */
.strip{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:16px;padding:16px 20px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),var(--e2)}
.strip .sl{display:flex;align-items:baseline;gap:8px}
.strip .sw{font-family:var(--font-display);font-size:1.5rem;line-height:1;font-weight:700}
.strip .of{font-size:.92rem;color:#cfd6e4}
.strip p{margin:0;font-size:.92rem;color:#e6ebf5;flex:1;min-width:200px}
.chain{display:flex;align-items:center;align-self:center}
.chain i{width:12px;height:12px;border-radius:50%;background:#34425c;flex:none}
.chain i.f{background:var(--brand)}.chain i.c{background:#fff;box-shadow:0 0 0 3px #3080fc66}
.chain u{width:12px;height:2px;background:#34425c;flex:none;display:block}.chain u.f{background:var(--brand)}
.note{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--warn-bg);border-radius:14px;padding:12px 16px;margin-bottom:12px;box-shadow:var(--e1)}
.note p{margin:0;font-size:.92rem;flex:1;min-width:200px}
.note .btn{height:32px;font-size:.84rem}
.ch{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 4px 12px}
.ok-ic{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--ok-ink);color:#fff;flex:none;box-shadow:0 1px 2px rgba(30,107,50,.35)}
.ok-ic svg{width:14px;height:14px}
.ok-ic.sm{width:16px;height:16px;margin-left:4px}.ok-ic.sm svg{width:11px;height:11px}
.tile .ts{display:flex;align-items:center}
.tile .tg svg{width:18px;height:18px}
.legend span{display:inline-flex;align-items:center}.legend .ok-ic.sm{margin:0 6px 0 0}
.legend{display:flex;align-items:center;gap:16px;font-size:.8rem;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px;box-shadow:var(--e1)}
.asg{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg);border-radius:14px;margin-bottom:12px;padding:12px 16px;box-shadow:var(--e3)}
.asg b{font-size:.92rem}.asg select{height:36px;border:1px solid var(--ctl);border-radius:8px;padding:0 10px;background:var(--bg);font-size:.88rem}
.asg label{display:flex;align-items:center;gap:8px;font-size:.88rem}

/* Ciclo: una tarjeta por semana */
.gh,.wr{display:grid;grid-template-columns:112px repeat(7,minmax(0,1fr)) 132px;gap:8px;padding:0 16px}
.gh{position:sticky;top:var(--hdr);z-index:3;background:var(--page);padding-top:8px;padding-bottom:8px;font-size:.8rem;font-weight:600;color:var(--ink2)}
.gh span{padding:0 4px}.gh .today{color:var(--blue)}
.weeks{display:flex;flex-direction:column;gap:8px}
.wr{padding-top:12px;padding-bottom:12px;align-items:stretch;background:var(--bg);border-radius:16px;box-shadow:var(--e1)}
.wr.past{box-shadow:0 0 0 1px rgba(31,34,40,.06),0 1px 2px rgba(31,34,40,.04)}
.wr.cur{box-shadow:0 0 0 2px var(--brand),var(--e2)}
.wl{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:none;text-align:left;cursor:pointer;padding:6px 8px;border-radius:10px;font-size:.88rem;transition:background-color 120ms ease}
.wl:hover{background:var(--gray)}.wl b{font-size:.95rem}.wl small{font-size:.8rem;color:var(--ink2)}
.wl .tg{font-size:.74rem;font-weight:700;color:var(--blue)}
.ws{display:flex;flex-direction:column;justify-content:center;gap:2px;padding-left:4px;font-size:.82rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.ws b{font-size:.95rem;color:var(--ink)}
.day{display:flex;min-width:0}
.cell{position:relative;flex:1;align-self:stretch;display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;background:var(--bg);box-shadow:var(--e1);border:0;text-align:left;cursor:pointer;min-width:0;min-height:88px;transition:box-shadow 150ms ease,transform 150ms ease}
.cell:hover{box-shadow:var(--e2);transform:translateY(-2px)}.cell:active{transform:none;box-shadow:var(--e1)}
.cell b{font-size:.92rem;font-weight:600;line-height:1.25;padding-right:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .dn{position:absolute;top:10px;right:12px;font-size:.78rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.cell .st{display:flex;gap:6px;flex-wrap:wrap;min-width:0}.cell .pill{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.facts{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.cell.done{background:#e3f1e7;color:#24472f;box-shadow:0 0 0 1px #bcdac5,inset 0 3px 6px rgba(30,107,50,.16)}
.cell.done:hover{box-shadow:0 0 0 1px #a7cfb3,inset 0 3px 6px rgba(30,107,50,.16),0 6px 14px -6px rgba(30,107,50,.3)}
.cell.done .facts,.cell.done .dn{color:#3f5f49}
.cell.skip{background:var(--warn-bg);box-shadow:0 0 0 1px #f0d3b3,0 1px 2px rgba(154,74,0,.10),0 3px 8px -2px rgba(154,74,0,.12)}
.cell .note2{font-size:.8rem;color:var(--warn-ink)}
.day.today .cell{box-shadow:0 0 0 2px var(--brand),var(--e2)}
.add{position:relative;flex:1;min-height:88px;border-radius:12px;border:1.5px dashed transparent;background:transparent;font-size:.84rem;font-weight:600;color:transparent;cursor:pointer;transition:background-color 120ms ease,border-color 120ms ease,color 120ms ease}
.add .dn{position:absolute;top:10px;right:12px;font-size:.78rem;color:#a2a7b0;font-variant-numeric:tabular-nums}
.day:hover .add,.add:focus-visible{border-color:var(--ctl);color:var(--ink2)}
.add:hover{background:var(--b50);border-color:var(--brand);color:var(--blue)}
.day.today .add{background:var(--b50)}
.mini{grid-column:2/9;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 4px;font-size:.84rem;color:var(--ink2)}
.mini span.m{display:inline-flex;align-items:center;padding:3px 12px;border-radius:999px;font-weight:600;box-shadow:var(--e1);background:var(--bg)}
.mini .m.completed{background:#e3f1e7;color:#24472f;box-shadow:0 0 0 1px #bcdac5,inset 0 2px 4px rgba(30,107,50,.14)}.mini .m.skipped{background:var(--warn-bg);color:var(--warn-ink)}

/* Inicio: una tarjeta por atleta, a todo el ancho */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 4px 12px}
.chip{border:0;border-radius:999px;padding:5px 14px;font-size:.82rem;font-weight:700;background:var(--bg);color:var(--ink2);box-shadow:var(--e1);cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:box-shadow 150ms ease,background-color 120ms ease}
.chip:hover{box-shadow:var(--e2)}.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.chip em{font-style:normal;background:var(--pain-bg);color:var(--pain-ink);border-radius:999px;padding:0 7px;font-size:.74rem}
.ar,.bhd{display:grid;grid-template-columns:232px repeat(7,minmax(0,1fr)) 88px;gap:8px;padding:0 16px}
.bhd{position:sticky;top:var(--hdr);z-index:3;background:var(--page);padding-top:8px;padding-bottom:8px;font-size:.8rem;font-weight:600;color:var(--ink2)}
.bhd span{padding:0 4px}.bhd .today{color:var(--blue)}
.list{display:flex;flex-direction:column;gap:12px}
.ar{align-items:stretch;padding-top:12px;padding-bottom:12px;background:var(--bg);border-radius:18px;box-shadow:var(--e1);transition:box-shadow 150ms ease,transform 150ms ease}
.ar:hover{box-shadow:var(--e2);transform:translateY(-1px)}
.ar.att{box-shadow:inset 4px 0 0 var(--warn-fill),var(--e1)}.ar.att.p{box-shadow:inset 4px 0 0 #d5484d,var(--e1)}
.an{display:flex;align-items:center;gap:12px;padding:6px;border:0;background:none;text-align:left;cursor:pointer;min-width:0;border-radius:12px;transition:background-color 120ms ease}
.an:hover{background:var(--gray)}
.nm{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:.95rem}.nm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm small{font-size:.8rem;color:var(--ink2)}
.nm .pill{align-self:flex-start;margin-top:2px}
.days{display:contents}
.bc{display:flex;min-width:0}
.tile{flex:1;border-radius:12px;padding:10px 12px;font-size:.84rem;font-weight:600;line-height:1.3;display:flex;flex-direction:column;gap:2px;background:var(--bg);box-shadow:var(--e1);min-height:64px;min-width:0}
.tile .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .ts{font-weight:500;font-size:.78rem;color:var(--ink2)}.tile .tg{display:none}
.tile.completed{background:#e3f1e7;color:#24472f;box-shadow:0 0 0 1px #bcdac5,inset 0 3px 6px rgba(30,107,50,.16)}
.tile.completed .tg{color:var(--ok-ink)}
.tile.skipped{background:var(--warn-bg);color:var(--warn-ink);box-shadow:0 0 0 1px #f0d3b3,0 1px 2px rgba(154,74,0,.10)}
.tile.skipped .ts{color:var(--warn-ink)}
.bc.today .tile{box-shadow:0 0 0 2px var(--brand),var(--e2)}
.tile em{font-style:normal;font-size:.76rem;font-weight:700;color:var(--pain-ink)}
.as{display:flex;flex-direction:column;justify-content:center;font-variant-numeric:tabular-nums;padding-left:4px}
.as b{font-size:1rem}.as small{font-size:.76rem;color:var(--ink2)}
.none{padding:32px;text-align:center;color:var(--ink2);background:var(--bg);border-radius:18px;box-shadow:var(--e1)}

/* Carga: esqueletos con la forma final; pulso de opacidad, sin degradados */
.sk{display:block;background:var(--sk);border-radius:8px;animation:pulse 1.4s ease-in-out infinite}
.strip .sk{background:#3a4150}
.sk.r{border-radius:12px}.sk.c{border-radius:50%}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.skr{display:grid;grid-template-columns:112px repeat(7,minmax(0,1fr)) 132px;gap:8px;padding:12px 16px;background:var(--bg);border-radius:16px;box-shadow:var(--e1);align-items:center}
.skr.a{grid-template-columns:232px repeat(7,minmax(0,1fr)) 88px;border-radius:18px}
.skc{display:flex;flex-direction:column;gap:8px}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.rise>*{animation:rise 220ms ease-out both}
.rise>*:nth-child(2){animation-delay:50ms}.rise>*:nth-child(3){animation-delay:100ms}.rise>*:nth-child(4){animation-delay:150ms}.rise>*:nth-child(n+5){animation-delay:200ms}
@media (prefers-reduced-motion:reduce){.sk{animation:none;opacity:.7}.rise>*{animation:none}.cell,.ar,.btn{transition:none}.cell:hover,.ar:hover,.btn:hover{transform:none}}

@media (max-width:1000px){
  .bhd{display:none}
  .ar{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:12px}
  .an{grid-column:1}.as{grid-column:2;grid-row:1;align-items:flex-end;padding:0}
  .days{display:grid;grid-column:1/3;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .bc{flex-direction:column;gap:4px}
  .bc::before{content:attr(data-d);font-size:.72rem;font-weight:600;color:var(--ink2);text-align:center}
  .bc.today::before{color:var(--blue)}
  .tile{padding:6px 2px;min-height:44px;align-items:center;justify-content:center;text-align:center;border-radius:10px}
  .tile .tn,.tile .ts,.tile em{display:none}.tile .tg{display:block;font-size:1.05rem;font-weight:700}
  .bc:not(.has) .tile{display:none}
  .bc:not(.has){min-height:0}.bc:not(.has)::after{content:"";height:44px;border-radius:10px;background:var(--gray)}
  .skr.a{grid-template-columns:minmax(0,1fr) auto}.skr.a .skd{display:none}
}
@media (max-width:760px){
  main,.ctrl{padding-left:16px;padding-right:16px}.hdr-in{padding:0 16px;gap:12px}.hdr img{height:22px}.nav{gap:12px;min-width:0}.nav a{font-size:.8rem}.hdr .avatar{width:32px;height:32px}
  .gh{display:none}.wr{display:block;padding:12px 16px}
  .ws{flex-direction:row;gap:12px;padding:4px}.wl{flex-direction:row;align-items:baseline;gap:8px}
  .day.rest{display:none}
  .day::before{content:attr(data-d);font-size:.74rem;font-weight:600;color:var(--ink2);width:52px;flex:none;padding-top:10px}
  .day{margin-top:8px}.mini{padding:4px}.skr:not(.a){display:none}
}
</style>

<script>
var DAYS=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"],LET=["L","M","X","J","V","S","D"],MONTHS=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var START=new Date(2026,9,12),W=5,CUR=2,TODAY=4,TRAIN=[0,2,4];
var ROUT=["Día 1","Día 2","Día 3"],FULL=["Full body, día 1","Full body, día 2","Full body, día 3"];
function fresh(){var c=[];for(var w=1;w<=W;w++){c[w]=[];for(var d=0;d<7;d++)c[w][d]=null}return c}
function demo(){var c=fresh();
  for(var w=1;w<=W;w++)TRAIN.forEach(function(d,i){c[w][d]={r:ROUT[i],st:"pending",sets:18}});
  c[1][0]={r:ROUT[0],st:"completed",rpe:7,min:45,sets:18};
  c[1][2]={r:ROUT[1],st:"completed",rpe:6,min:40,sets:18,pain:true};
  c[1][4]={r:ROUT[2],st:"skipped",note:"Viaje de trabajo",sets:0};
  c[2][0]={r:ROUT[0],st:"completed",rpe:8,min:48,sets:18};
  c[2][2]={r:ROUT[1],st:"completed",rpe:7,min:52,sets:18};
  return c}
var S={v:"c",ok:true,cells:demo(),open:{},assign:null,alert:true,loading:true,hold:false,onlyAtt:false,anim:true};

function dt(w,d){return new Date(START.getTime()+((w-1)*7+d)*864e5)}
function fmt(x){return x.getDate()+" "+MONTHS[x.getMonth()]}
function rng(w){var a=dt(w,0),b=dt(w,6);return a.getMonth()===b.getMonth()?a.getDate()+"–"+b.getDate()+" "+MONTHS[b.getMonth()]:fmt(a)+" – "+fmt(b)}
function pos(w,d){return w<CUR?-1:(w>CUR?1:(d<TODAY?-1:d>TODAY?1:0))}
function wstats(w){var t=0,dn=0,sets=0,rs=[];
  S.cells[w].forEach(function(s){if(!s)return;t++;if(s.st==="completed"){dn++;sets+=s.sets;rs.push(s.rpe)}});
  return{t:t,dn:dn,sets:sets,avg:rs.length?Math.round(rs.reduce(function(a,b){return a+b},0)/rs.length*10)/10:null}}
function all(){var t=0,dn=0;for(var w=1;w<=W;w++){var s=wstats(w);t+=s.t;dn+=s.dn}return{t:t,dn:dn}}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function chain(){var h="";for(var w=1;w<=W;w++){h+=(w>1?'<u class="'+(w<=CUR?"f":"")+'"></u>':"")+'<i class="'+(w<CUR?"f":w===CUR?"c":"")+'"></i>'}return '<div class="chain" aria-hidden="true">'+h+'</div>'}
var CHK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',XIC='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>',CIC='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>';
function okic(sm,lbl){return '<span class="ok-ic'+(sm?' sm':'')+'" role="img" aria-label="'+lbl+'">'+CHK+'</span>'}
function legend(){return '<span class="legend"><span>'+okic(true,'Hecha')+'Hecha</span><span><i style="background:var(--bg)"></i>Pendiente</span><span><i style="background:var(--warn-bg)"></i>Omitida</span></span>'}

/* Esqueletos */
function sk(w,h,c){return '<i class="sk '+(c||"")+'" style="width:'+w+';height:'+h+'"></i>'}
function skCycle(){var rows="";for(var i=0;i<4;i++){rows+='<div class="skr"><div class="skc">'+sk("70%","14px")+sk("50%","11px")+'</div>';for(var d=0;d<7;d++)rows+=(d%2===0&&d<5)?sk("100%","80px","r"):'<span></span>';rows+='<div class="skc">'+sk("50%","14px")+sk("70%","11px")+'</div></div>'}
  return '<div class="head">'+sk("220px","32px")+sk("150px","24px")+'<span class="sp"></span>'+sk("110px","36px","c")+'</div><section class="strip" aria-hidden="true">'+sk("150px","24px")+sk("120px","12px")+'<span class="sp"></span>'+sk("120px","36px","c")+'</section><div class="weeks" aria-hidden="true">'+rows+'</div>'}
function skHome(){var rows="";for(var i=0;i<4;i++){rows+='<div class="skr a"><div style="display:flex;gap:12px;align-items:center">'+sk("32px","32px","c")+'<div class="skc" style="flex:1">'+sk("70%","14px")+sk("45%","11px")+'</div></div>';for(var d=0;d<7;d++)rows+='<span class="skd">'+((d+i)%3===0?'':sk("100%","56px","r"))+'</span>';rows+='<div class="skc skd">'+sk("40%","14px")+'</div></div>'}
  return '<div class="head">'+sk("140px","32px")+'<span class="sp"></span>'+sk("150px","24px","c")+'</div><section class="strip" aria-hidden="true">'+sk("180px","24px")+sk("260px","12px")+'</section><div class="list" aria-hidden="true">'+rows+'</div>'}

/* Ciclo del atleta */
function head(){return '<div class="head"><a class="back" href="#">Ciclos</a><h1>Fuerza base</h1><span class="who"><span class="avatar sm">CM</span>Camila Muñoz</span><span class="pill blue">Mesociclo</span><span class="pill">12 oct al 15 nov</span><span class="sp"></span><button class="btn">Editar ciclo</button></div>'}
function strip(){var a=all(),cs=wstats(CUR);
  if(!S.ok||a.t===0)return '<section class="strip" aria-label="Avance del ciclo"><div class="sl"><b class="sw">Ciclo nuevo</b><span class="of">de '+W+' semanas</span></div><p>Toca un día para asignarle una rutina. Camila la recibe en su celular en cuanto la guardes.</p></section>';
  return '<section class="strip" aria-label="Avance del ciclo"><div class="sl"><b class="sw">Semana '+CUR+'</b><span class="of">de '+W+'</span></div>'+chain()+'<p>Esta semana lleva '+cs.dn+' de '+cs.t+' sesiones. En total, '+a.dn+' de '+a.t+' completadas.</p><button class="btn ghost">Ver resumen</button></section>'}
function note(){if(!S.ok||!S.alert)return "";return '<section class="note" aria-label="Aviso del ciclo"><p><b>Camila</b> reportó dolor de hombro el miércoles 14 oct.</p><button class="btn p" data-a="adj">Bajar 5 % desde semana 3</button><button class="link" data-a="dis">Descartar</button></section>'}
function assign(){if(!S.assign)return "";var a=S.assign;
  return '<div class="asg" role="group" aria-label="Asignar rutina"><b>Asignar el '+DAYS[a.d].toLowerCase()+' '+fmt(dt(a.w,a.d))+'</b><label>Rutina <select id="rt">'+FULL.map(function(r,i){return '<option value="'+ROUT[i]+'">'+esc(r)+'</option>'}).join("")+'</select></label><label><input type="checkbox" id="rep" checked> Repetir los '+DAYS[a.d].toLowerCase()+' de las semanas vacías</label><span class="sp"></span><button class="btn p" data-a="ok">Asignar</button><button class="btn" data-a="no">Cancelar</button></div>'}
function cell(w,d){var s=S.cells[w][d],p=pos(w,d),n=dt(w,d).getDate(),lbl=DAYS[d]+" "+n,td=p===0?" today":"";
  if(!s){var rest=TRAIN.indexOf(d)<0;return '<div class="day'+td+(rest?" rest":"")+'" data-d="'+lbl+'"><button class="add" data-w="'+w+'" data-d="'+d+'" aria-label="Asignar rutina el '+lbl+'"><span class="dn">'+n+'</span>+ Asignar</button></div>'}
  var cls=s.st==="completed"?" done":s.st==="skipped"?" skip":"";
  var pill=s.st==="completed"?okic(false,'Completada'):s.st==="skipped"?'<span class="pill warn">Omitida</span>':'<span class="pill">Pendiente</span>';
  var b='<span class="dn">'+n+'</span><b>'+esc(s.r)+'</b><span class="st">'+pill+(s.pain?'<span class="pill pain">Dolor</span>':"")+'</span>';
  if(s.st==="completed")b+='<span class="facts"><span>Esfuerzo '+s.rpe+'</span><span>'+s.min+' min</span></span>';
  if(s.st==="skipped")b+='<span class="note2">'+esc(s.note)+'</span>';
  return '<div class="day'+td+'" data-d="'+lbl+'"><button class="cell'+cls+'" title="'+esc(FULL[ROUT.indexOf(s.r)]||s.r)+'" aria-label="'+esc(s.r)+', '+lbl+', '+(s.st==="completed"?"completada":s.st==="skipped"?"omitida":"pendiente")+'">'+b+'</button></div>'}
function row(w){var st=wstats(w),cls=w<CUR?"past":w===CUR?"cur":"fut";
  var open=S.open[w]!==undefined?S.open[w]:(cls!=="past");
  var h='<div class="wr '+cls+'" role="row"><button class="wl" data-t="'+w+'" aria-expanded="'+open+'" aria-label="Semana '+w+', '+(open?"plegar":"desplegar")+'"><b>Semana '+w+'</b><small>'+rng(w)+'</small>'+(cls==="cur"?'<span class="tg">Esta semana</span>':"")+'</button>';
  if(open){for(var d=0;d<7;d++)h+=cell(w,d)}
  else{var ms=S.cells[w].map(function(s,d){return s?'<span class="m '+s.st+'">'+DAYS[d]+' '+(s.st==="completed"?okic(true,"hecha"):s.st==="skipped"?"omitida":"pendiente")+(s.pain?", dolor":"")+'</span>':""}).join("");h+='<div class="mini">'+(ms||"Sin sesiones")+'</div>'}
  h+='<div class="ws">'+(st.t?'<b>'+st.dn+' de '+st.t+'</b><span>'+st.sets+' series</span>'+(st.avg!==null?'<span>Esfuerzo '+String(st.avg).replace(".",",")+'</span>':""):'<span>Sin sesiones</span>')+'</div></div>';
  return h}
function cycleView(){var g='<div class="gh" role="row"><span></span>'+DAYS.map(function(n,d){return '<span class="'+(d===TODAY?"today":"")+'">'+n+'</span>'}).join("")+'<span>Semana</span></div><div class="weeks">';
  for(var w=1;w<=W;w++)g+=row(w);g+='</div>';
  return head()+strip()+note()+'<div class="ch"><h2>Calendario del ciclo</h2><span class="sp"></span>'+legend()+'</div>'+assign()+g}

/* Inicio del coach */
var ATT={"Camila Muñoz":{t:"Dolor de hombro",k:"p"},"Tomás Paz":{t:"Omitió 1 sesión",k:"w"}};
var OTHERS=[
 {n:"Diego Rojas",i:"DR",c:"Ciclo de volumen",w:[{r:"Torso A",st:"completed"},null,{r:"Pierna",st:"completed"},null,{r:"Torso B",st:"pending"},null,null]},
 {n:"Sofía Vera",i:"SV",c:"Fuerza base",w:[null,{r:"Día 1",st:"completed"},null,{r:"Día 2",st:"completed"},null,{r:"Día 3",st:"pending"},null]},
 {n:"Tomás Paz",i:"TP",c:"Ciclo de volumen",w:[{r:"Torso A",st:"completed"},null,{r:"Pierna",st:"skipped"},null,{r:"Torso B",st:"pending"},null,null]}];
function rows(){var cam={n:"Camila Muñoz",i:"CM",c:"Fuerza base",w:S.cells[CUR].map(function(s){return s?{r:s.r,st:s.st,pain:s.pain}:null})};return [cam].concat(OTHERS)}
function tile(s,d){var td=d===TODAY?" today":"",lb=LET[d]+" "+dt(CUR,d).getDate();if(!s)return '<div class="bc'+td+'" data-d="'+lb+'"></div>';
  var t=s.st==="completed"?"Hecha":s.st==="skipped"?"Omitida":"Pendiente",g=s.st==="completed"?CHK:s.st==="skipped"?XIC:CIC;
  return '<div class="bc has'+td+'" data-d="'+lb+'"><div class="tile '+s.st+'" title="'+esc(s.r)+', '+t.toLowerCase()+'" aria-label="'+esc(s.r)+', '+DAYS[d]+', '+t.toLowerCase()+'"><span class="tn">'+esc(s.r)+'</span><span class="ts">'+(s.st==="completed"?okic(false,"Hecha"):t)+'</span>'+(s.pain?'<em>Dolor</em>':"")+'<span class="tg" aria-hidden="true">'+g+'</span></div></div>'}
function homeView(){var R=rows(),today=0,done=0,nAtt=0;
  R.forEach(function(r){var s=r.w[TODAY];if(s){today++;if(s.st==="completed")done++}if(ATT[r.n])nAtt++});
  var strip='<section class="strip" aria-label="Hoy"><div class="sl"><b class="sw">'+today+' sesiones hoy</b></div><p>'+(done?done+" completadas.":"Ninguna completada todavía.")+' '+nAtt+' atletas necesitan atención.</p></section>';
  var bar='<div class="bar"><h2>Esta semana</h2><span class="pill blue">'+rng(CUR)+'</span><button class="chip" data-a="flt" aria-pressed="'+S.onlyAtt+'">Necesitan atención <em>'+nAtt+'</em></button><span class="sp"></span>'+legend()+'</div>';
  var hd='<div class="bhd" aria-hidden="true"><span></span>'+DAYS.map(function(n,d){return '<span class="'+(d===TODAY?"today":"")+'">'+n+" "+dt(CUR,d).getDate()+'</span>'}).join("")+'<span>Semana</span></div>';
  var list="";R.forEach(function(r){var a=ATT[r.n];if(S.onlyAtt&&!a)return;
    var t=r.w.filter(Boolean).length,dn=r.w.filter(function(x){return x&&x.st==="completed"}).length;
    list+='<article class="ar'+(a?" att"+(a.k==="p"?" p":""):"")+'" aria-label="'+esc(r.n)+'"><button class="an" data-a="'+(r.n==="Camila Muñoz"?"go":"x")+'"><span class="avatar sm">'+r.i+'</span><span class="nm"><b>'+esc(r.n)+'</b><small>'+esc(r.c)+'</small>'+(a?'<span class="pill '+(a.k==="p"?"pain":"warn")+'">'+a.t+'</span>':"")+'</span></button><div class="days">'+r.w.map(function(s,d){return tile(s,d)}).join("")+'</div><div class="as"><b>'+dn+' de '+t+'</b><small>sesiones</small></div></article>'});
  return '<div class="head"><h1>Inicio</h1><span class="sp"></span><span class="pill">Hoy, viernes 23 oct</span></div>'+strip+bar+hd+'<div class="list">'+(list||'<div class="none">Nadie necesita atención esta semana.</div>')+'</div>'}

function render(){var r=document.getElementById("root"),h;
  if(S.loading){r.setAttribute("aria-busy","true");h=S.v==="c"?skCycle():skHome()}
  else{r.removeAttribute("aria-busy");h=S.v==="c"?cycleView():homeView()}
  r.className=(S.anim&&!S.loading)?"rise":"";S.anim=false;r.innerHTML=h;
  document.getElementById("vc").setAttribute("aria-pressed",S.v==="c");document.getElementById("vi").setAttribute("aria-pressed",S.v==="i");
  document.getElementById("nInicio").className=S.v==="i"?"on":"";document.getElementById("nCiclos").className=S.v==="c"?"on":"";
  document.getElementById("sa").setAttribute("aria-pressed",!S.hold&&S.ok);document.getElementById("sn").setAttribute("aria-pressed",!S.hold&&!S.ok);document.getElementById("sl").setAttribute("aria-pressed",S.hold)}
function load(ms){S.loading=true;render();clearTimeout(load.t);load.t=setTimeout(function(){if(S.hold)return;S.loading=false;S.anim=true;render()},ms)}
document.addEventListener("click",function(e){var b=e.target.closest("button,a");if(!b)return;
  if(b.id==="vc"||b.id==="nCiclos"){e.preventDefault();if(S.v!=="c"){S.v="c";S.hold?render():load(450)}return}
  if(b.id==="vi"||b.id==="nInicio"){e.preventDefault();if(S.v!=="i"){S.v="i";S.hold?render():load(450)}return}
  if(b.id==="sl"){S.hold=true;S.loading=true;return render()}
  if(b.id==="sa"||b.id==="sn"){S.hold=false;S.ok=b.id==="sa";S.cells=S.ok?demo():fresh();S.assign=null;S.alert=true;S.open={};S.anim=true;S.loading=false;return render()}
  if(b.dataset.t){var w=+b.dataset.t,cur=S.open[w]!==undefined?S.open[w]:(w>=CUR);S.open[w]=!cur;return render()}
  if(b.classList.contains("add")){S.assign={w:+b.dataset.w,d:+b.dataset.d};return render()}
  var a=b.dataset.a;if(!a)return;
  if(a==="go"){S.v="c";return load(450)}
  if(a==="flt"){S.onlyAtt=!S.onlyAtt;return render()}
  if(a==="dis"||a==="adj"){S.alert=false;return render()}
  if(a==="no"){S.assign=null;return render()}
  if(a==="ok"){var rt=document.getElementById("rt").value,rep=document.getElementById("rep").checked,as=S.assign;
    for(var w2=as.w;w2<=(rep?W:as.w);w2++)if(!S.cells[w2][as.d])S.cells[w2][as.d]={r:rt,st:"pending",sets:18};
    S.assign=null;return render()}
});
load(900);
</script>
</body>
</html>
