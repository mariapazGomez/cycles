<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Landing: la causa de Cycles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;600;700&display=swap">
<style>
:root{--ink:#1f2228;--blue:#1a66dd;--brand:#3080fc;--eyebrow:#1450b0;--soft:#eef3fc;--mute:#cfd6e4;--bg:#e9edf5}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:24px}
.note{max-width:1440px;margin:0 auto 24px;font-size:14px;line-height:1.5}
.note b{font-weight:700}
.lab{font:700 13px/1 Inter;letter-spacing:.1em;text-transform:uppercase;color:#4c5666;margin:28px 0 10px}
.row{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
/* ===== Páginas (réplica de la landing real) ===== */
.pg{position:relative;overflow:hidden;background:#fff;color:var(--ink);flex:none}
.pg.d{width:1440px;height:900px}
.pg.m{width:390px;height:844px}
.pg.auto{height:auto}
.hd{height:60px;display:flex;align-items:center;box-shadow:0 2px 10px rgba(31,34,40,.08);position:relative;z-index:2;background:#fff}
.d .hd>div{width:1240px;margin:0 auto;padding:0 16px;display:flex;justify-content:space-between;align-items:center}
.m .hd>div{width:100%;padding:0 16px;display:flex;justify-content:space-between;align-items:center}
.hd img{height:30px}
.hd span{font:600 15px/1 Inter;letter-spacing:.02em;text-transform:uppercase}
.m .hd span{font-size:13px}
.wrap{width:1240px;margin:0 auto;padding:0 16px}
.hero{padding-top:56px}
.d .hero .wrap{display:grid;grid-template-columns:480px 703px;gap:24px;align-items:start}
.eb{font:700 13.6px/17px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--eyebrow);margin-bottom:18px}
h1{font:800 57.6px/59.9px "Bricolage Grotesque",Inter,sans-serif;letter-spacing:-.01em;margin-bottom:18px;max-width:449px}
h1 em{font-style:normal;color:var(--blue)}
.lead{font:400 20px/31px Inter;max-width:449px;margin-bottom:28px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--brand);color:#fff;font:700 19.2px/23px Inter;padding:15px 34px;border-radius:999px;box-shadow:0 0 0 14px rgba(48,128,252,.1),0 6px 18px rgba(48,128,252,.35)}
.btn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.steps{list-style:none;padding:0;margin-top:34px;display:grid;gap:12px}
.steps li{display:flex;align-items:center;gap:12px;font:600 17px/26px Inter}
.steps i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--eyebrow);display:grid;place-items:center;font-weight:700;font-size:15px}
.vis{border-radius:24px;display:block}
.d .vis{width:703px}
/* móvil */
.m .hero{padding:26px 16px 0}
.m h1{font-size:36px;line-height:38px;margin-bottom:16px;max-width:none}
.m .lead{font-size:17px;line-height:25.5px;margin-bottom:24px;max-width:none}
.m .btn{display:flex;justify-content:center;font-size:19px;padding:15px 20px}
.m .vis{width:358px;margin-top:32px}
/* ===== Marca de ciclo ===== */
.iso{width:1em;height:1em;flex:none}
/* ===== Opción A: franja de causa ===== */
.band{background:var(--ink);color:#fff;position:relative;z-index:1}
.d .band>div{width:1240px;margin:0 auto;padding:13px 16px;display:flex;align-items:center;justify-content:center;gap:14px;font:600 17px/1.3 Inter}
.m .band>div{padding:12px 16px;display:flex;gap:10px;align-items:flex-start;font:600 14.5px/1.35 Inter}
.band .iso{font-size:22px;margin-top:1px}
.band b{font-weight:700}
.band a{color:#9cc2ff;font-weight:700;white-space:nowrap}
/* ===== Opción B: bloque en la portada (reemplaza los pasos) ===== */
.cause{margin-top:34px;display:grid;gap:10px;max-width:449px}
.cause .k{display:flex;align-items:center;gap:10px;font:700 13.6px/17px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--eyebrow)}
.cause .k .iso{font-size:22px}
.cause h3{font:800 25px/1.1 "Bricolage Grotesque",Inter,sans-serif;letter-spacing:-.005em}
.cause a{font:700 16px/1.2 Inter;color:var(--blue)}
.m .cause{margin-top:30px;max-width:none}
.m .cause h3{font-size:22px}
/* ===== Opción C: banda ancha al pie de la portada ===== */
.wide{background:var(--ink);color:#fff;position:absolute;left:0;right:0;padding:0}
.d .wide{top:811px;height:132px}
.d .wide>div{width:1240px;margin:0 auto;padding:0 16px;height:100%;display:grid;grid-template-columns:560px 1fr auto;gap:36px;align-items:start;padding-top:20px}
.wide h3{font:800 34px/1.04 "Bricolage Grotesque",Inter,sans-serif;letter-spacing:-.01em}
.wide h3 em{font-style:normal;color:#7fb0fd}
.wide p{font:400 15.5px/1.5 Inter;color:var(--mute)}
.ghost{border:2px solid #fff;color:#fff;border-radius:999px;font:700 16px/1 Inter;padding:13px 22px;white-space:nowrap}
.m .wideflow{background:var(--ink);color:#fff;margin:26px -16px 0;padding:24px 16px 26px;display:grid;gap:10px}
.m .wideflow h3{font:800 26px/1.05 "Bricolage Grotesque",Inter,sans-serif}
.m .wideflow h3 em{font-style:normal;color:#7fb0fd}
.m .wideflow p{font:400 15px/1.5 Inter;color:var(--mute)}
.m .wideflow .ghost{justify-self:start;margin-top:4px}
/* ===== Sección completa «Por qué lo hacemos» ===== */
.sec{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.d .sec{padding:96px 0 104px}
.m .sec{padding:56px 16px 64px}
.sec .in{width:1240px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
.m .sec .in{width:100%;padding:0}
.sec .eb{color:#9cc2ff;display:flex;align-items:center;gap:10px}
.sec .eb .iso{font-size:24px}
.sec h2{font:800 clamp(36px,5vw,60px)/1.04 "Bricolage Grotesque",Inter,sans-serif;letter-spacing:-.01em;max-width:18em;margin-bottom:30px}
.d .sec h2{font-size:60px}
.m .sec h2{font-size:34px;margin-bottom:22px}
.sec h2 em{font-style:normal;color:#7fb0fd}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:56px;max-width:1000px}
.m .cols{grid-template-columns:1fr;gap:16px}
.sec p{font:400 19px/1.6 Inter;color:#e3e8f2}
.m .sec p{font-size:16.5px}
.eje{margin-top:44px;padding-top:28px;border-top:1px solid rgba(255,255,255,.18);max-width:820px;font:800 26px/1.2 "Bricolage Grotesque",Inter,sans-serif;color:#fff}
.m .eje{font-size:21px;margin-top:32px;padding-top:22px}
.eje span{color:#7fb0fd}
.sec .acts{display:flex;gap:22px;align-items:center;margin-top:36px;flex-wrap:wrap}
.m .sec .acts{flex-direction:column;align-items:stretch;gap:16px}
.sec .btn{box-shadow:0 6px 18px rgba(48,128,252,.35)}
.m .sec .btn{justify-content:center}
.sec .acts a.t{color:#9cc2ff;font:700 17px/1 Inter;text-decoration:none}
.m .sec .acts a.t{text-align:center}
.pill{position:absolute;right:-60px;top:-40px;opacity:.14}
.fold{position:absolute;left:0;right:0;border-top:2px dashed rgba(220,38,38,.85);z-index:5}
.fold i{position:absolute;right:8px;top:-22px;font:700 11px/1 Inter;background:#dc2626;color:#fff;padding:4px 7px;border-radius:4px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="note"><b>Landing: la causa de Cycles (CYC-292).</b> Réplica fiel de la portada real (getcycles.app, 17-11-2026) con las tres formas de subir la causa a los primeros segundos. La línea roja marca el borde de la primera pantalla (escritorio 1440 × 900, móvil 390 × 844).</div>
<div id="out"></div>
<script>
const ISO=(c)=>`<svg class="iso" viewBox="0 0 100 100" fill="none" stroke="${c}" stroke-width="20" stroke-linecap="round" aria-hidden="true"><path d="M17.09 69 A38 38 0 0 1 61.74 13.86"/><path d="M81.5 28.75 A38 38 0 0 1 35.77 85.23"/></svg>`;
const ARROW='<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const hd=`<div class="hd"><div><img src="assets/logo.png" alt="Cycles"><span>Ya tengo una cuenta</span></div></div>`;
const eb='<div class="eb">Para preparadores físicos</div>';
const h1='<h1>Planifica el ciclo. Recibe el feedback. <em>Ajusta el siguiente.</em></h1>';
const lead='<p class="lead">Cycles es la plataforma de ciclos de entrenamiento para coaches: tú los planificas en la web, tu atleta los entrena en la app y te cuenta cómo le fue, y tú ajustas el siguiente con lo que de verdad pasó.</p>';
const btn=`<span class="btn">Quiero acceso anticipado ${ARROW}</span>`;
const steps='<ol class="steps"><li><i>1</i>Planificas en la web</li><li><i>2</i>Tu atleta registra en la app</li><li><i>3</i>Ves qué pasó y ajustas</li></ol>';
const fold=(y)=>`<div class="fold" style="top:${y}px"><i>BORDE DE LA PRIMERA PANTALLA</i></div>`;
const visD='<img class="vis" src="assets/visual-desktop.png" alt="">';
const visM='<img class="vis" src="assets/visual-movil.png" alt="">';

const T={
  A:'Queremos poner la ciencia del deporte al alcance de cada coach.',
  B:'Queremos poner la ciencia del deporte al alcance de cada coach.',
  C:'Queremos cambiar la forma tradicional de entrenar.'
};

function desktop(opt){
  let top='',left='',after='';
  if(opt==='A'){top=`<div class="band"><div>${ISO('#3080fc')}<span><b>${T.A}</b></span><a href="#">Por qué lo hacemos ↓</a></div></div>`;left=steps;}
  if(opt==='B'){left=`<div class="cause"><div class="k">${ISO('#3080fc')}Nuestra causa</div><h3>${T.B}</h3><a href="#">Por qué lo hacemos ↓</a></div>`;}
  if(opt==='C'){left='';after=`<div class="wide"><div><h3>${T.C.replace('forma tradicional','<em>forma tradicional</em>')}</h3><p>Hoy la ciencia del deporte la usan atletas profesionales con equipos enteros. Estamos construyendo Cycles para que cualquier coach independiente pueda acercarse a ella.</p><span class="ghost">Quiero sumarme</span></div></div>`;}
  if(opt==='act'){left=steps;}
  return `<div class="pg d">${hd}${top}<div class="hero"><div class="wrap"><div>${eb}${h1}${lead}${btn}${left}</div><div>${visD}</div></div></div>${after}${fold(opt==='A'?900-0:900)}</div>`;
}
function mobile(opt){
  let top='',flow='';
  if(opt==='A'){top=`<div class="band"><div>${ISO('#3080fc')}<span><b>${T.A}</b> <a href="#">Por qué ↓</a></span></div></div>`;}
  if(opt==='B'){flow=`<div class="cause"><div class="k">${ISO('#3080fc')}Nuestra causa</div><h3>${T.B}</h3><a href="#">Por qué lo hacemos ↓</a></div>`;}
  if(opt==='C'){flow=`<div class="wideflow"><h3>${T.C.replace('forma tradicional','<em>forma tradicional</em>')}</h3><p>Hoy la ciencia del deporte la usan atletas profesionales con equipos enteros. Estamos construyendo Cycles para que cualquier coach independiente pueda acercarse a ella.</p><span class="ghost">Quiero sumarme</span></div>`;}
  return `<div class="pg m">${hd}${top}<div class="hero">${eb}${h1}${lead}${btn}${flow}${visM}</div>${fold(844)}</div>`;
}
function section(kind){
  const body=`<div class="in"><div class="eb">${ISO('#3080fc')}Por qué lo hacemos</div>
<h2>La ciencia del deporte no debería ser <em>cosa de equipos grandes.</em></h2>
<div class="cols"><p>Hoy, las herramientas que se apoyan en ella las usan atletas profesionales con equipos enteros detrás. El coach que entrena solo con sus atletas se queda con un Excel y un chat.</p>
<p>Estamos construyendo Cycles para cerrar esa distancia: ponerla al alcance de coaches pequeños e independientes, para que lleven su trabajo más lejos. Es una dirección, no una promesa: recién empezamos, vamos paso a paso y el coach siempre decide.</p></div>
<div class="eje">Que cualquier atleta que entrene en serio tenga <span>la comprensión que hoy solo tiene la élite.</span></div>
<div class="acts"><span class="btn">Quiero acceso anticipado ${ARROW}</span><a class="t" href="#">Quiero sumarme a la causa</a></div></div>`;
  return `<div class="pg ${kind} auto"><div class="sec">${body}</div></div>`;
}
const out=document.getElementById('out');
const add=(id,label,html)=>{out.insertAdjacentHTML('beforeend',`<div class="lab">${label}</div><div class="row" id="${id}">${html}</div>`)};
add('r-act','Hoy (producción)',desktop('act')+mobile('act'));
add('r-A','Opción A · Franja de causa',desktop('A')+mobile('A'));
add('r-B','Opción B · Bloque de causa en la portada (reemplaza los 3 pasos) · APROBADA con T2',desktop('B')+mobile('B'));
add('r-C','Opción C · Banda ancha al pie de la portada',desktop('C')+mobile('C'));
add('r-S','Sección «Por qué lo hacemos» (se suma a las tres opciones, después de los pilares)',section('d')+section('m'));
// la sección usa .d/.m de ancho: ajustar alto automático
document.querySelectorAll('.pg.auto').forEach(e=>{e.style.height='auto'});
</script>
</body>
</html>
