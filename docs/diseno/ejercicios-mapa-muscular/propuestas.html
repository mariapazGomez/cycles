<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ejercicios con mapa muscular Cycles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
<style>
/* Concepto: el mapa del cuerpo de la app pasa a la web como filtro. Es un atajo visual: tocas una zona y la lista se acota; los botones de grupo de siempre siguen ahí (son la forma accesible y cubren Cardio y Otro) y se mantienen sincronizados con el mapa. Mismo cuerpo y mismas zonas que la app móvil. Radios 6/8/10. Solo modo claro. Datos de ejemplo. */
:root{--font-display:"Bricolage Grotesque","Inter",system-ui,sans-serif;--font-body:"Inter",system-ui,sans-serif;
 --brand:#3080fc;--blue:#1a66dd;--blue-100:#eaf2ff;--bg:#fff;--ink:#1f2228;--ink2:#5c6068;--gray:#f6f7f9;--line:#dfe2e7;--page:#f3f5f8;--ctl:#8a8f98;--nofill:#dfe4ec;
 --ok-bg:#e9f5ec;--ok-ink:#1e6b32;--pain-bg:#fdecec;--pain-ink:#a3282c;
 --radius-xs:4px;--radius-sm:6px;--radius-md:8px;--radius-lg:10px;--radius-pill:999px;
 --e1:0 0 0 1px rgba(31,34,40,.06),0 1px 2px rgba(31,34,40,.06),0 3px 8px -2px rgba(31,34,40,.08);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}button{cursor:pointer}
h1,h2,h3{font-family:var(--font-display);margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ctl{max-width:1240px;margin:0 auto;padding:16px 16px 0;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.ctl h1{font-size:1.3rem;width:100%}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.grp>span{font-size:.78rem;font-weight:700;color:var(--ink2)}
.seg{display:flex;flex-wrap:wrap;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-md);padding:3px}
.seg button{border:0;background:none;padding:6px 12px;min-height:34px;border-radius:var(--radius-sm);font:600 .84rem var(--font-body);color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.note{max-width:1240px;margin:10px auto 0;padding:0 16px;font-size:.86rem;color:var(--ink2)}
.stage{padding:14px 16px 40px}
.win{margin:0 auto;background:var(--page);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;transform-origin:top left}
.hdr{display:flex;align-items:center;gap:22px;padding:10px 22px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-family:var(--font-display);font-weight:700;font-size:1.15rem}
.nav{display:flex;gap:16px;flex:1;overflow:hidden}.nav a{font-size:.9rem;font-weight:600;color:var(--ink2);padding:6px 3px;border-bottom:2px solid transparent}.nav a.on{color:var(--ink);border-bottom-color:var(--brand)}
.av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.pg{padding:22px 28px 36px}.w-m .pg{padding:14px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.ph h2{font-size:1.9rem}.w-m .ph h2{font-size:1.5rem}
.btn{border:1px solid var(--ctl);background:var(--bg);border-radius:var(--radius-md);padding:8px 16px;min-height:40px;font-weight:600;font-size:.9rem}.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{padding:4px 12px;min-height:34px}
.tabs{display:flex;gap:4px;margin:0 0 12px}.tab{border:0;background:none;padding:8px 14px;min-height:40px;border-radius:var(--radius-md);font-weight:600;color:var(--ink2)}.tab em{font-style:normal;font-size:.78rem;margin-left:6px;background:var(--gray);padding:0 7px;border-radius:999px}.tab[aria-selected=true]{background:var(--ink);color:#fff}.tab[aria-selected=true] em{background:#3a3f48;color:#fff}
.tool{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.search{border:1px solid var(--ctl);border-radius:var(--radius-md);padding:8px 12px;min-height:40px;background:var(--bg);min-width:220px;color:var(--ink2);font-size:.9rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;gap:6px;align-items:center;border:0;border-radius:var(--radius-md);background:var(--bg);box-shadow:var(--e1);padding:6px 12px;min-height:36px;font:700 .82rem var(--font-body);color:var(--ink2)}
.chip em{font-style:normal;font-size:.74rem;font-weight:700;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}.chip[aria-pressed=true] em{color:#c8ced8}
.chip[disabled]{opacity:.45;cursor:not-allowed}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.w-t .lay,.w-m .lay{display:block}
.card{background:var(--bg);border-radius:var(--radius-lg);box-shadow:var(--e1);padding:14px}
.map{position:sticky;top:12px}
.map h3{font-size:1.05rem;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.figs{display:flex;justify-content:space-around;gap:6px}
.fig{width:46%;text-align:center}.fig small{display:block;font-size:.76rem;color:var(--ink2);margin-top:2px}
.canvas{position:relative;aspect-ratio:400/810}.canvas img,.canvas svg{position:absolute;inset:0;width:100%;height:100%}
.zone{cursor:pointer;transition:none;stroke-linejoin:round}
.zone.off{cursor:not-allowed}
.sel{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;min-height:34px;align-items:center}
.sel .none{font-size:.84rem;color:var(--ink2)}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--blue-100);color:var(--ink);border-radius:var(--radius-sm);padding:3px 4px 3px 10px;font-weight:700;font-size:.82rem}
.tag button{border:0;background:none;width:26px;height:26px;border-radius:var(--radius-xs);font-weight:700}
.link{border:0;background:none;color:var(--blue);font-weight:700;text-decoration:underline;min-height:34px;padding:0 4px}
.w-t .map{position:static;margin-bottom:14px}.w-t .figs{justify-content:center;gap:40px}.w-t .fig{width:130px}
.w-m .map{position:static;margin-bottom:12px}.w-m .fig{width:44%}
.mapbtn{display:none;margin-bottom:10px}.w-m .mapbtn{display:inline-flex}
.w-m .map.closed{display:none}
.count{font-weight:700;margin:2px 0 8px;font-size:.92rem}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{background:var(--bg);border-radius:var(--radius-lg);box-shadow:var(--e1);padding:12px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.row h4{margin:0 0 4px;font-size:1rem}
.pill{display:inline-block;border-radius:var(--radius-pill);padding:1px 10px;font-size:.76rem;font-weight:700;background:var(--gray);color:var(--ink2);margin-right:4px}
.pill.m{background:var(--blue-100);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--brand)}
.pill.eq{background:var(--blue-100);color:var(--blue)}
.sep{font-size:.8rem;font-weight:700;color:var(--ink2);margin:10px 0 2px}
.empty{padding:26px;text-align:center;color:var(--ink2)}.empty h3{color:var(--ink);font-size:1.1rem;margin-bottom:6px}
.banner{border-radius:var(--radius-md);padding:10px 14px;margin-bottom:12px;font-size:.9rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--pain-bg);color:var(--pain-ink)}
.sk{height:14px;border-radius:4px;background:linear-gradient(90deg,#eceef2,#f6f7f9,#eceef2);margin:8px 0}
.tip{position:absolute;z-index:5;background:var(--ink);color:#fff;border-radius:var(--radius-sm);padding:4px 10px;font-size:.78rem;font-weight:600;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div class="ctl">
  <h1>Ejercicios con el mapa muscular <span class="chip" style="min-height:0;padding:2px 10px;font-size:.74rem">origin/main d3586ac</span></h1>
  <div class="grp"><span>Ancho</span><div class="seg" id="g-w"><button data-k="d" aria-pressed="true">Escritorio 1280</button><button data-k="t" aria-pressed="false">Tablet 820</button><button data-k="m" aria-pressed="false">Móvil 390</button></div></div>
  <div class="grp"><span>Estado</span><div class="seg" id="g-s"><button data-k="ok" aria-pressed="true">Normal</button><button data-k="load" aria-pressed="false">Cargando</button><button data-k="err" aria-pressed="false">Error</button></div></div>
  <div class="grp"><button class="btn sm" id="reset">Reiniciar la maqueta</button></div>
</div>

const norm=t=>t.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function base(){return DATA.filter(e=>(tab==='mine'?e.mine:true)).filter(e=>!q||norm(e.n).includes(norm(q)))}
function groupsOf(e){return [e.p,...e.s]}
function counts(){const c={};ORDER.forEach(g=>c[g]=0);base().forEach(e=>groupsOf(e).forEach(g=>c[g]++));return c}
function visible(){let r=base();if(sel.size)r=r.filter(e=>groupsOf(e).some(g=>sel.has(g)));
 return r.sort((a,b)=>{const pa=sel.has(a.p)?0:1,pb=sel.has(b.p)?0:1;return pa-pb||a.n.localeCompare(b.n,'es')})}
function toggle(g){if(sel.has(g))sel.delete(g);else sel.add(g);render()}
function fig(view,c){
 const v=ZONES[view];
 const paths=v.zones.map(z=>{const on=sel.has(z.g),off=c[z.g]===0&&!on,hv=hover===z.g;
  const fill=on?'#3080fc':hv&&!off?'#8fb8fb':'#dfe4ec',op=on?.88:off?.25:hv?.9:.55;
  return `<path class="zone${off?' off':''}" data-g="${z.g}" d="${z.d}" fill="${fill}" fill-opacity="${op}" stroke="${on?'#1f2228':'none'}" stroke-width="${on?2.5:0}"/>`}).join('');
 return `<div class="fig"><div class="canvas"><img src="${IMG[view]}" alt=""><svg viewBox="${v.viewBox}" aria-hidden="true">${paths}</svg></div><small>${view==='front'?'Frente':'Espalda'}</small></div>`}
function mapCard(c){
 const closed=w==='m'&&!mapOpen;
 return `<aside class="card map${closed?' closed':''}" aria-label="Mapa del cuerpo"><h3>Zona del cuerpo ${sel.size?`<button class="link" id="clear">Limpiar</button>`:''}</h3>
 <div class="figs">${fig('front',c)}${fig('back',c)}</div>
 <div class="sel">${sel.size?[...sel].map(g=>`<span class="tag">${LABEL[g]}<button aria-label="Quitar ${LABEL[g]}" data-rm="${g}">×</button></span>`).join(''):'<span class="none">Toca una zona para filtrar.</span>'}</div></aside>`}
function chips(c){
 return `<div class="chips" role="group" aria-label="Filtrar por grupo muscular"><button class="chip" aria-pressed="${sel.size===0}" id="all">Todos</button>${ORDER.map(g=>`<button class="chip" data-g="${g}" aria-pressed="${sel.has(g)}" ${c[g]===0&&!sel.has(g)?'disabled':''}>${LABEL[g]} <em>${c[g]}</em></button>`).join('')}</div>`}
function list(){
 const r=visible();
 if(!r.length){const names=[...sel].map(g=>LABEL[g]).join(' o ');return `<div class="card empty"><h3>Ningún ejercicio trabaja ${names||'eso'}${q?` con «${q}»`:''}</h3><p style="margin:0 0 12px">Prueba con otra zona${tab==='mine'?', o mira el Catálogo':''}.</p><button class="btn" id="clear2">Limpiar filtros</button></div>`}
 const prim=r.filter(e=>!sel.size||sel.has(e.p)),sec=r.filter(e=>sel.size&&!sel.has(e.p));
 const row=e=>`<li class="row"><div><h4>${e.n}</h4>${groupsOf(e).map((g,i)=>`<span class="pill${sel.has(g)?' m':''}">${LABEL[g]}</span>`).join('')}<span class="pill eq">${e.eq}</span></div>${tab==='mine'?'<button class="btn sm">Editar</button>':''}</li>`;
 return `<ul class="list">${prim.map(row).join('')}${sec.length?`<li class="sep">También trabajan esta zona</li>${sec.map(row).join('')}`:''}</ul>`}
function body(){
 const c=counts(),mine=DATA.filter(e=>e.mine).length;
 const tabs=`<div class="tabs" role="tablist"><button class="tab" role="tab" data-t="mine" aria-selected="${tab==='mine'}">Míos <em>${mine}</em></button><button class="tab" role="tab" data-t="catalog" aria-selected="${tab==='catalog'}">Catálogo <em>${DATA.length}</em></button></div>`;
 const head=`<div class="ph"><h2>Ejercicios</h2><button class="btn p">Nuevo ejercicio</button></div>`;
 if(st==='err')return head+`<div class="banner" role="alert">No se pudieron cargar los ejercicios. <button class="btn sm">Reintentar</button></div>`;
 if(st==='load')return head+tabs+`<div class="lay"><div>${[1,2,3,4].map(()=>'<div class="card" style="margin-bottom:8px"><div class="sk" style="width:40%"></div><div class="sk" style="width:60%"></div></div>').join('')}</div><aside class="card map"><h3>Zona del cuerpo</h3><div class="figs">${['front','back'].map(v=>`<div class="fig"><div class="canvas"><img src="${IMG[v]}" alt="" style="opacity:.6"></div><small>${v==='front'?'Frente':'Espalda'}</small></div>`).join('')}</div></aside></div>`;
 const n=visible().length;
 const mapBtn=`<button class="btn mapbtn" id="mapbtn" aria-expanded="${mapOpen}">Mapa del cuerpo${sel.size?` · ${sel.size}`:''}</button>`;
 const tool=`<div class="tool"><div class="search">Buscar por nombre${q?': '+q:''}</div></div>`;
 const main=`<div><div class="count" role="status" aria-live="polite">${n} ${n===1?'ejercicio':'ejercicios'}${sel.size?' en '+[...sel].map(g=>LABEL[g]).join(' o '):''}</div>${list()}</div>`;
 return head+tabs+chips(c)+mapBtn+(w==='d'?`<div class="lay">${main}${mapCard(c)}</div>`:`${mapCard(c)}${main}`)}
function render(){
 [...document.getElementById('g-w').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===w));
 [...document.getElementById('g-s').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===st));
 const width=w==='d'?1280:w==='t'?820:390,avail=Math.max(320,document.documentElement.clientWidth-32),z=Math.min(1,avail/width);
 document.getElementById('stage').innerHTML=`<div style="width:${width*z}px;margin:0 auto"><div class="win ${w==='m'?'w-m':w==='t'?'w-t':''}" style="width:${width}px;zoom:${z}"><div class="hdr"><span class="logo">Cycles</span><nav class="nav"><a>Inicio</a><a>Atletas</a><a>Biblioteca</a><a class="on">Ejercicios</a></nav><span class="av">LG</span></div><div class="pg">${body()}</div></div></div>`;
 bind()}
function bind(){
 const s=document.getElementById('stage');
 s.querySelectorAll('.zone').forEach(p=>{const g=p.dataset.g;
  p.addEventListener('click',()=>{if(!p.classList.contains('off'))toggle(g)});
  p.addEventListener('mouseenter',()=>{hover=g;s.querySelectorAll(`.zone[data-g="${g}"]`).forEach(x=>{if(!x.classList.contains('off')&&!sel.has(g)){x.setAttribute('fill','#8fb8fb');x.setAttribute('fill-opacity','.9')}})});
  p.addEventListener('mouseleave',()=>{hover=null;s.querySelectorAll(`.zone[data-g="${g}"]`).forEach(x=>{if(!sel.has(g)){x.setAttribute('fill','#dfe4ec');x.setAttribute('fill-opacity',x.classList.contains('off')?'.25':'.55')}})})});
 s.querySelectorAll('.chip[data-g]').forEach(b=>b.onclick=()=>toggle(b.dataset.g));
 s.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>toggle(b.dataset.rm));
 s.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
 const all=s.querySelector('#all');if(all)all.onclick=()=>{sel.clear();render()};
 ['#clear','#clear2'].forEach(id=>{const e=s.querySelector(id);if(e)e.onclick=()=>{sel.clear();q='';render()}});
 const mb=s.querySelector('#mapbtn');if(mb)mb.onclick=()=>{mapOpen=!mapOpen;render()};
 const se=s.querySelector('.search');if(se)se.onclick=()=>{const v=prompt('Buscar por nombre',q);if(v!==null){q=v.trim();render()}};
}
document.getElementById('g-w').addEventListener('click',e=>{const b=e.target.closest('button');if(b){w=b.dataset.k;render()}});
document.getElementById('g-s').addEventListener('click',e=>{const b=e.target.closest('button');if(b){st=b.dataset.k;render()}});
document.getElementById('reset').onclick=()=>{sel.clear();q='';tab='mine';mapOpen=false;st='ok';render()};
window.addEventListener('resize',render);render();
</script>
</body>
</html>
