<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novedades: dos ciclos (CYC-316)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--ink:#1f2228;--ink2:#5c6068;--blue:#1a66dd;--soft:#e8effb;--line:#dde4f0}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,-apple-system,system-ui,sans-serif;background:#d9e0ee;color:var(--ink);padding:24px}
.grid{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.fr{display:grid;gap:8px;max-width:100%}
.cap{font:600 13px/1.35 Inter;color:#3f4757}
/* Popup actual (styles/novelty.css) */
.pop{position:relative;width:648px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(31,34,40,.28)}
.x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;font:400 24px/1 Inter;z-index:2}
.stage{position:relative;width:648px;height:292px;background:#eef1f6;border-bottom:1px solid var(--line);overflow:hidden}
.tx{padding:20px 26px 6px}
.tx h2{font:800 24px/1.25 Inter;margin-bottom:8px;text-wrap:balance}
.tx p{font:400 15px/1.5 Inter;color:#3f4757;min-height:46px}
.ft{display:flex;align-items:center;justify-content:space-between;padding:12px 26px 20px}
.dots{display:flex;gap:7px}
.dots i{width:8px;height:8px;border-radius:50%;background:#c9d2e4}
.dots i.on{background:var(--blue)}
.btn{height:42px;border-radius:999px;background:var(--blue);color:#fff;padding:0 20px;display:grid;place-items:center;font:700 14px/1 Inter}
/* Escenario: piezas con el aspecto de la interfaz nueva */
.box{position:absolute;background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px;box-shadow:0 4px 14px rgba(48,80,160,.12)}
.h{font:600 13px/1 Inter;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
.cal i{font:500 11px/18px Inter;font-style:normal;color:#8d95a3}
.cal span{font:400 13px/30px Inter}
.cal .off{color:#c3c8d1}
.cal .in{background:var(--soft)}
.cal .edge{background:var(--blue);color:#fff;border-radius:4px;font-weight:600}
.cal .today{box-shadow:inset 0 0 0 1px var(--ink);border-radius:4px}
.sum{position:absolute;background:var(--ink);color:#fff;border-radius:6px;padding:10px 14px;font:500 13px/1.3 Inter;white-space:nowrap}
.fld{margin-bottom:10px}
.fld b{display:block;font:600 12px/1 Inter;margin-bottom:5px}
.in1{height:34px;border:1px solid #c9d2e4;border-radius:6px;padding:0 10px;display:flex;align-items:center;font:400 13px/1 Inter}
.old{position:absolute;width:176px;background:#fff;border:1px dashed #8d95a3;border-radius:6px;padding:9px 11px;font:500 13px/1.2 Inter;color:var(--ink2);text-decoration:line-through;opacity:.38}
.warn{position:absolute;background:#fdeede;border:1px solid #f0c9a0;color:#5b2d0a;border-radius:6px;padding:10px 12px;font:500 13px/1.4 Inter;width:228px}
.ses{display:inline-block;width:6px;height:6px;border-radius:50%;background:#2f9e5f;position:absolute;left:50%;margin-left:-3px;bottom:2px}
.cal .s{position:relative}
.cal .outs{background:#fdeede;color:#8f4410;border-radius:4px}
/* Animaciones: el estado base es el final; con «reducir movimiento» queda esa imagen */
.a{animation-duration:4.8s;animation-iteration-count:infinite;animation-timing-function:ease;animation-fill-mode:both}

@keyframes start{0%,8%{background:transparent;color:var(--ink)}16%,100%{background:var(--blue);color:#fff}}
@keyframes fill{0%,22%{background:transparent}30%,100%{background:var(--soft)}}
@keyframes end{0%,46%{background:transparent;color:var(--ink)}54%,100%{background:var(--blue);color:#fff}}
@keyframes up{0%,56%{opacity:0;transform:translateY(10px)}66%,100%{opacity:1;transform:translateY(0)}}
@keyframes leave{0%,14%{opacity:1;transform:translateX(0)}40%,100%{opacity:.38;transform:translateX(18px)}}
@keyframes arrive{0%,30%{opacity:.25}55%,100%{opacity:1}}
.k-start{animation-name:start}.k-fill{animation-name:fill}.k-end{animation-name:end}.k-up{animation-name:up}.k-leave{animation-name:leave}.k-arrive{animation-name:arrive}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
@media(max-width:700px){.pop{zoom:.54}body{padding:16px}}
.lab{width:100%;font:700 13px/1 Inter;letter-spacing:.08em;text-transform:uppercase;color:#3f4757;margin-top:8px}
.chip{display:inline-block;font:700 11px/1 Inter;border-radius:999px;padding:5px 9px;background:#e8effb;color:#134fb0}
.warnc{display:inline-block;font:600 11px/1 Inter;border-radius:999px;padding:6px 10px;background:#fdeede;color:#8f4410}
.av{width:30px;height:30px;border-radius:50%;background:#1f2228;color:#fff;display:inline-grid;place-items:center;font:700 11px/1 Inter;margin-right:8px}
.cyh{display:flex;justify-content:space-between;font:700 13px/1 Inter;color:#1a66dd;margin-bottom:7px}
.cyh small{font:500 11px/1 Inter;color:#5c6068}
.wk7{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wk7 i{width:14px;height:14px;border-radius:50%;margin:0 auto}
.wk7 .n{width:5px;height:5px;margin-top:4px;background:#c9d2e4}
.wk7 .p{border:2px solid #8d95a3}
.wk7 .d{background:#2f9e5f}
.cnt{font:500 11px/1 Inter;color:#5c6068;margin-top:7px}
.st{font:800 17px/1.2 Inter;margin:8px 0}
.li{display:flex;justify-content:space-between;font:500 12px/1 Inter;border-top:1px solid #dde4f0;padding:8px 0}
.pb{height:34px;border-radius:999px;background:#1a66dd;color:#fff;display:grid;place-items:center;font:700 13px/1 Inter;margin-top:8px}
.sb{height:34px;border-radius:999px;border:1.5px solid #8d95a3;display:grid;place-items:center;font:700 13px/1 Inter;padding:0 10px;white-space:nowrap;font-size:12px}
.lk{font:700 12px/1 Inter;color:#1a66dd;white-space:nowrap}
@keyframes in1{0%,8%{opacity:0;transform:translateY(12px)}22%,100%{opacity:1;transform:translateY(0)}}
@keyframes in2{0%,30%{opacity:0;transform:translateY(12px)}46%,100%{opacity:1;transform:translateY(0)}}
@keyframes press{0%,45%,70%,100%{transform:scale(1)}55%{transform:scale(1.08)}}
.k-in1{animation-name:in1}.k-in2{animation-name:in2}.k-press{animation-name:press}
</style>
</head>
<body>
<div class="grid" id="out"></div>
<script>
const wk=(a)=>`<div class="wk7">${a.map(x=>`<i class="${x}"></i>`).join('')}</div>`;
const blk=(n,w,a,c)=>`<div class="cyh">${n}<small>${w}</small></div>${wk(a)}<div class="cnt">${c}</div>`;
const who=`<div style="font:700 14px/30px Inter;margin-bottom:10px"><span class="av">CR</span>Camila Rojas</div>`;
const line=`<div style="border-top:1px solid #dde4f0;margin:10px 0"></div>`;
const card=(extra,k1,k2)=>`<div class="box" style="left:174px;top:14px;width:300px;border-radius:12px">${who}${extra}<div class="a ${k1}">${blk('Fuerza base','Semana 1 de 4',['d','n','p','n','p','n','n'],'1 de 2 sesiones completadas')}</div>${line}<div class="a ${k2}">${blk('Rehabilitación hombro','Semana 1 de 3',['n','n','p','n','p','n','n'],'0 de 1 sesión completada')}</div></div>`;
const c1=()=>card('','k-in1','k-in2');
const c2=()=>card(`<div class="a k-up" style="margin-bottom:10px"><span class="warnc">Sesión omitida en Rehabilitación hombro</span></div>`,'','');
const ses=(cy,name,body,st,k)=>`<div class="box a ${k||''}" style="${st};border-radius:12px"><span class="chip">${cy}</span><div class="st">${name}</div>${body}</div>`;
const a1=()=>ses('Fuerza base','Te toca Torso','<div class="li">Press de banca<span>4 × 8</span></div><div class="li">Remo con barra<span>4 × 8</span></div>','left:50px;top:56px;width:262px','k-in1')+ses('Rehabilitación hombro','Te toca Movilidad','<div class="li">4 ejercicios<span></span></div>','left:336px;top:56px;width:262px','k-in2');
const a2=()=>ses('Fuerza base','Te toca Torso','<div class="li">Press de banca<span>4 × 8</span></div><div class="pb">Empezar sesión</div>','left:50px;top:42px;width:262px')+ses('Rehabilitación hombro','Te toca Movilidad','<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px"><span class="lk">Ver 4 ejercicios</span><span class="sb a k-press">Empezar sesión</span></div>','left:336px;top:78px;width:262px');
const G=[['Coach · coach-two-cycles@1',[['Los dos ciclos, a la vista','Si un atleta lleva dos ciclos, su tarjeta muestra ambos, con la semana y las sesiones completadas de cada uno.',c1],['El aviso dice de qué ciclo es','Así sabes dónde mirar. Con «Ver ciclos» abres su ficha y revisas cada uno.',c2]]],
['Atleta en la web · athlete-two-cycles@1',[['Tus dos ciclos en Hoy','Si llevas dos ciclos a la vez, ves las sesiones de ambos, cada una con el nombre de su ciclo.',a1],['Empieza la que quieras','Una va abierta con sus ejercicios. La otra está al lado, lista para ver o empezar.',a2]]]];
G[1][1][1][1]='Una va abierta con sus ejercicios. La otra aparece resumida, lista para ver o empezar.';
document.getElementById('out').innerHTML=G.map(g=>`<div class="lab">${g[0]}</div>`+g[1].map((s,i)=>`<div class="fr"><div class="pop"><span class="x">×</span><div class="stage">${s[2]()}</div><div class="tx"><h2>${s[0]}</h2><p>${s[1]}</p></div><div class="ft"><span class="dots">${g[1].map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</span><span class="btn">${i===g[1].length-1?'Entendido':'Siguiente'}</span></div></div><div class="cap">Slide ${i+1} de ${g[1].length}</div></div>`).join('')).join('');
window.__lens=G.map(g=>g[1].map(s=>[s[0].length,s[1].length]));
</script>
</body>
</html>
