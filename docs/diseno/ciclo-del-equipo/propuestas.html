<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ciclo del equipo (CYC-316)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--ink:#1f2228;--gray:#5c6068;--blue:#1a66dd;--brand:#3080fc;--soft:#e8effb;--bg:#f3f6fc;--line:#dde4f0;--green:#2f9e5f;--okbg:#e4f4ea;--oktx:#1d6b3f;--warn:#e0752b;--pain:#d64545;--sh:0 6px 20px rgba(48,80,160,.10)}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,-apple-system,system-ui,sans-serif;background:#d9e0ee;color:var(--ink);padding:24px}
.lab{font:700 13px/1 Inter;letter-spacing:.1em;text-transform:uppercase;color:#3f4757;margin:30px 0 12px}
.row{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.fr{display:grid;gap:8px;justify-items:start}
.cap{font:600 13px/1.3 Inter;color:#3f4757;max-width:390px}
/* ===== marco del teléfono ===== */
.ph{position:relative;width:390px;height:844px;background:var(--bg);overflow:hidden;border-radius:44px;box-shadow:0 0 0 1px #c9d2e4;flex:none}
.ph.tall{height:auto}
.sb{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 34px 6px 34px;font:600 16px/1 Inter}
.sb i{position:absolute;left:50%;top:10px;width:118px;height:34px;border-radius:20px;background:#000;transform:translateX(-50%)}
.sb em{font-style:normal;letter-spacing:.1em;font-size:11px}
.scr{padding:6px 16px 120px}
.hd{display:flex;align-items:center;gap:10px;margin:10px 0 14px}
.hd h1{font:700 32px/1.1 Inter;letter-spacing:-.01em;flex:1}
.hd svg.iso{width:34px;height:34px;flex:none}
.av{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 15px/1 Inter;flex:none}
.bell{width:40px;height:40px;display:grid;place-items:center;flex:none}
.bell svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.back{display:flex;align-items:center;gap:6px;color:var(--blue);font:600 17px/1 Inter;margin:6px 0 10px}
.back svg{width:22px;height:22px;stroke:var(--blue);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.card{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:16px 16px;margin-bottom:12px}
.card h2{font:700 20px/1.2 Inter}
.ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.ch span{font:500 14px/1 Inter;color:var(--gray)}
.dark{background:var(--ink);color:#fff;border-radius:22px;padding:18px 18px 18px;margin-bottom:12px;position:relative;overflow:hidden}
.dark .k{font:500 14px/1 Inter;color:#c9d0dc}
.dark .t{font:800 28px/1.1 Inter;margin:6px 0 8px;letter-spacing:-.01em}
.dark .n{font:800 40px/1 Inter}
.dark .n small{font:500 15px/1 Inter;color:#c9d0dc;margin-left:8px}
.segs{display:flex;gap:6px;margin-top:14px}
.segs i{flex:1;height:6px;border-radius:3px;background:#3a414e}
.segs i.on{background:var(--brand)}
.segs i.cur{background:#fff}
.beads{position:absolute;right:-6px;top:6px;width:150px;height:110px;opacity:.95}
.btnw{display:flex;justify-content:space-between;align-items:center;background:#fff;color:var(--ink);border-radius:999px;padding:0 22px;height:52px;font:700 17px/1 Inter;margin-top:16px}
.btnw svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 12px;font:700 13px/1 Inter;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--oktx)}
.chip.nx{background:var(--soft);color:var(--blue)}
.chip.sk{background:#fdeede;color:#8f4410}
.chip.pn{background:#fbe7e7;color:#9d2a2a}
.chip.gr{background:#eceff5;color:#3f4757}
.seg2{display:flex;background:#dce5f7;border-radius:999px;padding:5px;margin-bottom:12px}
.seg2 b{flex:1;text-align:center;border-radius:999px;padding:13px 0;font:700 16px/1 Inter;color:var(--gray)}
.seg2 b.on{background:var(--blue);color:#fff}
/* ===== isla ===== */
.isla{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(255,255,255,.96);border-radius:999px;padding:7px 8px;box-shadow:0 8px 28px rgba(31,34,40,.18),0 0 0 1px rgba(31,34,40,.04)}
.isla b{width:76px;height:46px;border-radius:999px;display:grid;place-items:center}
.isla b.on{background:var(--soft)}
.isla svg{width:26px;height:26px;fill:none;stroke:var(--gray);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.isla b.on svg{stroke:var(--blue)}
.home{position:absolute;left:50%;bottom:9px;width:134px;height:5px;border-radius:3px;background:#1f2228;transform:translateX(-50%)}
/* ===== matriz de la semana ===== */
.grid{display:grid;grid-template-columns:92px repeat(7,1fr);align-items:center;row-gap:4px}
.grid .dh{font:600 13px/1 Inter;color:var(--gray);text-align:center;padding:2px 0 8px}
.grid .dh.hoy{color:var(--blue);font-weight:800}
.grid .nm{font:700 14px/1.15 Inter;padding-right:6px}
.grid .c{height:42px;display:grid;place-items:center;border-radius:12px}
.grid .c.hoy{background:var(--soft)}
.pe{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;position:relative}
.pe svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pe.done{background:var(--green)}
.pe.pend{background:#fff;border:2.5px solid var(--green)}
.pe.skip{background:#cfd6e3}
.pe.skip svg{stroke:#fff}
.pe.none{width:5px;height:5px;background:#c3cbd9}
.pe .pdot{position:absolute;right:-5px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--pain);border:2px solid #fff}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font:500 13px/1 Inter;color:var(--gray)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg .pe{width:16px;height:16px}
.leg .pe svg{width:10px;height:10px}
.leg .pe.pend{border-width:2px}
/* ===== filas ===== */
.rw{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #edf0f6}
.rw:first-of-type{border-top:0}
.rw .av{width:40px;height:40px;font-size:14px}
.rw .tx{flex:1;min-width:0}
.rw .tx b{display:block;font:700 17px/1.2 Inter}
.rw .tx span{display:block;font:400 14px/1.3 Inter;color:var(--gray);margin-top:2px}
.bd svg.chev,.rw svg.chev{width:20px;height:20px;stroke:var(--gray);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bd{display:flex;align-items:center;gap:12px;padding:14px 14px;background:#fff;border-radius:22px;box-shadow:var(--sh);margin-bottom:10px}
.bd .gl{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.bd .gl svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bd .tx{flex:1}
.bd .tx b{display:block;font:700 18px/1.2 Inter}
.bd .tx span{font:400 14px/1.3 Inter;color:var(--gray)}
.ex{display:flex;align-items:center;gap:12px;padding:10px 12px;background:#f7f9fd;border-radius:16px;margin:6px 0}
.ex i{width:32px;height:32px;border-radius:50%;background:#eceff5;display:grid;place-items:center;font:700 14px/1 Inter;font-style:normal;color:var(--gray);flex:none}
.ex .tx{flex:1}
.ex .tx b{display:block;font:700 16px/1.2 Inter}
.ex .tx span{font:400 13px/1.3 Inter;color:var(--gray)}
.ex em{font:700 15px/1 Inter;font-style:normal;color:var(--gray)}
.wk{display:flex;gap:8px;margin-bottom:12px}
.wk b{width:48px;height:48px;border-radius:50%;background:#eceff5;display:grid;place-items:center;font:700 15px/1 Inter;color:var(--gray)}
.wk b.on{background:var(--ink);color:#fff}
.note{background:#f7f9fd;border-radius:16px;padding:12px 14px;margin-top:10px;font:400 15px/1.4 Inter}
.note .more{display:inline-block;margin-top:8px;color:var(--blue);font:700 15px/1 Inter}
.empty{display:grid;place-items:center;text-align:center;gap:14px;padding:70px 26px 0}
.empty .ill{width:96px;height:96px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.empty .ill svg{width:48px;height:48px;stroke:var(--blue);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty h2{font:800 24px/1.15 Inter}
.empty p{font:400 16px/1.45 Inter;color:#3f4757}
.empty .b{margin-top:8px;background:var(--blue);color:#fff;border-radius:999px;padding:0 26px;height:52px;display:inline-flex;align-items:center;font:700 17px/1 Inter}
/* ===== novedad ===== */
.scrim{position:absolute;inset:0;background:rgba(31,34,40,.55);display:grid;place-items:center}
.nv{width:calc(100% - 32px);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 10px 40px rgba(31,34,40,.3)}
.nv .dm{background:#f3f6fc;height:170px;position:relative}
.nv .pane{padding:16px 18px 6px;display:grid;gap:8px}
.nv .lb{font:700 12px/1 Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.nv h3{font:800 22px/1.15 Inter}
.nv p{font:400 16px/1.4 Inter}
.nv .ft{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 14px}
.nv .ft .sk{color:var(--blue);font:700 16px/1 Inter;padding:0 8px}
.nv .dots{display:flex;gap:4px}
.nv .dots i{width:8px;height:8px;border-radius:99px;background:#c9d3e6}
.nv .dots i.on{width:22px;background:var(--blue)}
.nv .nx{background:var(--blue);color:#fff;font:700 16px/1 Inter;border-radius:12px;padding:0 20px;height:44px;display:grid;place-items:center}
.mini{position:absolute;left:12px;right:12px;top:12px;background:#fff;border-radius:16px;box-shadow:var(--sh);padding:8px}
.mini .g{display:grid;grid-template-columns:54px repeat(7,1fr);align-items:center;row-gap:3px;font:700 11px/1 Inter}
.mini .g .pe{width:15px;height:15px;margin:auto}
.mini .g .pe svg{width:9px;height:9px}
.mini .g .pe.pend{border-width:2px}
.mini .g .pe.none{width:4px;height:4px}
.mini .g .pdt{right:-4px;top:-4px;width:8px;height:8px;border-width:1.5px}

/* ===== CYC-296: ejercicios por tiempo ===== */
.web{position:relative;width:1000px;max-width:100%;background:#fff;border-radius:16px;box-shadow:0 0 0 1px #c9d2e4;padding:18px 20px 22px;flex:none}
.web.nar{width:560px}
.web .wt{font:800 18px/1.2 Inter;margin-bottom:10px}
.wbk{border-radius:18px;box-shadow:0 2px 10px rgba(48,80,160,.12);overflow:hidden;margin-bottom:12px;background:#fff}
.wbk .bh{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:46px}
.wbk .bh i{width:14px;height:14px;border-radius:50%}
.wbk .bh b{font:700 16px/1.2 Inter}
.wbk .bh em{margin-left:auto;font:600 13px/1 Inter;font-style:normal;color:#3f4757}
.wr{display:grid;grid-template-columns:18px minmax(150px,1fr) 56px 128px 76px 64px 64px 28px;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid #e6ebf5;position:relative}
.wr.h{border-top:0;padding-top:6px;padding-bottom:2px;font:600 12px/1 Inter;color:#3f4757;text-align:center}
.wr.h span:nth-child(2){text-align:left}
.wr .gp{color:#8d95a3;font-size:16px;text-align:center}
.wr .nm b{display:block;font:700 15px/1.2 Inter}
.wr .nm span{font:400 12px/1.2 Inter;color:#3f4757}
.f{height:34px;border:1px solid #8d95a3;border-radius:10px;display:grid;place-items:center;font:500 14px/1 Inter;background:#fff}
.f.off{background:#eceff5;border-color:#c9d2e4;color:#5c6068}
.f.ph2{color:#5c6068}
.uf{display:flex;height:34px;border:1px solid #8d95a3;border-radius:10px;overflow:hidden}
.uf .v{flex:1;display:grid;place-items:center;font:500 14px/1 Inter}
.uf .u{display:flex;align-items:center;gap:4px;padding:0 8px;background:#e8effb;border-left:1px solid #8d95a3;font:700 12px/1 Inter;color:#134fb0;white-space:nowrap}
.uf .u svg{width:10px;height:10px;stroke:#134fb0;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.uf .u.st{background:#f3f6fc;color:#3f4757}
.dots3{font:700 18px/1 Inter;text-align:center;color:#3f4757}
.pop{position:absolute;z-index:5;background:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(31,34,40,.22);padding:6px;width:210px}
.pop div{padding:9px 10px;border-radius:8px;font:600 14px/1.2 Inter;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pop div.on{background:#e8effb;color:#134fb0}
.pop div small{font:400 12px/1.2 Inter;color:#3f4757;display:block}
.pop svg{width:16px;height:16px;stroke:#134fb0;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tag{display:inline-block;margin-left:6px;border-radius:999px;background:#e8effb;color:#134fb0;font:700 11px/1 Inter;padding:3px 7px;vertical-align:middle}
.wnote{margin-top:10px;font:500 13px/1.4 Inter;color:#3f4757;background:#f7f9fd;border-radius:10px;padding:10px 12px}
.fld{display:grid;gap:6px;margin:12px 0}
.fld>b{font:700 13px/1 Inter}
.sg{display:flex;gap:0;border:1px solid #8d95a3;border-radius:10px;overflow:hidden;width:fit-content}
.sg span{padding:9px 16px;font:600 14px/1 Inter;color:#3f4757;background:#fff}
.sg span.on{background:#1a66dd;color:#fff}
/* ---- app atleta ---- */
.xr{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border-radius:18px;margin-top:8px;box-shadow:0 2px 10px rgba(48,80,160,.10)}
.xr .nd{width:34px;height:34px;border-radius:50%;background:#eceff5;display:grid;place-items:center;font:700 15px/1 Inter;color:#5c6068;flex:none}
.xr .nd.cur{background:#e8effb;color:#1a66dd;box-shadow:0 0 0 2px #1a66dd inset}
.xr .tx{flex:1;min-width:0}
.xr .tx b{display:block;font:700 17px/1.2 Inter}
.xr .tx span{font:500 14px/1.3 Inter;color:#3f4757}
.pl{border-radius:999px;background:#eef3fc;padding:7px 11px;font:700 13px/1 Inter;color:#3f4757}
.pl.cur{background:#e8effb;color:#1a66dd}
.blk{background:#f3f6fc;border-radius:22px;padding:10px;margin-bottom:10px;box-shadow:0 4px 16px rgba(48,80,160,.10)}
.blk .bh2{display:flex;align-items:center;gap:10px;min-height:46px}
.blk .pr{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.blk .pr svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.blk .bh2 .t{flex:1}
.blk .bh2 .t b{display:block;font:800 16px/1.2 Inter}
.blk .bh2 .t span{font:500 13px/1.2 Inter;color:#3f4757}
.xt{font:800 28px/1.15 Inter;margin:6px 0 12px;padding:0 2px}
.beads2{display:flex;align-items:center;gap:6px;margin-bottom:14px;font:600 14px/1 Inter}
.beads2 i{width:12px;height:12px;border-radius:50%;background:#c3cbd9}
.beads2 i.d{background:#3080fc}
.beads2 i.a{width:18px;height:18px;background:#e8effb;border:2px solid #1a66dd}
.beads2 span{margin-left:6px}
.sc{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(48,80,160,.10)}
.sc .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sc .sh b{font:700 16px/1 Inter}
.tp{background:#e8effb;color:#134fb0;border-radius:999px;padding:5px 12px;font:700 12px/1 Inter}
.ringw{position:relative;width:236px;height:236px;margin:6px auto 12px}
.ringw svg{width:236px;height:236px;transform:rotate(-90deg)}
.ringw .ct{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringw .ct b{font:800 66px/1 Inter;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ringw .ct span{font:600 14px/1.2 Inter;color:#3f4757;margin-top:6px}
.bt{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:999px;font:700 17px/1 Inter;background:#1a66dd;color:#fff;box-shadow:0 6px 16px rgba(26,102,221,.30)}
.bt svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bt.sec{background:#fff;color:#1f2228;border:1.5px solid #8d95a3;box-shadow:none}
.bt.sec svg{stroke:#1f2228}
.bt.off{opacity:.45;box-shadow:none}
.btrow{display:flex;gap:10px}
.btrow .bt{flex:1}
.lnk{text-align:center;color:#1a66dd;font:700 15px/1 Inter;margin-top:14px}
.stp{display:flex;align-items:center;margin-top:6px}
.stp i{width:56px;height:56px;border-radius:50%;background:#e8effb;color:#1a66dd;display:grid;place-items:center;font:600 28px/1 Inter;font-style:normal}
.stp b{flex:1;text-align:center;font:800 52px/1 Inter}
.stp b small{font:700 20px/1 Inter;color:#3f4757;margin-left:4px}
.flab{font:600 13px/1 Inter;color:#3f4757}
.pend{display:flex;justify-content:space-between;background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;font:500 13px/1 Inter;color:#3f4757;box-shadow:0 2px 10px rgba(48,80,160,.10)}
.dn{display:flex;justify-content:space-between;align-items:center;background:#e4f4ea;border-radius:14px;padding:12px 14px;margin-bottom:10px;font:500 13px/1 Inter;color:#1d6b3f}
.dn b{font:700 13px/1 Inter}
.dn u{color:#1a66dd;font:600 13px/1 Inter;text-decoration:none}
.ft{position:absolute;left:0;right:0;bottom:0;padding:10px 16px 34px;background:#eef3fc}
.hint{font:500 13px/1.3 Inter;color:#3f4757;text-align:center;margin-bottom:8px}
.rb{background:#1f2228;border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:10px;color:#fff}
.rb .x{flex:1}
.rb .x small{display:block;font:500 11px/1 Inter;color:#c9d0dc}
.rb .x b{font:700 22px/1.2 Inter;font-variant-numeric:tabular-nums}
.rb .trk{height:4px;border-radius:2px;background:#3a414e;margin-top:6px;overflow:hidden}
.rb .trk i{display:block;height:4px;background:#3080fc}
.rb .sk2{border:1px solid #8d95a3;border-radius:999px;padding:8px 14px;font:700 13px/1 Inter}
.lg{font:500 14px/1.4 Inter;color:#3f4757;margin:6px 0 0 46px}
.scr.nopad{padding-bottom:0}

/* ===== CYC-305: RM y % del RM ===== */
.wbk{overflow:visible}
.wbk .bh{border-radius:18px 18px 0 0}
.wh{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.wr2{display:grid;grid-template-columns:18px minmax(130px,1fr) 52px 100px 124px 104px 54px 54px 28px;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid #e6ebf5;position:relative}
.wr2.h{border-top:0;padding-top:6px;padding-bottom:2px;font:600 12px/1 Inter;color:#3f4757;text-align:center}
.wr2.h span:nth-child(2){text-align:left}
.wr2 .gp{color:#8d95a3;font-size:16px;text-align:center}
.wr2 .nm b{font:700 15px/1.2 Inter}
.pw{position:relative}
.kgc{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:#e4f4ea;color:#1d6b3f;font:700 13px/1 Inter;padding:7px 11px;white-space:nowrap}
.kgc.no{background:#fdeede;color:#8f4410}
.kgc svg{width:11px;height:11px;stroke:#8f4410;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.src{font:700 11px/1 Inter;border-radius:999px;padding:4px 8px;white-space:nowrap;display:inline-block}
.src.co{background:#e8effb;color:#134fb0}
.src.at{background:#e4f4ea;color:#1d6b3f}
.src.es{background:#eceff5;color:#3f4757}
.alr{display:flex;align-items:center;gap:10px;background:#fdeede;border:1px solid #f0c9a0;color:#5b2d0a;border-radius:14px;padding:12px 14px;font:500 14px/1.4 Inter}
.alr svg{width:20px;height:20px;stroke:#8f4410;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.alr span{flex:1}
.alr u{color:#134fb0;font:700 14px/1 Inter;text-decoration:none;white-space:nowrap}
.sec{font:800 16px/1 Inter;margin:18px 0 8px}

.cq-rt{border-left:1px solid #e6ebf5;padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px}
.cq-rt h4{font:600 13px/1 Inter}
.cq-rt .srch2{border:1px solid #c9d2e4;border-radius:4px;padding:7px 8px;font:400 12px/1 Inter;color:#8d95a3}
.cq-rt .r{border:1px solid #dde4f0;border-radius:4px;padding:8px;font:500 12px/1.3 Inter}
.cq-rt .r small{display:block;font:400 11px/1.3 Inter;color:#5c6068;margin-top:3px}
.cq-toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#1f2228;color:#fff;border-radius:6px;padding:11px 16px;font:400 13px/1.3 Inter;display:flex;gap:16px;z-index:7;white-space:nowrap}
.cq-toast u{font-weight:600;text-decoration:none;color:#8ab4ff}
.cq-fl{margin-bottom:12px}
.cq-fl>div{font:500 13px/1 Inter;margin-bottom:6px}
.cq-in{height:40px;border:1px solid #c9d2e4;border-radius:6px;display:flex;align-items:center;padding:0 12px;font:400 14px/1 Inter}
.cq-in.ph2{color:#8d95a3}
.cq-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cq-pr{display:grid;grid-template-columns:22px 32px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #e6ebf5;font:400 14px/1.2 Inter}
.cq-pr .av{width:28px;height:28px;font-size:10px;font-weight:600}
.cq-ck{width:18px;height:18px;border-radius:4px;border:2px solid #8d95a3;display:grid;place-items:center}
.cq-ck.on{background:#1a66dd;border-color:#1a66dd}
.cq-ck svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.cq-ck.off{opacity:.35}
.cq-warn{background:#fdeede;border:1px solid #f0c9a0;color:#5b2d0a;border-radius:6px;padding:10px 12px;font:400 13px/1.45 Inter;margin-bottom:12px}
.cq-info{background:#e8effb;border:1px solid #b9ccf0;border-radius:6px;padding:10px 12px;font:400 13px/1.45 Inter;margin-bottom:12px}
.cq-acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.cq-ex{display:grid;grid-template-columns:1fr 60px 60px 70px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid #e6ebf5;font:400 14px/1.2 Inter}
.cq-ex.h{border-top:0;font:500 12px/1 Inter;color:#5c6068}

 const r=(n,a,p)=>`<div class="t3r t3rk"><span class="n">${n}</span><div class="nm">${AVb(a[0])}${a[1]}</div><div class="pg"><i style="width:${p}%"></i></div><span class="pc">${p} %</span></div>`;
 return `<div class="t3mn">${head('Rankings',`<div class="t3seg"><span class="on">Últimas 4 semanas</span><span>Este ciclo</span></div>`)}
 <div class="t3tb"><div class="t3r h t3rk"><span class="n">#</span><span>Atleta</span><span>Sesiones completadas</span><span class="pc"></span></div>
 ${r(1,ATH[2],96)}${r(2,ATH[0],88)}${r(3,ATH[1],71)}${r(4,ATH[3],40)}${r(5,ATH[4],0)}</div>
 <div class="t3note">Ordena a los atletas por el porcentaje de sesiones completadas sobre las asignadas en el período.</div></div>`;
}
const frame=(sideH,main,w=250,over='')=>`<div class="web t3">${T3NAV}<div class="t3sh" style="--sbw:${w}px">${sideH}${main}</div>${over}</div>`;
function f1(){return frame(side('Calendario'),calendario());}
function f11(){return frame(side('Calendario'),calendarioSemana());}
function f2(){return frame(side('Calendario',{col:true}),calendario(),72);}
function f3(){return frame(side('Calendario',{dd:ddOpen}),calendario());}
function f4(){return frame(side('Ciclos'),ciclos());}
function f9(){return frame(side('Eventos'),eventos(true));}
function f10(){return eventoDlg();}
function f5(){return frame(side('Rankings'),rankings());}
function f6(){

 const over=`<div class="t3scrim"><div class="t3dlg"><h3>Atletas de Voleibol sub-17</h3>${m(ATH[0],['Al día','ok'])}${m(ATH[1],['Con avisos','sk'])}${m(ATH[2],['Al día','ok'])}${m(ATH[3],['Sin ciclo','gr'])}${m(ATH[4],['Invitación pendiente','gr'])}<div style="display:flex;gap:10px;margin-top:16px"><span class="t3btn pr">Agregar atletas</span><span class="t3btn">Cerrar</span></div></div></div>`;

function f7(){
 const side0=`<aside class="t3sb"><div class="t3tg"><b>${IC.panel}</b></div><div class="t3sel"><span style="color:#8d95a3">Sin equipos</span>${IC.chev}</div><div class="t3lab">Herramientas</div><div class="t3tools" style="opacity:.45">${TOOLS.map(x=>`<div class="t3tool"><span class="t3ic">${IC[x[1]]}</span>${x[0]}</div>`).join('')}</div></aside>`;
 return frame(side0,`<div class="t3mn"><div class="t3hd"><h2>Equipos</h2></div><div class="t3emp"><h3>Crea tu primer equipo</h3><p>Agrupa a tus atletas para darles la misma rutina a todos, cada uno con su propio peso.</p><span class="t3btn pr" style="height:44px;padding:0 22px">Crear equipo</span></div></div>`);
}
function f8(open){
 const nav=`<div style="padding:14px 16px;border-bottom:1px solid #e6ebf5;display:flex;align-items:center"><b style="font:600 16px/1 Inter;color:#1a66dd">Cycles</b><span style="margin-left:auto;font:500 14px/1 Inter;color:#134fb0">Equipos</span></div>`;
 const tabs=`<div class="t3tabs">${TOOLS.map((x,i)=>`<span class="${i===0?'on':''}">${IC[x[1]]}${i===0?x[0]:''}</span>`).join('')}</div>`;
 const body=`<div style="padding:16px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><h2 style="font:600 20px/1.1 Inter;margin-right:auto">Calendario</h2><span class="t3btn">12</span></div><div class="t3tb">${ATH.slice(0,4).map((a,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:${i?'1px solid #e6ebf5':'0'}">${AVb(a[0])}<span style="font:500 14px/1.2 Inter;flex:1">${a[1]}</span><div style="display:flex;gap:4px">${WEEK[i].slice(0,5).map(s=>mk(s)||'<div class="mk" style="border:1px dashed #dde4f0"></div>').map(h=>`<div style="width:22px">${h}</div>`).join('')}</div></div>`).join('')}</div></div>`;
 const dd=open?`<div class="t3dd" style="top:70px;left:16px;right:16px">${TEAMS.map((t,i)=>`<div class="o ${i===0?'on':''}"><i style="background:${t[1]}">${t[0]}</i><span>${t[2]}</span><em>${t[3]}</em></div>`).join('')}<div class="sep"></div><div class="o add">${IC.plus}<span>Crear equipo</span></div></div>`:'';
 return `<div class="web t3 t3ph" style="min-height:520px;position:relative">${nav}${selBox(TEAMS[0])}${tabs}${body}${dd}</div>`;
}
const wide=(h)=>h.replace('class="web t3"','class="web t3 wide"');
const CQ=(side_,main,over='')=>wide(frame(side_,main,250,over));
const scrim=(w,inner)=>`<div class="t3scrim"><div class="t3dlg" style="width:${w}px">${inner}</div></div>`;
const hd=(extra='')=>head('Ciclos',extra);
const note=(t)=>`<div class="t3note">${t}</div>`;
function vacio(){
 return CQ(side('Ciclos'),`<div class="t3mn">${hd()}<div class="t3emp"><h3>Este equipo aún no tiene ciclo</h3><p>Planifica una vez: las sesiones que pongas en el calendario del equipo llegan a cada integrante.</p><span class="t3btn pr" style="height:42px;padding:0 22px">Agregar ciclo</span></div></div>`);
}
const bgCic=()=>`<div class="t3mn">${hd()}<div class="t3emp" style="min-height:560px"><h3>Este equipo aún no tiene ciclo</h3></div></div>`;
const fl=(l,v,ph)=>`<div class="cq-fl"><div>${l}</div><div class="cq-in ${ph?'ph2':''}">${v}</div></div>`;
function datos(){
 return CQ(side('Ciclos'),bgCic(),scrim(520,`<h3>Nuevo ciclo para Voleibol sub-17</h3>
 ${fl('Nombre','Fuerza base')}${fl('Objetivo (opcional)','Base de fuerza antes de la liga')}
 ${fl('Tipo de ciclo','Mesociclo')}
 <div class="cq-2">${fl('Fecha de inicio','23 nov 2026')}${fl('Duración','4 semanas')}</div>
 <div class="cq-acts" style="justify-content:flex-end"><span class="t3btn">Cancelar</span><span class="t3btn pr">Continuar</span></div>`));
}
const ck=(on,off)=>`<span class="cq-ck ${on?'on':''} ${off?'off':''}">${on?IC.chk:''}</span>`;
const pr=(a,c,off,tag='')=>`<div class="cq-pr">${ck(c,off)}${AVb(a[0])}<span style="${off?'color:#8d95a3':''}">${a[1]}</span>${tag}</div>`;
function quien(){
 return CQ(side('Ciclos'),bgCic(),scrim(560,`<h3>¿Quién recibe «Fuerza base»?</h3>
 <div class="cq-warn">2 atletas ya tienen un ciclo propio en estas fechas. Si lo reciben, los dos ciclos conviven en su calendario. Decide por cada uno.</div>
 ${pr(ATH[0],1,0)}${pr(ATH[1],1,0,'<span class="cq-pill am">Tiene «Rehabilitación hombro»</span>')}${pr(ATH[2],1,0)}${pr(ATH[3],0,0,'<span class="cq-pill am">Tiene «Pretemporada»</span>')}${pr(ATH[4],0,1,'<span class="cq-pill">Invitación pendiente</span>')}
 <div style="font:400 13px/1.4 Inter;color:#5c6068;border-top:1px solid #e6ebf5;padding-top:10px">Y 7 atletas más sin otro ciclo, ya marcados.</div>
 <div class="cq-acts" style="justify-content:space-between"><span class="t3btn">Atrás</span><span class="t3btn pr">Crear ciclo para 10 atletas</span></div>`));
}
const ses=(name,meta,extra='',cls='')=>`<div class="cq-s ${cls}"><div class="t"><span>${name}</span><span>${cls?'':'⋯'}</span></div><div class="m">${meta}</div>${extra}</div>`;
const day=(n,inner='',o={})=>`<div class="cq-d ${o.past?'p':''}"><div class="h"><span>${o.today?'Hoy':''}</span>${o.today?`<b>${n}</b>`:`<span>${n}</span>`}</div>${inner}${o.past?(inner?'':'<span class="pt">Día pasado</span>'):'<div class="cq-plus">+</div>'}</div>`;
const DW=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const wk=(label,days)=>`<div class="cq-wl">${label}</div><div class="cq-wk">${days.join('')}</div>`;
function weeks(){
 const P={past:true};
 return wk('Semana 1: 23 al 29 nov',[day('Lun 23',ses('Piernas base','10 de 10 hechas','','done'),P),day('Mar 24','',P),day('Mié 25',ses('Torso','4 de 10 hechas'),{today:true}),day('Jue 26'),day('Vie 27',ses('Piernas base','10 atletas','<span class="cq-pill am">1 ajustada</span>')),day('Sáb 28'),day('Dom 29')])+
 wk('Semana 2: 30 nov al 6 dic',[day('Lun 30',ses('Piernas base','10 atletas')),day('Mar 1'),day('Mié 2',ses('Torso','10 atletas')),day('Jue 3'),day('Vie 4',ses('Piernas base','10 atletas')),day('Sáb 5'),day('Dom 6')])+
 wk('Semana 3: 7 al 13 dic',[day('Lun 7'),day('Mar 8'),day('Mié 9'),day('Jue 10'),day('Vie 11'),day('Sáb 12'),day('Dom 13')]);
}
const panelRt=`<div class="cq-rt"><h4>Rutinas</h4><div class="srch2">Buscar rutina</div><span class="t3btn pr" style="justify-content:center">Crear rutina nueva</span>${[['Piernas base','6 ejercicios'],['Torso','5 ejercicios'],['Pliometría','4 ejercicios'],['Movilidad','7 ejercicios']].map(r=>`<div class="r">${r[0]}<small>${r[1]}</small></div>`).join('')}</div>`;
const cycHead=(save='Guardado')=>`<div class="cq-ch"><b>Fuerza base</b><span class="cq-pill bl">En curso</span><span class="cq-pill">Mesociclo</span><span class="cq-pill">23 nov – 20 dic 2026</span><span class="cq-pill">10 de 12 atletas</span><span class="cq-save">${save}</span><span class="t3btn" style="height:30px;font-size:13px">Datos del ciclo</span></div>`;
const board=(over='')=>`<div class="t3mn">${hd('<span class="t3btn">Agregar ciclo</span>')}<div class="cq-cyc">${cycHead()}<div class="cq-bd"><div class="cq-cal">${weeks()}</div>${panelRt}</div></div>${over}</div>`;
function pizarra(){
 return CQ(side('Ciclos'),board(note('Es la misma pizarra del ciclo de un atleta: arrastra una rutina a un día o usa «+». Cada gesto se guarda solo y llega a los integrantes. Lo registrado no cambia.')));
}
function menuMover(){
 const menu=`<div class="t3dd" style="left:700px;right:auto;top:268px;width:210px"><div class="o"><span>Editar ejercicios</span></div><div class="o"><span>Mover a otro día…</span></div><div class="o"><span>Duplicar en otro día…</span></div><div class="o" style="color:#9d2a2a"><span>Quitar de este día</span></div></div><div class="cq-toast"><span>Cambio guardado: se actualizó en 9 atletas. 1 no cambió porque está ajustada.</span><u>Deshacer</u></div>`;
 return CQ(side('Ciclos'),board(menu));
}
function editarEquipo(){
 const ex=(n,s,r,k)=>`<div class="cq-ex"><span>${n}</span><span class="v">${s}</span><span class="v">${r}</span><span class="v">${k}</span></div>`;
 return CQ(side('Ciclos'),board(),scrim(560,`<h3>Piernas base, viernes 27 nov</h3>
 <div class="cq-info">Estás editando la sesión del equipo. El cambio llega a <b style="font-weight:600">9 atletas</b>. La sesión ajustada de Camila Rojas no cambia.</div>
 <div class="cq-ex h"><span>Ejercicio</span><span>Series</span><span>Reps</span><span>Carga</span></div>${ex('Sentadilla',4,6,'80 %')}${ex('Peso muerto',3,5,'70 %')}${ex('Hip thrust',3,10,'75 %')}
 <div class="cq-acts"><span class="t3btn pr">Guardar para 9 atletas</span><span class="t3btn">Cancelar</span></div>`));
}
function ventanaAtleta(){
 const ex=(n,s,r,k)=>`<div class="cq-ex"><span>${n}</span><span class="v">${s}</span><span class="v">${r}</span><span class="v">${k}</span></div>`;
 const main=`<div class="t3mn" style="padding:20px 24px"><div class="t3hd"><h2>Camila Rojas</h2></div><div class="cq-cyc"><div class="cq-ch"><b>Fuerza base</b><span class="cq-pill bl">En curso</span><span class="cq-pill bl">Ciclo de Voleibol sub-17</span></div><div class="cq-cal">${wk('Semana 1: 23 al 29 nov',[day('Lun 23',ses('Piernas base','Hecha','<span class="cq-pill bl">Del equipo</span>','done'),{past:true}),day('Mar 24','',{past:true}),day('Mié 25',ses('Torso','5 ejercicios','<span class="cq-pill bl">Del equipo</span>'),{today:true}),day('Jue 26'),day('Vie 27',ses('Piernas base','5 ejercicios','<span class="cq-pill am">Ajustada</span>')),day('Sáb 28'),day('Dom 29')])}</div></div></div>`;
 const over=scrim(560,`<h3>Piernas base de Camila, viernes 27 nov</h3>
 <div class="cq-warn">Este cambio es solo para Camila. La planificación del equipo no cambia, y esta sesión deja de recibir los cambios del equipo.</div>
 <div class="cq-ex h"><span>Ejercicio</span><span>Series</span><span>Reps</span><span>Carga</span></div>${ex('Sentadilla',3,6,'60 %')}${ex('Peso muerto',3,5,'60 %')}
 <div class="cq-acts"><span class="t3btn pr">Guardar solo para Camila</span><span class="t3btn">Cancelar</span></div>`);
 return wide(`<div class="web t3">${T3NAV.replace('class="on">Equipos','>Equipos').replace('<span class="">Atletas','<span class="on">Atletas')}${main}${over}</div>`).replace('<div class="web t3 wide">','<div class="web t3 wide" style="min-height:560px">');
}
function entra(){
 return CQ(side('Ciclos'),board(),scrim(480,`<h3>¿Le asignas el ciclo del equipo a Fernanda Gil?</h3>
 <div class="cq-info">Fernanda entró a Voleibol sub-17. Si lo recibe, le llegan las sesiones desde hoy, miércoles 25: <b style="font-weight:600">5 sesiones</b>.</div>
 <div class="cq-warn">Ya tiene el ciclo «Fuerza personal» en esas fechas. Los dos conviven.</div>

}
function sale(){
 return CQ(side('Ciclos'),board(),scrim(480,`<h3>Quitar a Camila Rojas del equipo</h3>
 <p style="font:400 14px/1.5 Inter;margin-bottom:8px">En «Fuerza base»:</p>
 <ul class="cq-li"><li>Se quitan <b style="font-weight:600">3 sesiones futuras</b>.</li><li>Conserva 2 sesiones ya registradas.</li><li>Conserva 1 sesión que ajustaste para Camila.</li></ul>
 <div class="cq-acts"><span class="t3btn pr" style="background:#b3261e;border-color:#b3261e">Quitar del equipo</span><span class="t3btn">Cancelar</span></div>`));
}
function integrantes(){
 const r=(a,e,c,d)=>`<div class="t3r cq-mem"><div class="nm">${AVb(a[0])}${a[1]}</div><span><span class="cq-pill ${c}">${e}</span></span><span style="font:400 13px/1.3 Inter;color:#3f4757">${d}</span></div>`;
 return CQ(side('Ciclos'),`<div class="t3mn">${hd('<span class="t3btn">Agregar ciclo</span>')}<div class="cq-cyc" style="margin-bottom:14px">${cycHead()}</div>
 <div class="t3tb"><div class="t3r h cq-mem"><span>Atleta</span><span>Ciclo del equipo</span><span>Detalle</span></div>${r(ATH[0],'Lo recibe','ok','2 de 2 hechas hasta hoy')}${r(ATH[1],'Lo recibe','ok','1 sesión ajustada. También tiene «Rehabilitación hombro»')}${r(ATH[2],'Lo recibe','ok','Al día')}${r(ATH[3],'No lo recibe','','Sigue con «Pretemporada». <u style="text-decoration:none;color:#134fb0;font-weight:500">Asignar desde hoy</u>')}${r(ATH[4],'No lo recibe','','Invitación pendiente')}</div>
 ${note('Debajo de la pizarra: quién recibe el ciclo y qué tiene de distinto. Cada nombre abre su ficha.')}</div>`);
}
function eliminarEquipo(){
 return CQ(side('Ciclos'),board(),scrim(480,`<h3>Eliminar «Voleibol sub-17»</h3>
 <p style="font:400 14px/1.5 Inter;margin-bottom:8px">El equipo tiene el ciclo «Fuerza base» en curso. En los 10 atletas que lo reciben:</p>
 <ul class="cq-li"><li>Se quitan <b style="font-weight:600">29 sesiones futuras</b>.</li><li>Conservan lo que ya registraron.</li><li>Conservan la sesión ajustada.</li></ul>
 <div class="cq-acts"><span class="t3btn pr" style="background:#b3261e;border-color:#b3261e">Eliminar equipo</span><span class="t3btn">Cancelar</span></div>`));
}
function novedad(){
 return `<div class="web t3" style="min-height:420px;background:#cfd8ea;display:grid;place-items:center"><div style="width:440px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 10px 40px rgba(31,34,40,.3)"><div style="height:170px;background:#f3f6fc;display:flex;align-items:center;justify-content:center;gap:14px"><div style="width:110px">${ses('Piernas base','Equipo')}</div><span style="font:500 24px/1 Inter;color:#1a66dd">→</span><div style="display:flex">${ATH.slice(0,4).map(a=>`<div style="margin-left:-4px">${AVb(a[0])}</div>`).join('')}</div></div><div style="padding:18px 22px 20px"><div style="font:600 20px/1.25 Inter;margin-bottom:8px">Planifica el ciclo de tu equipo</div><div style="font:400 15px/1.45 Inter;color:#3f4757;margin-bottom:16px">Pon las sesiones una vez en el calendario del equipo y llegan a cada integrante.</div><div style="display:flex;justify-content:flex-end"><span class="t3btn pr">Entendido</span></div></div></div></div>`;
}
const out=document.getElementById('out');
const add=(id,label,items)=>out.insertAdjacentHTML('beforeend',`<div class="lab">${label}</div><div class="row" id="${id}">${items.map(([c,h])=>`<div class="fr">${h}<div class="cap">${c}</div></div>`).join('')}</div>`);
add('r1','1 · Crear el ciclo del equipo',[['Equipo sin ciclo',vacio()],['Paso 1: los mismos datos de un ciclo nuevo',datos()],['Paso 2: quién lo recibe, con aviso de ciclos propios',quien()]]);
add('r2','2 · Calendario del ciclo del equipo',[['La pizarra de siempre, para todo el equipo',pizarra()],['Menú de una sesión y aviso con Deshacer',menuMover()],['Quién lo recibe',integrantes()]]);
add('r3','3 · Cambios',[['Editar la sesión del equipo: llega a los integrantes',editarEquipo()],['Editar desde la ficha de un atleta: solo su sesión',ventanaAtleta()]]);
add('r4','4 · Entrar y salir del equipo',[['Al agregar un atleta se pregunta',entra()],['Al quitarlo, se avisa antes',sale()],['Al eliminar el equipo, también (propuesta)',eliminarEquipo()]]);
add('r5','5 · Ficha de novedad',[['Coach, 1 slide',novedad()]]);

</script>
