<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invitación a Cycles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--ink:#1f2228;--ink2:#5c6068;--blue:#1a66dd;--brand:#3080fc;--line:#dfe2e7;--soft:#f6f7f9;--ctl:#8a8f98}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#d9e0ee;color:var(--ink);padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2.sec{font:600 15px/1.3 Inter;margin:28px 0 12px}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.fr{max-width:100%;min-width:0}
figcaption{font:500 13px/1.3 Inter;color:#3f4757;margin-bottom:8px}
.ib{background:#fff;border:1px solid var(--line);border-radius:6px}
.ib-row{display:flex;gap:20px;padding:13px 16px;font-size:14px;flex-wrap:wrap}
.ib-row>b{width:80px;font-weight:600}.ib-row span b{font-weight:600}.ib-row i{font-style:normal;color:var(--ink2)}
.ib-from{font-size:13px;color:#3f4757;margin-top:8px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;border:1px solid var(--line);border-radius:6px;padding:20px;font:400 13px/1.6 ui-monospace,Menlo,monospace}
/* Correo: motivo de proteína actual, con radios de 6 px y botón rectangular */
.em{background:var(--soft);padding:32px 16px;font-family:Helvetica,Arial,sans-serif}
.em-card{max-width:520px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.em-bar{height:6px;background:var(--brand)}
.em-in{background-repeat:no-repeat;background-position:center top;background-size:100% auto;padding:28px 28px 32px}
.em-logo{display:block;width:132px;margin-bottom:32px}
.em-letter{background:#eef4ff;border:1px solid #d6e4ff;border-radius:6px;padding:28px 24px;margin-bottom:24px}
.em-letter h1{font-size:24px;line-height:1.25;margin-bottom:18px}
.em-letter p{font-size:16px;line-height:1.55;margin-bottom:14px}
.em-letter .em-sign{margin:22px 0 0}
.em-act{background:#fff;border:1px solid var(--line);border-radius:6px;padding:24px 24px 4px}
.em-btn{display:inline-block;padding:14px 28px;border-radius:6px;background:var(--blue);color:#fff;font-size:16px;font-weight:600}
.em-small{font-size:13px;line-height:1.5;color:var(--ink2);margin:20px 0}
.em-link{color:var(--blue);overflow-wrap:anywhere}
.em-foot{padding:16px 28px;background:var(--soft);border-top:1px solid var(--line);font-size:13px;color:var(--ink2)}
.em-foot img{width:16px;height:16px;vertical-align:-3px;margin-right:8px}
.ph{border:8px solid var(--ink);border-radius:30px;overflow:hidden;background:#fff}
.ph .em{padding:16px 8px}.ph .em-in{padding:20px 14px}.ph .em-letter{padding:20px 16px}.ph .em-act{padding:18px 16px 2px}.ph .em-foot{padding:14px 16px}.ph .em-btn{display:block;text-align:center}
/* Pantallas actuales de la web, con su estilo de hoy */
.lp{background:var(--soft);padding:32px 24px}
.lp-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:40px 32px;text-align:center}
.lp-card h2{font:800 28px/1.15 Inter}
.lp-card>p{margin-top:14px;font-size:16px;line-height:1.55}
.lp-form{margin-top:28px;text-align:left;display:grid;gap:16px}
.lp-f{display:grid;gap:6px;font-size:14px}.lp-f b{font-weight:600}
.lp-i{height:44px;border:1px solid var(--ctl);border-radius:6px}.lp-ta{height:108px}
.lp-btn{justify-self:start;background:var(--brand);color:#fff;font:700 18px/1.2 Inter;padding:15px 30px;border-radius:999px;box-shadow:0 6px 18px rgba(48,128,252,.35)}
.lp-priv{font-size:14px;color:var(--ink2);line-height:1.5}
.lp-sent{background:#e9f5ec;color:#1e6b32;border-radius:8px;padding:14px 16px;font-weight:600;line-height:1.5}
.ph .lp{padding:20px 10px}.ph .lp-card{padding:28px 20px}.ph .lp-card h2{font-size:25px}
.au{background:var(--soft) center/cover no-repeat;padding:32px 24px;min-height:520px;display:flex;align-items:center;justify-content:center}
.au-card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px}
.au-logo{display:block;width:120px;margin-bottom:24px}
.au-card h1{font:700 25px/1.25 Inter;margin-bottom:20px}
.au-roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.au-role{border:1px solid var(--ctl);border-radius:12px;padding:12px;display:grid;gap:4px;text-align:center;font-size:14px}
.au-role.on{border:2px solid var(--blue);padding:11px}.au-role small{font-size:12px;color:var(--ink2);line-height:1.35}
.au-f{display:grid;gap:6px;margin-bottom:16px;font-size:14px}.au-f b{font-weight:600}
.au-f span{min-height:42px;border:1px solid var(--ctl);border-radius:8px;display:flex;align-items:center;padding:0 12px}
.au-f span.lock{background:var(--soft);color:var(--ink2);border-color:var(--line)}
.au-f small{font-size:13px;color:var(--ink2)}
.au-chk{display:flex;gap:8px;font-size:13px;line-height:1.45;margin-bottom:12px}.au-chk i{flex:none;width:15px;height:15px;border:1px solid var(--ctl);border-radius:3px;margin-top:2px}
.au-btn{display:block;text-align:center;background:var(--blue);color:#fff;border-radius:999px;padding:12px;font-weight:600;font-size:15px;margin-top:4px}
.au-foot{text-align:center;font-size:14px;color:var(--ink2);margin-top:20px}.au-foot em{font-style:normal;color:var(--blue);font-weight:600}
.au-p{font-size:15px;line-height:1.55;margin-bottom:14px}.au-p strong{font-weight:600;overflow-wrap:anywhere}
.au-legal{display:flex;justify-content:center;gap:20px;margin-top:20px;font-size:13px;color:var(--ink2)}
.ph .au{padding:20px 10px}.ph .au-card{padding:24px 18px}.ph .au-roles{grid-template-columns:1fr}
@media(max-width:560px){.em{padding:16px 8px}.em-in{padding:20px 12px}.em-letter,.em-act{padding-left:16px;padding-right:16px}.lp{padding:20px 8px}.lp-card{padding:24px 16px}.au{padding:20px 8px}.au-card{padding:24px 16px}.au-roles{grid-template-columns:1fr}.lp-btn{justify-self:stretch;text-align:center;font-size:16px}}
</style>
