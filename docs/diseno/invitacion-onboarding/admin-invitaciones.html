<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invitaciones en admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>/* Portal del equipo (CYC-193). Mismos tokens que la app; ver docs/diseno/panel-admin. */
:root {
  color-scheme: light;
  --font-display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
  --brand: #3080fc;
  --blue: #1a66dd;
  --blue-hover: #155ccc;
  --blue-100: #eaf2ff;
  --bg: #ffffff;
  --ink: #1f2228;
  --ink2: #5c6068;
  --gray: #f6f7f9;
  --line: #dfe2e7;
  --page: #f3f5f8;
  --ctl: #8a8f98;
  --ok-bg: #e9f5ec;
  --ok-ink: #1e6b32;
  --warn-bg: #fff1e3;
  --warn-ink: #9a4a00;
  --pain-bg: #fdecec;
  --pain-ink: #a3282c;
  --e1: 0 0 0 1px rgba(31, 34, 40, 0.06), 0 1px 2px rgba(31, 34, 40, 0.06), 0 3px 8px -2px rgba(31, 34, 40, 0.08);
  --pop: 0 8px 24px -8px rgba(0, 0, 0, 0.18);
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 10px;
  --radius-pill: 999px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: 0.55; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; }
code { font-size: 0.88em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.spacer { flex: 1; }
.fine { font-size: 0.84rem; color: var(--ink2); margin: 12px 0 0; }

.app-h { display: flex; align-items: center; gap: 12px; padding: 12px 24px; background: var(--bg); border-bottom: 1px solid var(--line); }
.app-h b { font-family: var(--font-display); font-size: 1.15rem; }
.who { font-size: 0.84rem; color: var(--ink2); }
.pg { padding: 24px 32px 48px; max-width: 1280px; margin: 0 auto; }
.pg h1 { font-size: 2rem; margin-bottom: 14px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; min-height: 44px; font-weight: 600; color: var(--ink2); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); }

.card { background: var(--bg); border-radius: var(--radius-lg); box-shadow: var(--e1); padding: 16px 18px; }
.section { margin-bottom: 16px; }
.section h3 { margin-bottom: 10px; font-size: 1.1rem; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi b { display: block; font-family: var(--font-display); font-size: 1.8rem; line-height: 1.1; }
.kpi span { font-size: 0.84rem; color: var(--ink2); }
.kpi.demo { background: var(--gray); box-shadow: inset 0 0 0 1px var(--line); }

.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.seg { display: flex; gap: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 12px; min-height: 34px; border-radius: var(--radius-sm); font-size: 0.84rem; font-weight: 600; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.inp { border: 1px solid var(--ctl); border-radius: var(--radius-md); padding: 8px 12px; min-height: 40px; background: var(--bg); min-width: 200px; }
.btn { display: inline-flex; align-items: center; border: 1px solid var(--ctl); background: var(--bg); border-radius: var(--radius-md); padding: 8px 16px; min-height: 40px; font-weight: 600; font-size: 0.9rem; color: var(--ink); text-decoration: none; }
.btn.p { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.p:hover:not(:disabled) { background: var(--blue-hover); }
.btn.danger { background: var(--pain-bg); border-color: var(--pain-ink); color: var(--pain-ink); }
a.btn, .btn { white-space: nowrap; }
.btn.sm { padding: 4px 12px; min-height: 36px; }
.link { border: 0; background: none; padding: 0; font-weight: 700; text-align: left; text-decoration: underline; text-underline-offset: 3px; }
.sortbtn { border: 0; background: none; font-weight: 700; color: var(--ink2); padding: 6px 0; min-height: 36px; }

.tag { display: inline-block; border-radius: var(--radius-pill); padding: 1px 9px; font-size: 0.76rem; font-weight: 700; background: var(--blue-100); color: var(--blue); }
.tag.demo { background: #e8e3f6; color: #4a2f8a; margin-left: 6px; }
.tag.env, .tag.ok { background: var(--ok-bg); color: var(--ok-ink); }
.tag.warn { background: var(--warn-bg); color: var(--warn-ink); }

table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
caption { text-align: left; font-weight: 700; padding: 0 0 8px; font-family: var(--font-display); font-size: 1.05rem; }
th, td { text-align: left; padding: 10px; border-top: 1px solid var(--line); vertical-align: middle; }
th { font-size: 0.76rem; color: var(--ink2); font-weight: 700; }
thead th { border-top: 0; }
tbody tr:hover { background: var(--gray); }
tr.demo td:first-child { box-shadow: inset 3px 0 0 #8a63d2; }
td small { display: block; color: var(--ink2); font-size: 0.8rem; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--brand); margin-top: 4px; }
.pager { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; font-size: 0.86rem; color: var(--ink2); }
.log { margin-top: 16px; }
.log summary { cursor: pointer; font-weight: 700; }
.log table { margin-top: 10px; }

.banner { border-radius: var(--radius-md); padding: 10px 14px; margin-bottom: 12px; font-size: 0.9rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner.info { background: var(--blue-100); }
.banner.ok { background: var(--ok-bg); color: var(--ok-ink); }
.banner.err { background: var(--pain-bg); color: var(--pain-ink); }
.banner.demo { background: #efeafb; color: #3d2778; }
.sk { height: 14px; border-radius: var(--radius-xs); background: linear-gradient(90deg, #eceef2, #f6f7f9, #eceef2); margin: 8px 0; }
.sk.short { width: 70%; }
.empty { text-align: center; padding: 36px 16px; color: var(--ink2); }
.empty h3 { color: var(--ink); font-size: 1.1rem; margin-bottom: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.lnk { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px 14px; background: var(--bg); font-weight: 600; min-height: 48px; color: var(--ink); text-decoration: none; }
a.lnk:hover { background: var(--gray); }
.lnk small { font-weight: 500; color: var(--ink2); }
.two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; align-items: start; }
.ios-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.ios-form label { font-weight: 700; font-size: 0.86rem; }

.scrim { position: fixed; inset: 0; background: rgba(31, 34, 40, 0.28); z-index: 10; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: 100%; background: var(--bg); border-left: 1px solid var(--line); box-shadow: var(--pop); padding: 20px; z-index: 11; overflow-y: auto; }
.drawer-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.drawer h3 { font-size: 1.2rem; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 0.82rem; font-weight: 700; margin-bottom: 4px; }
.field .inp { width: 100%; }
.actions { display: flex; gap: 10px; margin-top: 4px; margin-bottom: 12px; }

/* Bajo 900 px, las tablas pasan a filas apiladas con la etiqueta de cada celda. */
@media (max-width: 900px) {
  .app-h { padding: 12px 16px; }
  .who { display: none; }
  .pg { padding: 16px 16px 40px; }
  .pg h1 { font-size: 1.6rem; }
  .two { display: block; }
  .two > * { margin-bottom: 16px; }
  table, thead, tbody { display: block; }
  thead { display: none; }
  tbody tr { display: block; border-top: 1px solid var(--line); padding: 10px 0; }
  td { display: flex; justify-content: space-between; gap: 12px; border: 0; padding: 3px 0; }
  td[data-l]::before { content: attr(data-l); font-size: 0.76rem; font-weight: 700; color: var(--ink2); }
  .num { text-align: left; }
  td:empty { display: none; }
}

/* Solo para la maqueta */
body{padding:24px 16px}
h2.sec{font-size:1rem;margin:28px 0 10px}
.win{border:1px solid var(--line);border-radius:6px;background:var(--page);overflow:hidden;max-width:1180px}
.win .pg{padding:18px 24px 24px}
.ph{width:390px;max-width:100%;border:8px solid var(--ink);border-radius:30px;overflow:hidden;background:var(--page)}
.ph .pg{padding:14px 12px 18px}
.ph table,.ph thead,.ph tbody{display:block}.ph thead{display:none}
.ph tbody tr{display:block;border-top:1px solid var(--line);padding:10px 0}
.ph td{display:block;border:0;padding:3px 0;width:auto}.ph .app-h .who{display:none}
.ph .app-h{padding:12px 10px;gap:6px}.ph .app-h .btn{padding:4px 8px;font-size:.8rem}.ph .cap{margin-left:0}
/* Pestaña Invitaciones (nuevo) */
.cap{margin-left:auto;font-size:.88rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.cap b{color:var(--ink)}
.tag.err{background:var(--pain-bg);color:var(--pain-ink)}
.tag.muted{background:var(--gray);color:var(--ink2)}
.inv td{vertical-align:top}
.inv .msg{margin:4px 0 0;color:var(--ink2);font-size:.84rem;max-width:52ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.inv .msg.open{display:block}
.inv .more{border:0;background:none;padding:4px 0;font-size:.8rem;font-weight:600;color:var(--blue);text-decoration:underline}
.inv .act{width:230px}
.confirm{display:flex;flex-wrap:wrap;gap:6px;font-size:.84rem}
.confirm span{flex-basis:100%;font-weight:600}
.inv tbody tr:hover{background:none}
@media(max-width:900px){.inv td{display:block}.inv .act{width:auto}.cap{margin-left:0}}
</style>
<h2 class="sec">Pruébalo: quedan 2 cupos hoy. Los datos son ficticios y no se envía nada.</h2><div class="win" id="live"></div>
<div id="stills"></div>
<script>
const CAP=15;
const ROWS=[
 {m:'camila.rojas@ejemplo.com',d:'26 nov',s:'pend',t:'Hola, soy preparadora física de un club de vóleibol. Tengo dos equipos y hoy armo todo en planillas. Me gustaría probar Cycles.'},
 {m:'diego.fuentes@ejemplo.com',d:'26 nov',s:'pend',n:2,t:'Entreno personas 1 a 1 en un gimnasio y también online. Quiero acceso para ordenar sus ciclos.'},
 {m:'ventas@ejemplo.net',d:'25 nov',s:'pend',t:'Ofrecemos servicios de posicionamiento para su sitio web. ¿Podemos agendar una llamada esta semana?'},
 {m:'paula.soto@ejemplo.com',d:'12 nov',s:'pend',old:true,t:'Me interesa saber cuándo van a abrir. Hago clases de funcional a grupos.'},
 {m:'jorge.mella@ejemplo.com',d:'24 nov',s:'fail',t:'Soy coach de handball y quiero sumar a mi equipo juvenil.'},
 {m:'andrea.vidal@ejemplo.com',d:'23 nov',s:'sent',w:'Enviada el 26 nov',x:'Vence el 3 dic',t:'Trabajo con corredores, casi todo online.'},
 {m:'matias.leon@ejemplo.com',d:'20 nov',s:'used',w:'Cuenta creada el 22 nov',t:'Tengo un grupo de halterofilia y quiero probar la plataforma.'},
 {m:'sofia.paz@ejemplo.com',d:'14 nov',s:'exp',w:'Venció el 24 nov',t:'Hago preparación física en una academia de tenis.'},
 {m:'rodrigo.araya@ejemplo.com',d:'19 nov',s:'acc',t:'Quiero acceso anticipado, entreno en cancha.'}
];
const TAB={pend:r=>r.s==='pend'||r.s==='fail',queue:r=>r.s==='queue',done:r=>['sent','used','exp'].includes(r.s),all:()=>true};
const NAMES={pend:'Por enviar',queue:'En cola',done:'Invitadas',all:'Todas'};
const clone=()=>ROWS.map(r=>({...r}));
function stateCell(r0,off){
 const r=off&&r0.s==='queue'?{...r0,w:'En espera hasta que se active el envío.'}:r0;
 const T={pend:['muted','Sin invitar'],queue:['warn','En cola'],sending:['muted','Enviando'],sent:['ok','Enviada'],used:['ok','Cuenta creada'],exp:['warn','Vencida'],fail:['err','Error de envío'],acc:['muted','Ya tenía cuenta']}[r.s];
 const extra={queue:r.w,sent:r.w+'<br>'+r.x,used:'El '+String(r.w).split(' el ')[1],exp:r.w,fail:'No salió el correo.'}[r.s]||(r.old?'Escribió antes del aviso nuevo.':'');
 return `<span class="tag ${T[0]}">${T[1]}</span>${extra?`<small>${extra}</small>`:''}`;
}
function actCell(r,i,sv){
 const full=sv.sent>=CAP&&!sv.off,dis=sv.off?' disabled aria-describedby="off"':'';
 if(sv.confirm===i)return `<div class="confirm"><span>${full?'¿Poner en la cola? Sale sola cuando haya cupo.':r.s==='exp'?'¿Enviar un enlace nuevo? El anterior deja de servir.':'¿Enviar la invitación a este correo?'}</span><button class="btn p sm" data-a="yes" data-i="${i}">${full?'Sí, poner en cola':'Sí, enviar'}</button><button class="btn sm" data-a="no">Cancelar</button></div>`;
 if(r.s==='pend')return `<button class="btn p sm" data-a="ask" data-i="${i}"${dis}>${full?'Poner en cola':'Enviar invitación'}</button>`;
 if(r.s==='fail')return `<button class="btn sm" data-a="ask" data-i="${i}"${dis}>${full?'Poner en cola':'Reintentar'}</button>`;
 if(r.s==='exp')return `<button class="btn sm" data-a="ask" data-i="${i}"${dis}>${full?'Poner en cola':'Enviar de nuevo'}</button>`;
 if(r.s==='queue')return `<button class="btn sm" data-a="out" data-i="${i}">Quitar de la cola</button>`;
 if(r.s==='sending')return '<button class="btn sm" disabled>Enviando…</button>';
 return '';
}
function view(sv){
 const list=sv.rows.map((r,i)=>[r,i]).filter(([r])=>TAB[sv.tab](r));
 const empty={pend:['No hay solicitudes por enviar','Cuando alguien escriba desde getcycles.app, aparecerá aquí.'],queue:['No hay nada en cola',`La cola se usa cuando ya salieron las ${CAP} invitaciones del día.`],done:['Aún no hay invitaciones',''],all:['Aún no hay solicitudes','']}[sv.tab];
 return `<div class="app-h"><b>Cycles</b><span class="tag">Equipo</span><span class="tag env">Producción</span><span class="spacer"></span><span class="who">Sesión de equipo@ejemplo.com</span><span class="btn sm">Cerrar sesión</span></div>
 <div class="pg"><h1>Administración</h1>
 <div class="tabs">${['Usuarios','Invitaciones','Uso','Correos','Enlaces y versiones'].map(x=>`<button type="button" aria-selected="${x==='Invitaciones'}">${x}</button>`).join('')}</div>
 <div class="tools"><div class="seg" role="group" aria-label="Estado">${Object.keys(NAMES).map(k=>`<button type="button" data-a="tab" data-i="${k}" aria-pressed="${sv.tab===k}">${NAMES[k]} ${sv.rows.filter(TAB[k]).length}</button>`).join('')}</div><span class="cap">Hoy salieron <b>${sv.sent} de ${CAP}</b></span></div>
 ${sv.off?'<div class="banner info" id="off" role="status">El envío de invitaciones todavía no está activado. Puedes revisar las solicitudes; no sale ninguna invitación.</div>':''}
 ${sv.err?`<div class="banner err" role="alert">${sv.err}</div>`:''}
 ${sv.sent>=CAP&&!sv.off?`<div class="banner info" role="status">Ya salieron las ${CAP} invitaciones de hoy. Lo que agregues queda en cola y se envía solo en los días siguientes.</div>`:''}
 ${sv.note?`<div class="banner ok" role="status">${sv.note}</div>`:''}
 ${list.length?`<div class="card"><table class="inv"><thead><tr><th>Solicitud</th><th>Escribió</th><th>Estado</th><th><span class="sr">Acciones</span></th></tr></thead><tbody>${list.map(([r,i])=>`<tr><td><b>${r.m}</b><p class="msg${sv.open===i?' open':''}">${r.t}</p>${r.t.length>100?`<button class="more" data-a="more" data-i="${i}">${sv.open===i?'Ver menos':'Ver todo'}</button>`:''}${r.n?`<small>Escribió ${r.n} veces. Se muestra el último mensaje.</small>`:''}</td><td data-l="Escribió">${r.d}</td><td data-l="Estado">${stateCell(r,sv.off)}</td><td class="act">${actCell(r,i,sv)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="card empty"><h3>${empty[0]}</h3>${empty[1]}</div>`}
 </div>`;
}
const S=o=>Object.assign({rows:clone(),tab:'pend',sent:12,confirm:null,open:null,note:''},o);
function still(id,cap,sv,phone){return `<h2 class="sec">${cap}</h2><div class="${phone?'ph':'win'}" id="${id}">${view(sv)}</div>`}
const queued=clone();queued[0]={...queued[0],s:'queue',w:'Sale desde mañana, 27 nov'};queued[1]={...queued[1],s:'queue',w:'Sale desde mañana, 27 nov'};
document.getElementById('stills').innerHTML=[
 still('lista','Por enviar',S({})),
 still('confirmar','Un clic y una confirmación',S({confirm:0})),
 still('tope','Ya salieron las 15 de hoy',S({sent:15})),
 still('cola','En cola',S({rows:queued,sent:15,tab:'queue'})),
 still('invitadas','Invitadas',S({tab:'done'})),
 still('reenviar','Enviar de nuevo una vencida',S({tab:'done',confirm:7})),
 still('vacio','Sin solicitudes',S({rows:[]})),
 still('apagado','Envío sin activar',S({off:true,sent:0})),
 still('apagado-cola','Envío sin activar, con algo en cola',S({rows:queued,off:true,sent:0,tab:'queue'})),
 still('apagado-rechazo','Si se apagó con la página ya abierta',S({off:true,sent:0,err:'El envío de invitaciones todavía no está activado.'})),
 still('tel','En el teléfono',S({}),true)
].join('');
const live=document.getElementById('live');let sv=S({sent:13});
const paint=()=>{live.innerHTML=view(sv)};
live.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=a==='tab'?b.dataset.i:Number(b.dataset.i);
 if(a==='tab'){sv.tab=i;sv.confirm=null;sv.note=''}
 else if(a==='more')sv.open=sv.open===i?null:i;
 else if(a==='ask'){sv.confirm=i;sv.note=''}
 else if(a==='no')sv.confirm=null;
 else if(a==='out'){const q=sv.rows[i];q.s=q.prev||'pend';q.w=q.pw;sv.note='Quitada de la cola.'}
 else if(a==='yes'){sv.confirm=null;const r=sv.rows[i];
  if(sv.sent>=CAP){r.prev=r.s;r.pw=r.w;r.s='queue';r.w='Sale desde mañana, 27 nov';sv.note=`${r.m} quedó en cola.`}
  else{r.s='sending';paint();setTimeout(()=>{r.s='sent';r.w='Enviada el 26 nov';r.x='Vence el 3 dic';sv.sent++;sv.note=`Invitación enviada a ${r.m}.`;paint()},900);return}}
 paint();
});
paint();
</script>
