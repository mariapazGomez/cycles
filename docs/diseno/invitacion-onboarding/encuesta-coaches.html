.scr::after{content:"";position:absolute;inset:0;background:rgba(31,34,40,.30)}
.card{position:relative;z-index:1;width:100%;max-width:648px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 12px 40px rgba(31,34,40,.28)}
/* Escenario: el perfil que se va armando con las respuestas */
.stage{background:#eef1f6;border-bottom:1px solid var(--line);padding:16px 24px;min-height:188px;display:flex;align-items:center;justify-content:center}
.stage.brand{min-height:96px}.stage img{width:140px}
.prof{width:100%;max-width:560px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 16px 4px}
.prof h4{font:600 13px/1 Inter;margin-bottom:6px}
.pg{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}
.pr{border-top:1px solid var(--line);padding:7px 0 8px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;align-items:start;min-height:42px}
.pr b{font:500 12px/22px Inter;color:var(--ink2)}
.pr div{display:flex;flex-wrap:wrap;gap:4px}
.tag{font:500 12px/1 Inter;background:var(--tint);color:#134fb0;border-radius:4px;padding:5px 7px}
.tag.new{animation:in .35s ease both}
.pr.cur{box-shadow:inset 0 -2px 0 var(--brand)}
.hole{width:48px;height:8px;margin-top:7px;border-radius:2px;background:#e4e8ef}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* Avance */
.prog{display:flex;align-items:center;gap:12px;padding:14px 28px 0}
.track{flex:1;height:6px;border-radius:3px;background:#e4e8ef;overflow:hidden}
.track i{display:block;height:100%;background:var(--blue);transition:width .5s ease}
.prog b{font:600 13px/1 Inter;min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.body{padding:16px 28px 4px}
.body h3{font:700 22px/1.25 Inter;margin-bottom:14px;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.one{grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:10px;min-height:44px;padding:9px 12px;border:1px solid #c3c9d4;border-radius:6px;background:#fff;font:500 14px/1.3 Inter;color:var(--ink);text-align:left;cursor:pointer;width:100%}
.opt i{flex:none;width:16px;height:16px;border:1.5px solid var(--ctl);border-radius:3px;display:grid;place-items:center}
.opt.rad i{border-radius:50%}
.opt.on{border-color:var(--blue);background:var(--tint)}
.opt.on i{border-color:var(--blue);background:var(--blue)}
.opt.on i::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.opt.rad.on i::after{width:6px;height:6px;border:0;border-radius:50%;background:#fff;transform:none}
.opt[disabled]{opacity:.45;cursor:default}
.opt{transition:background-color .18s ease,border-color .18s ease,opacity .18s ease}
.emo{font-style:normal;font-size:18px;line-height:1;display:inline-block}
.tag em{font-style:normal}
.slot{min-width:0}
.pr:last-child{grid-column:1/-1}
.done h3,.done p{animation:in .45s ease .25s both}
.txt{width:100%;height:42px;border:1px solid var(--ctl);border-radius:6px;padding:0 12px;font:400 14px/1 Inter;margin-top:8px}
.sports{display:flex;flex-wrap:wrap;gap:8px;max-height:176px;overflow-y:auto;margin-top:10px;padding:2px}
.sports .opt{width:auto;min-height:40px}
.none{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 28px 22px}
.back{min-height:42px;padding:0 18px;border:1px solid var(--ctl);border-radius:6px;background:#fff;font:600 14px/1 Inter;color:var(--ink);cursor:pointer}
.next{min-height:42px;padding:0 22px;border:0;border-radius:6px;background:var(--blue);color:#fff;font:600 14px/1 Inter;margin-left:auto;cursor:pointer}
.next[disabled]{opacity:.45;cursor:default}
.next.full{width:100%;margin:0}
/* Paso de la cuenta */
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.role{border:1px solid #c3c9d4;border-radius:6px;padding:10px 12px;text-align:left;background:#fff;cursor:pointer;font-family:Inter;color:var(--ink)}
.role b{display:block;font:600 14px/1.3 Inter}.role small{font:400 12px/1.4 Inter;color:var(--ink2)}
.role.on{border:2px solid var(--blue);padding:9px 11px;background:var(--tint)}
.f{display:grid;gap:5px;margin-bottom:10px}.f b{font:600 13px/1.2 Inter}
.f span{height:40px;border:1px solid var(--ctl);border-radius:6px;display:flex;align-items:center;padding:0 12px;font:400 14px/1 Inter}
.f span.lock{background:#f6f7f9;color:var(--ink2);border-color:var(--line)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;font:400 13px/1.45 Inter;margin-bottom:8px}.chk i{flex:none;width:15px;height:15px;border:1px solid var(--ctl);border-radius:3px;margin-top:2px}
.use{font:400 13px/1.5 Inter;color:#3f4757;margin-top:12px}
.done p{font:400 15px/1.55 Inter;margin-bottom:6px}
/* Teléfono */
.ph{border:8px solid var(--ink);border-radius:30px;overflow:hidden}
.ph .scr{padding:10px;border-radius:0}
.ph .stage,.sm .stage{padding:10px;min-height:0}
.ph .stage.brand{padding:18px}
.ph .pg,.sm .pg{grid-template-columns:1fr}
.ph .pr,.sm .pr{min-height:0;padding:4px 0}
.ph .pr:not(.has):not(.cur),.sm .pr:not(.has):not(.cur){display:none}
.ph .opts,.sm .opts,.ph .f2,.sm .f2{grid-template-columns:1fr}
.ph .body,.sm .body{padding:14px 16px 2px}.ph .prog,.sm .prog{padding:12px 16px 0}.ph .foot,.sm .foot{padding:14px 16px 18px}
.ph .body h3,.sm .body h3{font-size:19px}
@media(max-width:600px){.scr{padding:10px}.stage{padding:10px;min-height:0}.pg{grid-template-columns:1fr}.pr{min-height:0;padding:4px 0}.pr:not(.has):not(.cur){display:none}.opts,.f2{grid-template-columns:1fr}.body{padding:14px 16px 2px}.prog{padding:12px 16px 0}.foot{padding:14px 16px 18px}}
@media(prefers-reduced-motion:reduce){.tag.new,.done h3,.done p{animation:none}.track i,.opt{transition:none}}

.scr.over{align-items:center;min-height:600px}
.scr.over::before{display:none}
.scr.over::after{background:rgba(31,34,40,.34)}
.appbg{position:absolute;inset:0;background:#f3f5f8;filter:blur(4px)}
.appbg .hd{display:flex;align-items:center;gap:22px;height:56px;background:#fff;border-bottom:1px solid var(--line);padding:0 24px;font:500 14px/1 Inter;color:var(--ink2);white-space:nowrap;overflow:hidden}
.appbg .hd img{width:92px}
.appbg .blk{height:120px;margin:20px 24px 0;background:#fff;border:1px solid var(--line);border-radius:10px}
.appbg .blk.w{height:180px}
.lead{font:400 15px/1.55 Inter}

const pct=s=>s>Q.length?100:Math.max(0,Math.round((s-1)/Q.length*100));

function profile(ans,cur,fresh){
 const rows=Q.map((q,i)=>{const v=ans[q.k]||[];const show=v.slice(0,v.length>3?2:3).map(x=>`<span class="tag${fresh===x?' new':''}">${q.emoji&&q.emoji[x]?`<em aria-hidden="true">${q.emoji[x]}</em> `:''}${(q.short&&q.short[x])||(x===q.none?'Sin deporte específico':x)}</span>`).join('')+(v.length>3?`<span class="tag">+${v.length-2}</span>`:'');
  return `<div class="pr${v.length?' has':''}${cur===i+1?' cur':''}"><b>${q.lab}</b><div>${show||'<span class="hole"></span>'}</div></div>`}).join('');
 return `<div class="stage"><div class="prof"><h4>Tu perfil de coach</h4><div class="pg">${rows}</div></div></div>`;
}
const bar=p=>`<div class="prog"><div class="track" role="progressbar" aria-label="Avance de las preguntas" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><i style="width:${p}%"></i></div><b>${p} %</b></div>`;
function opt(q,o,ans,label){
 const v=ans[q.k]||[],on=v.includes(o),full=q.max&&v.length>=q.max&&!on;
 return `<button type="button" class="opt${q.type==='one'?' rad':''}${on?' on':''}" data-o="${o}" aria-pressed="${on}"${full?' disabled':''}><i></i>${q.emoji&&q.emoji[o]?`<em class="emo" aria-hidden="true">${q.emoji[o]}</em>`:''}<span>${label||o}</span></button>`;
}
function question(s,ans,extra,fresh){
 const q=Q[s-1],v=ans[q.k]||[];let body;
 if(q.type==='sports'){
  const f=(extra.search||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const list=q.o.filter(o=>o.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(f));
  body=`<input class="txt s" style="margin:0" placeholder="Busca un deporte" aria-label="Busca un deporte" value="${extra.search||''}"><div class="sports">${list.map(o=>opt(q,o,ans)).join('')}${opt(q,q.other,ans)}</div>${v.includes(q.other)?`<input class="txt" maxlength="60" placeholder="${q.ph}" aria-label="${q.ph}">`:''}<div class="none">${opt(q,q.none,ans)}</div>`;
 }else{
  body=`<div class="opts">${q.o.map(o=>opt(q,o,ans)).join('')}</div>${q.other&&v.includes(q.other)?`<input class="txt" maxlength="60" placeholder="${q.ph}" aria-label="${q.ph}">`:''}`;
 }
 const use=false?'<p class="use">Con estas respuestas adaptamos Cycles a tu forma de entrenar, te ofrecemos lo que te sirva y preparamos mejor nuestras conversaciones contigo.</p>':'';
 return `${profile(ans,s,fresh)}${bar(pct(s))}<div class="body"><h3>${q.t}</h3>${body}${use}</div><div class="foot"><button type="button" class="back">Atrás</button><button type="button" class="next"${v.length?'':' disabled'}>${s===Q.length?'Terminar':'Siguiente'}</button></div>${links}`;
}

const view=(s,ans,extra,fresh)=>s===0?intro():s>Q.length?done(ans):question(s,ans,extra,fresh);
/* Cada paso se parte en escenario, barra y contenido: así la barra permanece y solo cambia lo demás */
function parts(s,ans,extra,fresh){
 const t=document.createElement('template');t.innerHTML=view(s,ans,extra,fresh).trim();
 const all=[...t.content.children];
 return {stage:all[0].outerHTML,p:Number(all[1].querySelector('[role=progressbar]').getAttribute('aria-valuenow')),rest:all.slice(2).map(e=>e.outerHTML).join('')};
}

function still(id,cap,s,w,phone,err){
 let h=view(s,upto(s),{});
 if(err)h=h.replace('<div class="foot">','<div class="err" role="alert">No pudimos guardar tu respuesta. Revisa tu conexión y toca «Siguiente» otra vez.</div><div class="foot">');
 const inner=wrap(`<div class="card">${h}</div>`);
 return `<figure class="fr" id="${id}" style="width:${w}px"><figcaption>${cap}</figcaption>${phone?`<div class="ph">${inner}</div>`:inner}</figure>`;
}

const stg=host.querySelector('.stg'),slot=host.querySelector('.slot'),fill=host.querySelector('.track i'),num=host.querySelector('.prog b'),track=host.querySelector('.track');
const calm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
let shown=0;
function setBar(p){
 fill.style.width=p+'%';track.setAttribute('aria-valuenow',p);
 const from=shown;shown=p;
 if(calm()||from===p){num.textContent=p+' %';return}
 const t0=performance.now();
 (function tick(t){const k=Math.min(1,Math.max(0,(t-t0)/600));num.textContent=Math.round(from+(p-from)*k)+' %';if(k<1&&shown===p)requestAnimationFrame(tick)})(t0);
}

 stg.innerHTML=v.stage;slot.innerHTML=v.rest;setBar(v.p);
 const now=host.querySelector('.sports');if(now)now.scrollTop=top;
 if(st>Q.length)slot.querySelector('.next').textContent='Volver a empezar';
}
/* Cambio de paso: sale la pregunta, avanza la barra, la tarjeta acomoda su alto y entra la siguiente */
async function go(to,dir){
 if(busy)return;
 if(calm()){st=to;extra.search='';paint();return}
 busy=true;
 const wasBrand=!!stg.querySelector('.brand');
 await slot.animate([{opacity:1,transform:'translateX(0)'},{opacity:0,transform:`translateX(${-40*dir}px)`}],{duration:190,easing:'ease-in',fill:'forwards'}).finished;
 const h0=host.offsetHeight;
 st=to;extra.search='';paint();
 slot.getAnimations().forEach(a=>a.cancel());
 const h1=host.offsetHeight;
 host.animate([{height:h0+'px'},{height:h1+'px'}],{duration:320,easing:'cubic-bezier(.2,.8,.2,1)'});
 slot.querySelectorAll('.opt,.role').forEach((el,i)=>el.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}],{duration:260,delay:120+Math.min(i,14)*28,easing:'ease-out',fill:'backwards'}));
 if(wasBrand!==!!stg.querySelector('.brand'))stg.animate([{opacity:0},{opacity:1}],{duration:380});
 if(st>Q.length)stg.querySelectorAll('.pr .tag').forEach((el,i)=>el.animate([{opacity:0,transform:'scale(.8)'},{opacity:1,transform:'scale(1.08)',offset:.7},{opacity:1,transform:'scale(1)'}],{duration:380,delay:200+i*70,fill:'backwards'}));
 await slot.animate([{opacity:0,transform:`translateX(${40*dir}px)`},{opacity:1,transform:'translateX(0)'}],{duration:300,easing:'cubic-bezier(.2,.8,.2,1)'}).finished;
 busy=false;
}

host.addEventListener('click',e=>{
 if(busy)return;
 const o=e.target.closest('.opt');
 if(o&&!o.disabled){const q=Q[st-1],x=o.dataset.o;let v=ans[q.k]||[];
  if(q.type==='one')v=[x];
  else if(v.includes(x))v=v.filter(y=>y!==x);
  else{const ex=q.none||q.excl;v=x===ex?[x]:v.filter(y=>y!==ex).concat(x)}
  ans[q.k]=v;paint(v.includes(x)?x:null);
  if(v.includes(x)&&!calm()){const b=slot.querySelector(`.opt[data-o="${x}"]`);if(b){b.animate([{transform:'scale(1)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],{duration:240});const m=b.querySelector('.emo');if(m)m.animate([{transform:'scale(1) rotate(0)'},{transform:'scale(1.5) rotate(-12deg)',offset:.45},{transform:'scale(1) rotate(0)'}],{duration:420})}}
  return}
 if(e.target.closest('.back')){go(st-1,-1);return}
 const n=e.target.closest('.next');
 if(n&&!n.disabled){if(st>Q.length){ans={};go(0,-1)}else go(st+1,1)}
});
host.addEventListener('input',e=>{if(e.target.classList.contains('s')){extra.search=e.target.value;paint();const i=host.querySelector('.s');i.focus();i.setSelectionRange(i.value.length,i.value.length)}});
paint();
</script>
