<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biblioteca Cycles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
<style>
/* Concepto: la Biblioteca reúne el material reutilizable del coach (rutinas y ciclos) en una sola lista con filtros. Rutina y ciclo se distinguen de un vistazo por un ícono propio y un color propio: rutina = mancuerna sobre azul pálido; ciclo = anillo (el isotipo) sobre tinta oscura. El calendario del ciclo ofrece un «+» visible en cada día. Mismo lenguaje de elevación que ciclo-en-calendario (tres niveles de sombra, sin gradientes). Solo modo claro. Espaciado en escala de 4 px. */
:root{
  --font-display:"Bricolage Grotesque","Inter",system-ui,sans-serif; --font-body:"Inter",system-ui,sans-serif;
  --brand:#3080fc; --blue:#1a66dd; --blue-hover:#155ccc; --b50:#f3f8ff; --b100:#eaf2ff; --b200:#d6e4ff; --b700:#1450b0;
  --bg:#ffffff; --ink:#1f2228; --ink2:#5c6068; --gray:#f6f7f9; --line:#dfe2e7; --ctl:#8a8f98; --page:#eceff4;
  --ok-bg:#e9f5ec; --ok-ink:#1e6b32; --warn-bg:#fff1e3; --warn-ink:#9a4a00; --pain-bg:#fdecec; --pain-ink:#a3282c;
  --e1:0 0 0 1px rgba(31,34,40,.06),0 1px 2px rgba(31,34,40,.06),0 3px 8px -2px rgba(31,34,40,.08);
  --e2:0 0 0 1px rgba(31,34,40,.06),0 2px 4px rgba(31,34,40,.06),0 12px 24px -8px rgba(31,34,40,.18);
  --e3:0 0 0 1px rgba(31,34,40,.07),0 4px 8px rgba(31,34,40,.08),0 20px 40px -12px rgba(31,34,40,.30);
  --sk:#dde2ea; color-scheme:light; --hdr:56px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
button,a,select,input{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1{margin:0;font-family:var(--font-display);font-size:1.9rem;line-height:1.1;font-weight:700;letter-spacing:-.01em}
h2{margin:0;font-size:1.02rem;font-weight:700;line-height:1.3}
.sp{flex:1}

/* Barra de la maqueta (no es parte del producto) */
.mock{position:sticky;top:0;z-index:30;background:#14171c;color:#fff;padding:8px 16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:.8rem}
.mock .g{display:flex;align-items:center;gap:8px}.mock label{color:#aab2c0}
.mock .seg{display:inline-flex;border-radius:999px;padding:3px;background:#262b33}
.mock .seg button{border:0;background:transparent;color:#cfd6e4;border-radius:999px;padding:4px 12px;font-size:.78rem;font-weight:600;cursor:pointer}
.mock .seg button[aria-pressed=true]{background:#fff;color:var(--ink)}

/* Encabezado del producto */
.hdr{background:var(--bg);height:var(--hdr);box-shadow:0 1px 0 rgba(31,34,40,.08),0 4px 12px -6px rgba(31,34,40,.12)}
.hdr-in{max-width:1320px;height:100%;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:32px}
.logo{font-family:var(--font-display);font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:8px}
.logo svg{width:24px;height:24px;color:var(--brand)}
.nav{display:flex;gap:20px;flex:1;height:100%}
.nav a{display:flex;align-items:center;font-size:.92rem;font-weight:600;color:var(--ink2);text-decoration:none;border-bottom:2px solid transparent;padding-top:2px}
.nav a.on{color:var(--ink);border-bottom-color:var(--brand)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 2px #fff,0 1px 3px rgba(31,34,40,.25)}
.avatar.sm{width:28px;height:28px;font-size:.68rem}

/* Marco: escritorio o celular */
.frame{margin:0 auto;max-width:1320px;background:var(--page)}
.frame.cel{max-width:390px;box-shadow:var(--e3);border-radius:24px;overflow:hidden;margin-top:16px;margin-bottom:16px}
main{padding:20px 24px 64px}
.frame.cel main{padding:16px 16px 48px}
.frame.cel .hdr-in{padding:0 16px;gap:12px}.frame.cel .nav{gap:12px}.frame.cel .nav a{font-size:.82rem}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;min-height:40px}
.btn{height:36px;padding:0 16px;border-radius:999px;border:0;background:var(--bg);box-shadow:var(--e1);font-size:.88rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:box-shadow 150ms ease,transform 150ms ease,background-color 120ms ease}
.btn:hover{box-shadow:var(--e2);transform:translateY(-1px)}.btn:active{transform:none;box-shadow:var(--e1)}
.btn.p{background:var(--blue);color:#fff}.btn.p:hover{background:var(--blue-hover)}
.btn svg{width:16px;height:16px}
.link{font-size:.88rem;font-weight:600;color:var(--blue);background:none;border:0;cursor:pointer;padding:0}.link:hover{text-decoration:underline}
.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:.76rem;font-weight:700;background:var(--bg);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.pill.blue{background:var(--b100);color:var(--blue);box-shadow:none}.pill.ok{background:var(--ok-bg);color:var(--ok-ink);box-shadow:none}.pill.dark{background:var(--ink);color:#fff;box-shadow:none}.pill.warn{background:var(--warn-bg);color:var(--warn-ink);box-shadow:none}

/* Menú desplegable de Crear */
.menu{position:relative}
.menu-list{position:absolute;right:0;top:44px;z-index:10;min-width:220px;background:var(--bg);border-radius:14px;box-shadow:var(--e3);padding:6px;display:none}
.menu.open .menu-list{display:block}
.menu-list button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;border-radius:10px;padding:8px 10px;font-size:.9rem;font-weight:600;cursor:pointer}
.menu-list button:hover{background:var(--gray)}

/* Íconos de tipo */
.tic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.tic svg{width:22px;height:22px}
.tic.rt{background:var(--b100);color:var(--blue)}
.tic.cy{background:var(--ink);color:#fff}
.tic.sm{width:28px;height:28px;border-radius:8px}.tic.sm svg{width:16px;height:16px}

/* Filtros y buscador */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.chip{border:0;border-radius:999px;padding:5px 14px;font-size:.84rem;font-weight:700;background:var(--bg);color:var(--ink2);box-shadow:var(--e1);cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:box-shadow 150ms ease,background-color 120ms ease}
.chip:hover{box-shadow:var(--e2)}.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.chip em{font-style:normal;font-size:.76rem;background:var(--gray);color:var(--ink2);border-radius:999px;padding:0 7px}
.chip[aria-pressed=true] em{background:#3a404b;color:#fff}
.chip svg{width:16px;height:16px}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:999px;padding:0 14px;height:36px;box-shadow:var(--e1);min-width:220px;flex:1;max-width:340px}
.search svg{width:16px;height:16px;color:var(--ctl)}.search input{border:0;outline:0;background:none;flex:1;font-size:.9rem;min-width:0}
.frame.cel .search{max-width:none;flex-basis:100%}

/* Variante A: lista de filas */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:16px;background:var(--bg);border-radius:16px;padding:12px 16px;box-shadow:var(--e1);transition:box-shadow 150ms ease,transform 150ms ease;cursor:pointer}
.row:hover{box-shadow:var(--e2);transform:translateY(-1px)}
.row .nm{flex:1;min-width:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row .nm h2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acts{display:flex;gap:4px;align-items:center}
.ghost{height:32px;padding:0 12px;border:0;border-radius:999px;background:transparent;font-size:.84rem;font-weight:600;color:var(--ink2);cursor:pointer}.ghost:hover{background:var(--gray);color:var(--ink)}
.frame.cel .row{flex-wrap:wrap;gap:8px 12px}.frame.cel .row .acts{width:100%;justify-content:flex-end}

/* Variante B: tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--bg);border-radius:18px;padding:16px;box-shadow:var(--e1);display:flex;flex-direction:column;gap:12px;transition:box-shadow 150ms ease,transform 150ms ease;cursor:pointer;min-height:168px}
.card:hover{box-shadow:var(--e2);transform:translateY(-2px)}
.card .top{display:flex;align-items:center;gap:12px}
.card .top .sp{flex:1}
.card h2{font-size:1.05rem}
.card .foot{margin-top:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Vacío, error y carga */
.empty{background:var(--bg);border-radius:18px;box-shadow:var(--e1);padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .tic{width:56px;height:56px;border-radius:16px}.empty .tic svg{width:30px;height:30px}
.empty p{margin:0;max-width:420px;color:var(--ink2)}
.err{background:var(--pain-bg);color:var(--pain-ink);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--e1)}
.err span{flex:1}
.sk{background:var(--sk);border-radius:8px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sh 1.3s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.sk::after{animation:none}}
.skrow{display:flex;align-items:center;gap:16px;background:var(--bg);border-radius:16px;padding:12px 16px;box-shadow:var(--e1)}

/* Calendario del ciclo */
.crumb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.back{font-size:.9rem;color:var(--ink2);text-decoration:none}
.who{display:inline-flex;align-items:center;gap:8px;font-size:.92rem;font-weight:600}
.gh,.wr{display:grid;grid-template-columns:112px repeat(7,minmax(0,1fr)) 132px;gap:8px;padding:0 16px}
.gh{padding-top:8px;padding-bottom:8px;font-size:.8rem;font-weight:600;color:var(--ink2)}.gh span{padding:0 4px}.gh .today{color:var(--blue)}
.weeks{display:flex;flex-direction:column;gap:8px}
.wr{padding-top:12px;padding-bottom:12px;align-items:stretch;background:var(--bg);border-radius:16px;box-shadow:var(--e1)}
.wr.cur{box-shadow:0 0 0 2px var(--brand),var(--e2)}
.wl{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:6px 8px;font-size:.88rem}
.wl b{font-size:.95rem}
.ws{display:flex;flex-direction:column;justify-content:center;gap:4px;padding-left:4px;font-size:.82rem;font-variant-numeric:tabular-nums}
.ws b{font-size:.95rem}
.day{display:flex;min-width:0}
.dc{position:relative;flex:1;min-height:104px;border-radius:12px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:6px;padding:10px 12px;min-width:0}
.day.today .dc{background:var(--b50);box-shadow:inset 0 0 0 2px var(--brand)}
.dc .dn{position:absolute;top:10px;right:12px;font-size:.78rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.day.today .dc .dn{color:var(--blue);font-weight:700}
.plus{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ctl);background:var(--bg);color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0;transition:background-color 120ms ease,border-color 120ms ease,color 120ms ease,transform 150ms ease}
.plus svg{width:14px;height:14px}
.plus:hover,.plus[aria-expanded=true]{background:var(--blue);border-color:var(--blue);color:#fff;transform:scale(1.06)}
.plus.faint{width:22px;height:22px;border-color:var(--line);color:var(--ctl);background:transparent}
.ses{display:flex;flex-direction:column;gap:6px;margin-top:2px;min-width:0}
.ses b{font-size:.9rem;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.dc.done{background:#e3f1e7;color:#24472f;box-shadow:0 0 0 1px #bcdac5,inset 0 3px 6px rgba(30,107,50,.16)}
.dc.done .dn{color:#3f5f49}
.ok-ic{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--ok-ink);color:#fff}.ok-ic svg{width:12px;height:12px}
.facts{display:flex;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--ink2)}
.asg{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg);border-radius:14px;margin-bottom:12px;padding:12px 16px;box-shadow:var(--e3)}
.asg select{height:36px;border:1px solid var(--ctl);border-radius:8px;padding:0 10px;background:var(--bg);font-size:.88rem}
.asg label{display:flex;align-items:center;gap:8px;font-size:.88rem}
.legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--ink2);margin:12px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--line)}
/* Celular: una lista vertical por semana con todos los días */
.wk{background:var(--bg);border-radius:16px;box-shadow:var(--e1);padding:12px;margin-bottom:8px}
.wk.cur{box-shadow:0 0 0 2px var(--brand),var(--e2)}
.wk header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.wk .dr{display:flex;align-items:center;gap:12px;padding:8px;border-radius:10px;min-height:48px}
.wk .dr.today{background:var(--b50);box-shadow:inset 0 0 0 2px var(--brand)}
.wk .dr .dl{width:52px;font-size:.82rem;font-weight:600;color:var(--ink2);flex:none}
.wk .dr .sn{flex:1;min-width:0;font-size:.9rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk .dr.done{background:#e3f1e7}
.note{margin:24px 24px 0;font-size:.8rem;color:#aab2c0}
</style>
</head>
<body>
<div class="mock" role="toolbar" aria-label="Controles de la maqueta">
  <div class="g"><label>Pantalla</label><div class="seg" id="s-pantalla"><button data-v="biblioteca" aria-pressed="true">Biblioteca</button><button data-v="calendario" aria-pressed="false">Calendario del ciclo</button></div></div>
  <div class="g" id="g-variante"><label>Variante</label><div class="seg" id="s-variante"><button data-v="A" aria-pressed="true">A · Filas</button><button data-v="B" aria-pressed="false">B · Tarjetas</button></div></div>
  <div class="g"><label>Estado</label><div class="seg" id="s-estado"><button data-v="normal" aria-pressed="true">Con datos</button><button data-v="vacio" aria-pressed="false">Vacío</button><button data-v="carga" aria-pressed="false">Cargando</button><button data-v="error" aria-pressed="false">Error</button></div></div>
  <div class="g"><label>Ancho</label><div class="seg" id="s-ancho"><button data-v="esc" aria-pressed="true">Escritorio</button><button data-v="cel" aria-pressed="false">Celular</button></div></div>
</div>
<div id="frame" class="frame"></div>

<script>
const I = {
  logo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M20 12a8 8 0 0 1-8 8"/><path d="M4 12a8 8 0 0 1 8-8"/><path d="M16.5 5.2A8 8 0 0 1 20 12" opacity=".0"/></svg>',
  rt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>',
  cy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M19.5 11A7.5 7.5 0 0 0 7 6.2"/><path d="M4.5 13A7.5 7.5 0 0 0 17 17.8"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Completada"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'
};
const S = {pantalla:'biblioteca', variante:'A', estado:'normal', ancho:'esc', filtro:'todo', asg:null, menu:false};

const ITEMS = [
  {t:'rt', n:'Empuje A', tags:['Pecho','Hombro','Tríceps'], meta:['6 ejercicios','18 series']},
  {t:'cy', n:'Fuerza base de 5 semanas', plantilla:true, meta:['5 semanas','3 por semana']},
  {t:'rt', n:'Tirón A', tags:['Espalda','Bíceps'], meta:['5 ejercicios','15 series']},
  {t:'cy', n:'Hipertrofia de Camila', atleta:'Camila Rojas', ini:'CR', estado:'Activo', meta:['6 semanas','4 por semana']},
  {t:'rt', n:'Pierna completa', tags:['Cuádriceps','Glúteo','Isquios'], meta:['7 ejercicios','21 series']},
  {t:'cy', n:'Pretemporada', plantilla:true, meta:['12 semanas','Macrociclo']},
  {t:'cy', n:'Volumen de Mateo', atleta:'Mateo Silva', ini:'MS', estado:'Completado', meta:['4 semanas','3 por semana']},
  {t:'rt', n:'Cuerpo completo base', tags:['Cuerpo completo'], meta:['8 ejercicios','24 series']}
];
const count = k => k==='todo'?ITEMS.length:ITEMS.filter(i=>i.t===k).length;
const icon = (t,sm) => `<span class="tic ${t==='rt'?'rt':'cy'}${sm?' sm':''}" title="${t==='rt'?'Rutina':'Ciclo'}">${t==='rt'?I.rt:I.cy}</span>`;

function pills(i){
  const out=[];
  out.push(`<span class="pill ${i.t==='rt'?'blue':'dark'}">${i.t==='rt'?'Rutina':'Ciclo'}</span>`);
  if(i.tags) i.tags.forEach(g=>out.push(`<span class="pill">${g}</span>`));
  if(i.plantilla) out.push('<span class="pill blue">Plantilla</span>');
  if(i.estado) out.push(`<span class="pill ${i.estado==='Activo'?'ok':''}">${i.estado}</span>`);
  i.meta.forEach(m=>out.push(`<span class="pill">${m}</span>`));
  return out.join('');
}
function actions(i){
  if(i.t==='rt') return '<button class="ghost">Editar</button><button class="ghost">Borrar</button>';
  if(i.plantilla) return '<button class="ghost">Asignar a un atleta</button><button class="ghost">Abrir</button>';
  return '<button class="ghost">Abrir</button>';
}
function rowA(i){
  const who = i.atleta ? `<span class="who"><span class="avatar sm">${i.ini}</span>${i.atleta}</span>` : '';
  return `<div class="row">${icon(i.t)}<div class="nm"><h2>${i.n}</h2>${who}<div class="tags">${pills(i)}</div></div><div class="acts">${actions(i)}</div></div>`;
}
function cardB(i){
  const who = i.atleta ? `<span class="who"><span class="avatar sm">${i.ini}</span>${i.atleta}</span>` : '';
  return `<div class="card"><div class="top">${icon(i.t)}<span class="sp"></span><span class="pill ${i.t==='rt'?'blue':'dark'}">${i.t==='rt'?'Rutina':'Ciclo'}</span></div><h2>${i.n}</h2>${who}<div class="foot">${pills(i).replace(/<span class="pill (blue|dark)">(Rutina|Ciclo)<\/span>/,'')}</div></div>`;
}

function header(){
  return `<header class="hdr"><div class="hdr-in"><span class="logo">${I.logo}Cycles</span><nav class="nav"><a href="#">Inicio</a><a href="#">Atletas</a><a href="#" class="on">Biblioteca</a></nav><span class="avatar">MG</span></div></header>`;
}

function biblioteca(){
  const filtros=[['todo','Todo',''],['rt','Rutinas',I.rt],['cy','Ciclos',I.cy]];
  const chips=filtros.map(([k,l,ic])=>`<button class="chip" data-f="${k}" aria-pressed="${S.filtro===k}">${ic}${l}<em>${S.estado==='vacio'?0:count(k)}</em></button>`).join('');
  const create=`<div class="menu${S.menu?' open':''}"><button class="btn p" id="crear" aria-haspopup="menu" aria-expanded="${S.menu}">${I.plus}Crear</button><div class="menu-list" role="menu"><button role="menuitem">${icon('rt',1)}Rutina</button><button role="menuitem">${icon('cy',1)}Ciclo</button></div></div>`;
  let body='';
  const list = ITEMS.filter(i=>S.filtro==='todo'||i.t===S.filtro);
  if(S.estado==='carga'){
    body = S.variante==='A'
      ? `<div class="rows">${[0,1,2,3,4].map(()=>`<div class="skrow"><div class="sk" style="width:40px;height:40px;border-radius:12px"></div><div class="sk" style="height:16px;width:30%"></div><span class="sp"></span><div class="sk" style="height:16px;width:90px"></div></div>`).join('')}</div>`
      : `<div class="cards">${[0,1,2,3,4,5].map(()=>`<div class="card"><div class="sk" style="width:40px;height:40px;border-radius:12px"></div><div class="sk" style="height:18px;width:60%"></div><div class="sk" style="height:14px;width:80%"></div></div>`).join('')}</div>`;
  } else if(S.estado==='error'){
    body=`<div class="err" role="alert"><span>No se pudo cargar tu biblioteca.</span><button class="btn">Reintentar</button></div>`;
  } else if(S.estado==='vacio'){
    body=`<div class="empty"><span class="tic rt">${I.rt}</span><h2>Tu biblioteca está vacía</h2><p>Aquí vivirán tus rutinas y tus ciclos. Empieza armando una rutina; después puedes combinarlas en un ciclo.</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn p">${I.plus}Crear rutina</button><button class="btn">${I.plus}Crear ciclo</button></div></div>`;
  } else {
    body = S.variante==='A' ? `<div class="rows">${list.map(rowA).join('')}</div>` : `<div class="cards">${list.map(cardB).join('')}</div>`;
  }
  const showBar = S.estado!=='vacio';
  return `<main><div class="head"><h1>Biblioteca</h1><span class="sp"></span>${create}</div>${showBar?`<div class="bar" role="group" aria-label="Filtrar por tipo">${chips}<label class="search">${I.search}<input type="search" placeholder="Buscar por nombre" aria-label="Buscar por nombre"></label></div>`:''}${body}</main>`;
}

/* Calendario */
const DIAS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const SEM=[
  {n:1,r:'26 oct – 1 nov',cur:true,d:[26,27,28,29,30,31,1],s:{0:{n:'Empuje A',done:1,esf:7,min:58},2:{n:'Tirón A'}}},
  {n:2,r:'2 – 8 nov',d:[2,3,4,5,6,7,8],s:{0:{n:'Empuje A'},2:{n:'Tirón A'},4:{n:'Pierna completa'}}},
  {n:3,r:'9 – 15 nov',d:[9,10,11,12,13,14,15],s:{}}
];
const TODAY_IDX=1; // martes 27
function calendario(){
  const vacio=S.estado==='vacio';
  const sem=SEM.map(w=>({...w,s:vacio?{}:w.s}));
  if(S.estado==='carga') return `<main>${crumb()}${S.ancho==='esc'?`<div class="weeks">${[0,1,2].map(()=>`<div class="wr" style="min-height:128px"><div class="sk" style="height:40px"></div>${[0,1,2,3,4,5,6].map(()=>'<div class="sk" style="height:104px;border-radius:12px"></div>').join('')}<div class="sk" style="height:40px"></div></div>`).join('')}</div>`:[0,1].map(()=>'<div class="wk"><div class="sk" style="height:200px"></div></div>').join('')}</main>`;
  if(S.estado==='error') return `<main>${crumb()}<div class="err" role="alert"><span>No se pudo cargar el ciclo.</span><button class="btn">Reintentar</button></div></main>`;
  const asg = S.asg ? `<div class="asg" role="region" aria-label="Asignar rutina"><b>${S.asg}</b><select aria-label="Rutina"><option>Empuje A</option><option>Tirón A</option><option>Pierna completa</option></select><label><input type="checkbox"> Repetir este día en las semanas que siguen vacías</label><button class="btn p" data-act="asignar">Asignar</button><button class="btn" data-act="cancelar">Cancelar</button></div>` : '';
  let grid='';
  if(S.ancho==='esc'){
    grid=`<div class="gh"><span></span>${DIAS.map((d,i)=>`<span class="${i===TODAY_IDX?'today':''}">${d}</span>`).join('')}<span>Resumen</span></div><div class="weeks">${sem.map(w=>weekRow(w)).join('')}</div>`;
  } else {
    grid=sem.map(w=>weekCel(w)).join('');
  }
  return `<main>${crumb()}${asg}${grid}<div class="legend"><span><i style="background:var(--b50);box-shadow:inset 0 0 0 2px var(--brand)"></i>Hoy</span><span><i style="background:#e3f1e7"></i>Completada</span><span><span class="plus faint" style="width:16px;height:16px;pointer-events:none">${I.plus}</span>Agregar una rutina ese día</span></div></main>`;
}
function crumb(){
  return `<div class="crumb"><a class="back" href="#">Biblioteca</a><h1>Hipertrofia de Camila</h1><span class="who"><span class="avatar sm">CR</span>Camila Rojas</span><span class="pill ok">Activo</span><span class="pill">Mesociclo</span><span class="sp"></span><button class="btn">Editar ciclo</button></div>`;
}
function dayCell(w,i){
  const s=w.s[i]; const today=w.cur&&i===TODAY_IDX; const key=`s${w.n}d${i}`;
  const plus=`<button class="plus${s?' faint':''}" data-add="${key}" data-label="${DIAS[i]} ${w.d[i]}, semana ${w.n}" aria-label="Agregar rutina el ${DIAS[i].toLowerCase()} ${w.d[i]}" aria-expanded="${S.asg===`${DIAS[i]} ${w.d[i]}, semana ${w.n}`}">${I.plus}</button>`;
  const ses = s ? `<div class="ses"><b>${s.n}</b>${s.done?`<span class="ok-ic">${I.check}</span><div class="facts"><span>Esfuerzo ${s.esf}</span><span>${s.min} min</span></div>`:'<span class="pill">Pendiente</span>'}</div>`:'';
  return `<div class="day${today?' today':''}"><div class="dc${s&&s.done?' done':''}">${plus}<span class="dn">${w.d[i]}</span>${ses}</div></div>`;
}
function weekRow(w){
  const n=Object.keys(w.s).length, hechas=Object.values(w.s).filter(x=>x.done).length;
  return `<div class="wr${w.cur?' cur':''}"><div class="wl"><b>Semana ${w.n}</b><span class="pill">${w.r}</span>${w.cur?'<span class="pill blue">En curso</span>':''}</div>${DIAS.map((_,i)=>dayCell(w,i)).join('')}<div class="ws"><span class="pill ${n===4?'ok':'warn'}" style="align-self:flex-start">${n} de 4 planificadas</span><span>${hechas} hechas</span></div></div>`;
}
function weekCel(w){
  const rows=DIAS.map((d,i)=>{const s=w.s[i];const today=w.cur&&i===TODAY_IDX;
    return `<div class="dr${today?' today':''}${s&&s.done?' done':''}"><span class="dl">${d.slice(0,3)} ${w.d[i]}</span><span class="sn">${s?s.n:''}</span>${s&&s.done?`<span class="ok-ic">${I.check}</span>`:''}<button class="plus${s?' faint':''}" data-add="s${w.n}d${i}" data-label="${d} ${w.d[i]}, semana ${w.n}" aria-label="Agregar rutina el ${d.toLowerCase()} ${w.d[i]}">${I.plus}</button></div>`}).join('');
  return `<section class="wk${w.cur?' cur':''}"><header><b>Semana ${w.n}</b><span class="pill">${w.r}</span>${w.cur?'<span class="pill blue">En curso</span>':''}</header>${rows}</section>`;
}

function render(){
  const f=document.getElementById('frame');
  f.className='frame'+(S.ancho==='cel'?' cel':'');
  f.innerHTML=header()+(S.pantalla==='biblioteca'?biblioteca():calendario());
  document.getElementById('g-variante').style.display=S.pantalla==='biblioteca'?'flex':'none';
  ['pantalla','variante','estado','ancho'].forEach(k=>document.querySelectorAll(`#s-${k} button`).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===S[k]))));
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filtro=b.dataset.f;render()});
  const c=document.getElementById('crear'); if(c) c.onclick=()=>{S.menu=!S.menu;render()};
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{S.asg=b.dataset.label;render();window.scrollTo({top:0,behavior:'smooth'})});
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{S.asg=null;render()});
}
['pantalla','variante','estado','ancho'].forEach(k=>document.getElementById('s-'+k).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S[k]=b.dataset.v;S.asg=null;S.menu=false;render()}));
render();
</script>
</body>
</html>
