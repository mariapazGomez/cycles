<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizarra del ciclo · Cycles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
<style>
/* Concepto: la pizarra. El calendario del ciclo es el centro de la pantalla y se edita ahí mismo: el coach arrastra rutinas a los días, mueve sesiones, duplica y quita, y crea rutinas nuevas sin salir de la ventana. Solo para el coach: el atleta sigue viendo su ciclo semana a semana. Mismo lenguaje que Biblioteca y ciclo-en-calendario: tres niveles de elevación, sin gradientes, tokens de la web (global.css) y solo modo claro. Estados de la sesión como en la web: Hecha = verde con insignia de visto, Pendiente = blanca, Omitida = ámbar, Día tentativo = borde punteado. Espaciado en escala de 4 px. */
:root{
  --font-display:"Bricolage Grotesque","Inter",system-ui,sans-serif; --font-body:"Inter",system-ui,sans-serif;
  --brand:#3080fc; --blue:#1a66dd; --blue-hover:#155ccc; --b50:#f3f8ff; --b100:#eaf2ff; --b200:#d6e4ff; --b700:#1450b0;
  --bg:#ffffff; --ink:#1f2228; --ink2:#5c6068; --gray:#f6f7f9; --line:#dfe2e7; --ctl:#8a8f98; --page:#eceff4;
  --ok-bg:#e9f5ec; --ok-ink:#1e6b32; --warn-bg:#fff1e3; --warn-ink:#9a4a00; --warn-fill:#e08a2e; --pain-bg:#fdecec; --pain-ink:#a3282c;
  --done-bg:#e3f1e7; --done-ring:#bcdac5; --done-ink:#24472f; --done-ink2:#3f5f49;
  --e1:0 0 0 1px rgba(31,34,40,.06),0 1px 2px rgba(31,34,40,.06),0 3px 8px -2px rgba(31,34,40,.08);
  --e2:0 0 0 1px rgba(31,34,40,.06),0 2px 4px rgba(31,34,40,.06),0 12px 24px -8px rgba(31,34,40,.18);
  --e3:0 0 0 1px rgba(31,34,40,.07),0 4px 8px rgba(31,34,40,.08),0 20px 40px -12px rgba(31,34,40,.30);
  --sk:#dde2ea; color-scheme:light; --hdr:56px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
button,a,select,input{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1{margin:0;font-family:var(--font-display);font-size:1.7rem;line-height:1.1;font-weight:700;letter-spacing:-.01em}
h2{margin:0;font-size:1rem;font-weight:700;line-height:1.3}
h3{margin:0;font-size:.92rem;font-weight:700}
.sp{flex:1}
.svg{width:16px;height:16px;flex:none}

/* Barra de la maqueta (no es parte del producto) */
.mock{position:sticky;top:0;z-index:60;background:#14171c;color:#fff;padding:8px 16px;display:flex;gap:8px 20px;flex-wrap:wrap;align-items:center;font-size:.78rem}
.mock .g{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.mock label{color:#aab2c0}
.mock .seg{display:inline-flex;border-radius:999px;padding:3px;background:#262b33;flex-wrap:wrap}
.mock .seg button{border:0;background:transparent;color:#cfd6e4;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:600;cursor:pointer}
.mock .seg button[aria-pressed=true]{background:#fff;color:var(--ink)}

/* Encabezado del producto */
.hdr{background:var(--bg);height:var(--hdr);box-shadow:0 1px 0 rgba(31,34,40,.08),0 4px 12px -6px rgba(31,34,40,.12)}
.hdr-in{max-width:1320px;height:100%;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:32px}
.logo{font-family:var(--font-display);font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:8px}
.logo svg{width:24px;height:24px;color:var(--brand)}
.nav{display:flex;gap:20px;flex:1;height:100%}
.nav a{display:flex;align-items:center;font-size:.92rem;font-weight:600;color:var(--ink2);text-decoration:none;border-bottom:2px solid transparent;padding-top:2px}
.nav a.on{color:var(--ink);border-bottom-color:var(--brand)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 2px #fff,0 1px 3px rgba(31,34,40,.25)}
.avatar.sm{width:28px;height:28px;font-size:.68rem}

.frame{position:relative;margin:0 auto;max-width:1320px;background:var(--page);min-height:calc(100vh - 44px)}
.frame.tab{max-width:820px;box-shadow:var(--e3);border-radius:20px;overflow:hidden;margin-top:16px;margin-bottom:16px;min-height:0}
.frame.tab .hdr-in{padding:0 16px;gap:16px}
main{padding:16px 24px 64px}
.frame.tab main{padding:16px 16px 48px}

/* Botones, píldoras, selectores */
.btn{height:36px;padding:0 16px;border-radius:999px;border:0;background:var(--bg);box-shadow:var(--e1);font-size:.86rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:box-shadow 150ms ease,transform 150ms ease,background-color 120ms ease}
.btn:hover{box-shadow:var(--e2);transform:translateY(-1px)}.btn:active{transform:none;box-shadow:var(--e1)}
.btn.p{background:var(--blue);color:#fff}.btn.p:hover{background:var(--blue-hover)}
.btn.sm{height:30px;padding:0 12px;font-size:.8rem}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:var(--e1)}
.btn.open{background:var(--b100);color:var(--blue);box-shadow:inset 0 0 0 2px var(--brand)}
.ghost{height:30px;padding:0 10px;border:0;border-radius:999px;background:transparent;font-size:.8rem;font-weight:600;color:var(--ink2);cursor:pointer}.ghost:hover{background:var(--gray);color:var(--ink)}
.link{font-size:.84rem;font-weight:600;color:var(--blue);background:none;border:0;cursor:pointer;padding:0;text-decoration:none}.link:hover{text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:.74rem;font-weight:700;background:var(--bg);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.pill.blue{background:var(--b100);color:var(--blue);box-shadow:none}.pill.ok{background:var(--ok-bg);color:var(--ok-ink);box-shadow:none}.pill.dark{background:var(--ink);color:#fff;box-shadow:none}.pill.warn{background:var(--warn-bg);color:var(--warn-ink);box-shadow:none}.pill.pain{background:var(--pain-bg);color:var(--pain-ink);box-shadow:none}
.pill .svg{width:12px;height:12px}
.seg2{display:inline-flex;border-radius:999px;padding:3px;background:var(--bg);box-shadow:var(--e1)}
.seg2 button{border:0;background:transparent;border-radius:999px;padding:4px 16px;font-size:.84rem;font-weight:700;color:var(--ink2);cursor:pointer}
.seg2 button.on{background:var(--b100);color:var(--ink)}
.sel{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:999px;padding:3px 10px 3px 12px;box-shadow:var(--e1);height:36px}
.sel select{border:0;background:none;font-size:.9rem;font-weight:700;outline:0;max-width:210px;cursor:pointer}
.tic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.tic svg{width:20px;height:20px}.tic.rt{background:var(--b100);color:var(--blue)}.tic.cy{background:var(--ink);color:#fff}
.tic.sm{width:28px;height:28px;border-radius:8px}.tic.sm svg{width:16px;height:16px}

/* Encabezado compacto del ciclo */
.crumb{display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:.88rem}
.back{color:var(--ink2);text-decoration:none}
.head{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}
.head h1{font-size:1.45rem}
.save{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--ink2);min-width:96px}
.save.ok{color:var(--ok-ink)}.save.err{color:var(--pain-ink)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--b200);border-top-color:var(--blue);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:14px;padding:10px 16px;margin-bottom:12px;background:var(--bg);box-shadow:var(--e1);font-size:.88rem}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink)}.banner.err{background:var(--pain-bg);color:var(--pain-ink)}.banner.info{background:var(--b50);color:var(--b700)}
.banner>span{flex:1;min-width:200px}

/* Composición de la pizarra */
.board{display:grid;gap:16px;align-items:start}
.board.A{grid-template-columns:minmax(0,1fr) 272px}
.board.B,.board.A.tab{grid-template-columns:minmax(0,1fr)}
.rail{position:sticky;top:60px;background:var(--bg);border-radius:18px;box-shadow:var(--e2);padding:12px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow:auto}
.rail header{display:flex;align-items:center;gap:8px}
.search{display:flex;align-items:center;gap:8px;background:var(--gray);border-radius:999px;padding:0 12px;height:34px;box-shadow:inset 0 0 0 1px var(--line);flex:1;min-width:0}
.search svg{width:16px;height:16px;color:var(--ctl)}.search input{border:0;outline:0;background:none;flex:1;font-size:.86rem;min-width:0}
.rlist{display:flex;flex-direction:column;gap:6px}
.ritem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--bg);box-shadow:var(--e1);cursor:grab;transition:box-shadow 150ms ease,transform 150ms ease;user-select:none}
.ritem:hover{box-shadow:var(--e2);transform:translateY(-1px)}.ritem:active{cursor:grabbing}
.ritem .grip{color:var(--ctl);flex:none}
.ritem .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ritem .nm b{font-size:.88rem;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ritem .tg{display:flex;gap:4px;flex-wrap:wrap}
.ritem.lift{opacity:.5;box-shadow:0 0 0 2px var(--brand)}
.tray{background:var(--bg);border-radius:18px;box-shadow:var(--e2);padding:12px;display:flex;gap:12px;align-items:stretch;margin-bottom:16px}
.tray .tl{display:flex;flex-direction:column;gap:8px;width:220px;flex:none}
.tray .tr{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;flex:1;min-width:0}
.tray .ritem{flex:none;width:176px;align-items:flex-start;flex-direction:column;gap:6px}
.tray .ritem .top{display:flex;align-items:center;gap:8px;width:100%}
.tray .new{flex:none;width:150px;border:1.5px dashed var(--brand);background:var(--b50);color:var(--blue);border-radius:12px;font-weight:700;font-size:.86rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.tray .new:hover{background:var(--b100)}
.empty{background:var(--gray);border-radius:14px;padding:20px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty p{margin:0;font-size:.86rem;color:var(--ink2)}

/* Calendario */
.gh,.wr{display:grid;grid-template-columns:104px repeat(7,minmax(0,1fr));gap:6px;padding:0 10px}
.frame.tab .gh,.frame.tab .wr{grid-template-columns:76px repeat(7,minmax(0,1fr));gap:4px;padding:0 8px}
.gh{padding-bottom:6px;font-size:.78rem;font-weight:600;color:var(--ink2)}.gh span{padding:0 4px}
.weeks{display:flex;flex-direction:column;gap:8px}
.wr{padding-top:10px;padding-bottom:10px;background:var(--bg);border-radius:16px;box-shadow:var(--e1);align-items:stretch}
.wr.cur{box-shadow:0 0 0 2px var(--brand),var(--e2)}
.wl{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:4px 4px;font-size:.84rem}
.wl b{font-size:.92rem}
.wl .pill{white-space:normal;line-height:1.25;padding-top:2px;padding-bottom:2px}
.dc{position:relative;min-height:104px;border-radius:12px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:6px;padding:8px;min-width:0;transition:background-color 120ms ease,box-shadow 120ms ease}
.dc.today{background:var(--b50);box-shadow:inset 0 0 0 2px var(--brand)}
.dc .top{display:flex;align-items:center;justify-content:space-between;gap:4px;min-height:24px}
.dc .dn{font-size:.76rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.dc.today .dn{color:var(--blue);font-weight:700}
.plus{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ctl);background:var(--bg);color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0;transition:background-color 120ms ease,border-color 120ms ease,color 120ms ease,transform 150ms ease}
.plus svg{width:12px;height:12px}
.plus:hover,.plus[aria-expanded=true]{background:var(--blue);border-color:var(--blue);color:#fff;transform:scale(1.08)}
.plus.faint{border-color:var(--line);color:var(--ctl);background:transparent}
.plus.faint svg{width:10px;height:10px}
.plus[disabled]{opacity:.4;cursor:not-allowed;transform:none;background:var(--bg);border-color:var(--ctl);color:var(--ink2)}
.cards{display:flex;flex-direction:column;gap:6px;min-width:0}
/* Estados del día */
.dc.out{background:repeating-linear-gradient(135deg,#f6f7f9,#f6f7f9 6px,#eef0f3 6px,#eef0f3 12px);box-shadow:inset 0 0 0 1px var(--line);color:var(--ctl)}
.dc.out .plus{display:none}
.dc.ro .plus{display:none}
.dc.ok{background:var(--b50);box-shadow:inset 0 0 0 2px var(--brand);border-radius:12px}
.dc.bad{background:var(--pain-bg);box-shadow:inset 0 0 0 2px #e6a3a6;cursor:not-allowed}
.dc.ok::after,.dc.bad::after{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:.7rem;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap;pointer-events:none}
.dc.ok::after{content:"Soltar aquí";background:var(--blue);color:#fff}
.dc.bad::after{content:"Fuera del ciclo";background:var(--pain-ink);color:#fff}
.dc[data-why=past].out::after,.dc[data-why=past].bad::after{content:"Día pasado"}
.dc.has.out::after{display:none}
.dc.out::after{content:"Fuera del ciclo";position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:.68rem;font-weight:600;color:var(--ctl);white-space:nowrap}
.dc.oksel{background:var(--b50);box-shadow:inset 0 0 0 2px var(--brand)}

/* Tarjeta de sesión: mismos estados que la web (PlanCalendar) */
.ses{position:relative;display:flex;flex-direction:column;gap:6px;padding:8px 8px 8px 10px;border-radius:12px;background:var(--bg);box-shadow:var(--e1);min-width:0;cursor:grab;transition:box-shadow 150ms ease,transform 150ms ease;color:var(--ink)}
.ses:hover{box-shadow:var(--e2);transform:translateY(-1px)}.ses:active{cursor:grabbing}
.ses b{font-size:.84rem;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.ses .st{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nr{display:flex;align-items:flex-start;gap:2px;min-width:0}.nr b{flex:1;min-width:0}
.ses .mn{flex:none;margin:-3px -5px 0 0;width:22px;height:22px;border-radius:50%;border:0;background:transparent;color:var(--ctl);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ses .mn:hover,.ses .mn[aria-expanded=true]{background:var(--gray);color:var(--ink)}
.ses .mn svg{width:16px;height:16px}
.ses .facts{display:flex;gap:8px;flex-wrap:wrap;font-size:.72rem;color:var(--ink2)}
.pend{font-size:.74rem;font-weight:600;color:var(--ink2)}
.ses.done{background:var(--done-bg);color:var(--done-ink);box-shadow:0 0 0 1px var(--done-ring),inset 0 3px 6px rgba(30,107,50,.16);cursor:default}
.ses.done:hover{transform:none;box-shadow:0 0 0 1px #a7cfb3,inset 0 3px 6px rgba(30,107,50,.16),0 6px 14px -6px rgba(30,107,50,.3)}
.ses.done .facts{color:var(--done-ink2)}
.ses.skip{background:var(--warn-bg);box-shadow:0 0 0 1px #f0d3b3,0 1px 2px rgba(154,74,0,.1),0 3px 8px -2px rgba(154,74,0,.12)}
.ses.tent{outline:1.5px dashed var(--ctl);outline-offset:-1.5px}
.tentl{font-size:.72rem;font-weight:600;color:var(--ink2)}
.ses.lift{opacity:.45;outline:2px dashed var(--brand);outline-offset:-2px;background:var(--b50);box-shadow:none}
.ses.sv{box-shadow:0 0 0 2px var(--b200),var(--e1)}
.ses.fail{background:var(--pain-bg);box-shadow:0 0 0 1px #e6a3a6}
.ok-ic{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--ok-ink);color:#fff;flex:none}.ok-ic svg{width:12px;height:12px}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:700;color:var(--done-ink2)}.lock svg{width:12px;height:12px}
.tip{position:absolute;left:8px;right:8px;bottom:calc(100% + 4px);z-index:20;background:var(--ink);color:#fff;border-radius:10px;padding:6px 10px;font-size:.74rem;font-weight:600;line-height:1.3;box-shadow:var(--e3);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity 120ms ease,transform 120ms ease}
.ses.done:hover .tip,.ses.done:focus-within .tip,.ses.done.showtip .tip{opacity:1;transform:none}
.floater{position:absolute;z-index:25;width:150px;transform:rotate(-2deg);box-shadow:var(--e3)}
.legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--ink2);margin:12px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--line)}
.addweek{margin-top:8px;display:flex;justify-content:center}

/* Tablet: celdas más compactas */
.frame.tab .dc{padding:6px;gap:4px}
.frame.tab .ses{padding:6px 4px 6px 7px;gap:4px}
.frame.tab .ses b{font-size:.76rem}
.frame.tab .wl{padding:2px 0;font-size:.78rem}.frame.tab .wl b{font-size:.84rem}
.frame.tab .wl .pill{font-size:.66rem;padding:1px 6px}
.frame.tab .facts{font-size:.66rem}
.frame.tab .lock{font-size:.64rem}
/* Popovers, cajón y ventana */
.pop{position:fixed;z-index:50;width:280px;background:var(--bg);border-radius:16px;box-shadow:var(--e3);padding:10px;display:flex;flex-direction:column;gap:8px}
.pop h3{padding:2px 4px}
.pop .rlist{max-height:240px;overflow:auto;padding:2px}
.pop .ritem{cursor:pointer}.pop .ritem.dis{opacity:.5;cursor:not-allowed}
.pop.wide{width:320px}
.mlist{display:flex;flex-direction:column}
.mlist button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;border-radius:10px;padding:8px 10px;font-size:.88rem;font-weight:600;cursor:pointer}
.mlist button:hover{background:var(--gray)}.mlist button[disabled]{opacity:.45;cursor:not-allowed}.mlist button.dg{color:var(--pain-ink)}
.mlist button svg{width:16px;height:16px;color:var(--ink2)}.mlist button.dg svg{color:var(--pain-ink)}
.lbl{display:block;font-size:.78rem;font-weight:700;color:var(--ink2);margin-bottom:4px}
.inp{width:100%;height:40px;padding:0 12px;border:1px solid var(--ctl);border-radius:8px;background:var(--bg);font-size:.92rem}
.inp.bad{border-color:var(--pain-ink);background:var(--pain-bg)}
.hint{font-size:.76rem;color:var(--ink2);margin-top:4px}.hint.bad{color:var(--pain-ink);font-weight:600}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ctl);background:var(--bg);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.step button:hover{border-color:var(--blue);color:var(--blue)}
.step output{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.scrim{position:absolute;inset:0;background:rgba(20,23,28,.38);z-index:70}
.drawer{position:absolute;top:var(--hdr);right:0;bottom:0;width:420px;max-width:100%;background:var(--bg);box-shadow:var(--e3);z-index:75;display:flex;flex-direction:column}
.drawer header{display:flex;align-items:center;gap:12px;padding:16px 16px 8px}
.drawer .body{flex:1;overflow:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px}
.drawer footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;box-shadow:0 -1px 0 var(--line)}
.xrow{display:flex;flex-direction:column;gap:8px;background:var(--gray);border-radius:12px;padding:10px 12px;box-shadow:inset 0 0 0 1px var(--line)}
.xrow .t{display:flex;align-items:center;gap:8px}.xrow .t b{flex:1;font-size:.9rem}
.xrow .q{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.xrow .q label{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;color:var(--ink2)}
.xrow .q .mini{width:56px;height:32px;padding:0 8px;border:1px solid var(--ctl);border-radius:8px;text-align:center;background:var(--bg)}
.modal{position:absolute;z-index:80;left:50%;top:96px;transform:translateX(-50%);width:min(480px,calc(100% - 32px));background:var(--bg);border-radius:20px;box-shadow:var(--e3);display:flex;flex-direction:column}
.modal header{display:flex;align-items:center;gap:12px;padding:16px 20px 4px}
.modal .body{padding:8px 20px 16px;display:flex;flex-direction:column;gap:16px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 16px;box-shadow:0 -1px 0 var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:700;background:var(--bg);color:var(--ink2);box-shadow:var(--e1);cursor:pointer}.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:12px;font-size:.86rem;font-weight:600;box-shadow:var(--e3)}
.toast button{border:0;border-radius:999px;background:#fff;color:var(--ink);font-weight:700;padding:4px 14px;cursor:pointer}

/* Carga y estados */
.sk{background:var(--sk);border-radius:8px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sh 1.3s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.sk::after{animation:none}}
/* Hoja de estados */
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin:12px 0 28px}
.cat figure{margin:0;display:flex;flex-direction:column;gap:8px}
.cat figcaption{font-size:.78rem;color:var(--ink2);line-height:1.35}.cat figcaption b{display:block;color:var(--ink);font-size:.84rem}
.cat .dc{min-height:96px}
.sheet h2{margin-top:8px;font-size:1.1rem}
table.rules{width:100%;border-collapse:collapse;background:var(--bg);border-radius:14px;box-shadow:var(--e1);overflow:hidden;font-size:.84rem}
.rules th,.rules td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}.rules th{background:var(--gray);font-size:.76rem;color:var(--ink2)}
.rules tr:last-child td{border-bottom:0}
.note{margin:24px 24px 0;font-size:.78rem;color:#7b8494}
</style>
</head>
<body>
<div class="mock" role="toolbar" aria-label="Controles de la maqueta">
  <div class="g"><label>Pantalla</label><div class="seg" id="s-pantalla"><button data-v="pizarra">Pizarra</button><button data-v="estados">Hoja de estados</button></div></div>
  <div class="g" id="g-variante"><label>Variante</label><div class="seg" id="s-variante"><button data-v="A">A · Panel lateral</button><button data-v="B">B · Bandeja superior</button></div></div>
  <div class="g" id="g-ancho"><label>Ancho</label><div class="seg" id="s-ancho"><button data-v="esc">Escritorio</button><button data-v="tab">Tablet</button></div></div>
  <div class="g" id="g-estado"><label>Pantalla en</label><div class="seg" id="s-estado"><button data-v="normal">Normal</button><button data-v="arrastrando">Arrastrando</button><button data-v="guardando">Guardando</button><button data-v="error">Error al guardar</button><button data-v="cargando">Cargando</button><button data-v="falla">Falla de carga</button><button data-v="sinrutinas">Sin rutinas</button><button data-v="sinsesiones">Sin sesiones</button></div></div>
  <div class="g" id="g-ciclo"><label>Ciclo</label><div class="seg" id="s-ciclo"><button data-v="curso">En curso</button><button data-v="vencido">Terminó (sigue activo)</button><button data-v="completado">Completado</button><button data-v="archivado">Archivado</button></div></div>
  <div class="g" id="g-ver"><label>Abrir</label><div class="seg" id="s-ver"><button data-v="cerrar">Nada</button><button data-v="datos">Datos del ciclo</button><button data-v="agregar">«+» de un día</button><button data-v="menu">Menú de sesión</button><button data-v="crear">Crear rutina</button><button data-v="detalle">Detalles del ejercicio</button></div></div>
</div>
<div id="frame" class="frame"></div>
<p class="note">Maqueta del diseño CYC-172 (solo coach). Los datos son de ejemplo. Prueba arrastrar una rutina a un día, mover una sesión pendiente, o usar el «+» y el menú ⋯ si prefieres no arrastrar.</p>
<script>
const H=(d,a)=>`<svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${a||2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I={
  logo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M20 12a8 8 0 0 1-8 8"/><path d="M4 12a8 8 0 0 1 8-8"/></svg>',
  rt:H('<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>'),
  cy:H('<path d="M19.5 11A7.5 7.5 0 0 0 7 6.2"/><path d="M4.5 13A7.5 7.5 0 0 0 17 17.8"/>',2.4),
  plus:H('<path d="M12 5v14M5 12h14"/>',2.6),
  search:H('<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>'),
  check:H('<path d="m5 12.5 4.5 4.5L19 7.5"/>',3.2),
  lock:H('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
  dots:H('<circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/>',2.4),
  grip:H('<circle cx="9" cy="6" r="1.1"/><circle cx="15" cy="6" r="1.1"/><circle cx="9" cy="12" r="1.1"/><circle cx="15" cy="12" r="1.1"/><circle cx="9" cy="18" r="1.1"/><circle cx="15" cy="18" r="1.1"/>',2.4),
  move:H('<path d="M5 12h14M15 8l4 4-4 4M9 8l-4 4 4 4"/>'),
  copy:H('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>'),
  trash:H('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>'),
  x:H('<path d="M6 6l12 12M18 6 6 18"/>',2.4),
  chev:H('<path d="m6 9 6 6 6-6"/>',2.4),
  warn:H('<path d="M12 4 2.5 20h19L12 4zM12 10v4M12 17.2v.1"/>'),
};
const DOW=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'], DOWL=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const dt=i=>new Date(2026,9,26+i), idx=(w,d)=>(w-1)*7+d;
const lab=(w,d)=>{const x=dt(idx(w,d));return `${DOWL[d]} ${x.getDate()} ${MES[x.getMonth()]}`};
const short=i=>{const x=dt(i);return `${x.getDate()} ${MES[x.getMonth()]}`};
const TODAY=4, GUIDE=4;
let endIdx=25;
const weeksN=()=>Math.ceil((endIdx+1)/7);
const RUT0=[
 {id:'r1',n:'Empuje A',g:['Pecho','Hombro','Tríceps'],ex:6,se:18},
 {id:'r2',n:'Tirón A',g:['Espalda','Bíceps'],ex:5,se:15},
 {id:'r3',n:'Pierna completa',g:['Cuádriceps','Glúteo','Isquios'],ex:7,se:21},
 {id:'r4',n:'Core y movilidad',g:['Core'],ex:5,se:10},
 {id:'r5',n:'Cuerpo completo base',g:['Cuerpo completo'],ex:8,se:24},
 {id:'r6',n:'Hombro y brazos',g:['Hombro','Bíceps','Tríceps'],ex:6,se:16},
];
let RUT=RUT0.slice();
const seed=()=>[
 {id:'s1',w:1,d:0,n:'Empuje A',st:'hecha',fecha:true,esf:7,min:58},
 {id:'s2',w:1,d:1,n:'Tirón A',st:'omitida',fecha:true},
 {id:'s3',w:1,d:2,n:'Pierna completa',st:'hecha',fecha:true,esf:8,min:62,pain:true},
 {id:'s4',w:1,d:4,n:'Empuje A',st:'pendiente',fecha:true},
 {id:'s5',w:2,d:0,n:'Empuje A',st:'pendiente',fecha:true},
 {id:'s6',w:2,d:0,n:'Core y movilidad',st:'pendiente',fecha:true},
 {id:'s7',w:2,d:2,n:'Tirón A',st:'pendiente',fecha:true},
 {id:'s8',w:2,d:4,n:'Pierna completa',st:'pendiente',fecha:true},
 {id:'s9',w:3,d:1,n:'Tirón A',st:'pendiente',fecha:false},
 {id:'s10',w:3,d:3,n:'Pierna completa',st:'pendiente',fecha:true},
];
let SES=seed(), uid=100;
const CAT=[['Sentadilla con barra','Piernas'],['Prensa de piernas','Piernas'],['Zancadas con mancuernas','Piernas'],['Peso muerto','Espalda'],['Press de banca con barra','Pecho'],['Press inclinado con mancuernas','Pecho'],['Dominadas','Espalda'],['Remo con barra','Espalda'],['Press militar','Hombro'],['Plancha frontal','Core']];
const newDr=()=>({name:'Pierna B',ex:[{n:'Sentadilla con barra',g:'Piernas',se:4,re:6,kg:'70',rest:'90',rir:'2'},{n:'Prensa de piernas',g:'Piernas',se:3,re:10,kg:'',rest:'',rir:''}],pick:false,q:'',mg:'Todo'});

const P=new URLSearchParams(location.hash.slice(1));
const S={pantalla:P.get('p')||'pizarra',variante:P.get('v')||'A',ancho:P.get('w')||'esc',estado:P.get('e')||'normal',ciclo:P.get('c')||'curso',ver:'cerrar',q:'',toast:null,save:'saved',rail:false,ctx:{w:2,d:1},sid:'s7',dr:newDr(),exi:0,datos:false,drag:null};
const ro=()=>S.ciclo==='completado'||S.ciclo==='archivado';
const sessions=()=>S.estado==='sinsesiones'?[]:SES;
const ESTADOS_PANTALLA=['normal','arrastrando','guardando','error','cargando','falla','sinrutinas','sinsesiones'];

const initials=n=>n;
const header=()=>`<header class="hdr"><div class="hdr-in"><span class="logo">${I.logo}Cycles</span><nav class="nav"><a href="#">Inicio</a><a href="#" class="on">Atletas</a><a href="#">Biblioteca</a></nav><span class="avatar">MG</span></div></header>`;
const saveInd=()=>{
  const k=S.estado==='guardando'?'saving':S.estado==='error'?'err':S.save;
  if(k==='saving') return `<span class="save" role="status"><span class="spin"></span>Guardando…</span>`;
  if(k==='err') return `<span class="save err" role="alert">${I.warn}No se guardó <button class="link" data-act="reintentar">Reintentar</button></span>`;
  return `<span class="save ok" role="status">${I.check.replace('class="svg"','class="svg" style="width:14px;height:14px"')}Guardado</span>`;
};

function sesCard(s,o={}){
  const done=s.st==='hecha',skip=s.st==='omitida',tent=s.st==='pendiente'&&!s.fecha;
  const drag=!done&&!ro()&&!o.static;
  const cls=['ses',done&&'done',skip&&'skip',tent&&'tent',o.lift&&'lift',o.save&&'sv',o.fail&&'fail',o.tip&&'showtip'].filter(Boolean).join(' ');
  const st=done?`<span class="ok-ic" title="Hecha">${I.check}</span>${s.pain?`<span class="pill pain">Dolor</span>`:''}`
    :skip?`<span class="pill warn">Omitida</span>`
    :o.save?`<span class="spin" aria-hidden="true"></span><span class="pend">Guardando…</span>`
    :o.fail?`<span class="pill pain">No se guardó</span><button class="link" data-act="reintentar">Reintentar</button>`
    :`<span class="pend">Pendiente</span>${tent?`<span class="tentl">Día tentativo</span>`:''}`;
  const facts=done?`<div class="facts"><span>Esfuerzo ${s.esf}</span><span>${s.min} min</span></div>`:'';
  const lock=done?`<span class="lock">${I.lock}Registrada</span><span class="tip" role="tooltip">Ya se registró: no se puede mover ni quitar.</span>`:'';
  const menu=(!done&&!ro()&&!o.static)?`<button class="mn" data-menu="${s.id}" aria-haspopup="menu" aria-expanded="${S.ver!=='cerrar'&&S.sid===s.id&&['menu','mover','dup'].includes(S.ver)}" aria-label="Opciones de ${s.n}">${I.dots}</button>`:'';
  const st2=`${done?'hecha':skip?'omitida':'pendiente'}${tent?', día tentativo':''}`;
  return `<div class="${cls}" ${drag?`draggable="true" data-ses="${s.id}"`:''} tabindex="0" role="group" aria-label="${s.n}, ${st2}"><div class="nr"><b>${s.n}</b>${menu}</div><div class="st">${st}</div>${facts}${lock}</div>`;
}
function dayCell(w,d,ov={}){
  const i=idx(w,d), past=S.ciclo==='vencido'&&i<=endIdx, out=i>endIdx||past, list=sessions().filter(s=>s.w===w&&s.d===d);
  const x=dt(i);
  const dragging=S.estado==='arrastrando';
  const cls=['dc',i===TODAY&&'today',out&&!(dragging)&&'out',out&&dragging&&'bad out',ro()&&'ro',list.length&&'has',ov.ok&&'ok'].filter(Boolean).join(' ');
  const plus=(out||ro())?'':`<button class="plus${list.length?' faint':''}" data-add="${w}:${d}" aria-haspopup="dialog" aria-expanded="${S.ver==='agregar'&&S.ctx.w===w&&S.ctx.d===d}" aria-label="${list.length?'Agregar otra rutina':'Agregar rutina'} el ${DOWL[d]} ${x.getDate()}">${I.plus}</button>`;
  const cards=list.map(s=>sesCard(s,{lift:dragging&&s.id==='s8',save:S.estado==='guardando'&&s.id==='s4',fail:S.estado==='error'&&s.id==='s8'})).join('');
  return `<div class="${cls}" data-cell="${w}:${d}" data-out="${out?1:0}" data-why="${past?'past':'out'}"><div class="top">${plus||'<span></span>'}<span class="dn">${x.getDate()}</span></div><div class="cards">${cards}</div></div>`;
}
function weekRow(w){
  const list=sessions().filter(s=>s.w===w), n=list.length, h=list.filter(s=>s.st==='hecha').length;
  const cur=w===1;
  const first=dt(idx(w,0)), last=dt(Math.min(idx(w,6),endIdx));
  return `<div class="wr${cur?' cur':''}"><div class="wl"><b>Semana ${w}</b><span class="pill">${first.getDate()} ${MES[first.getMonth()]} – ${last.getDate()} ${MES[last.getMonth()]}</span>${cur?'<span class="pill blue">En curso</span>':''}<span class="pill ${n>=GUIDE?'ok':'warn'}" title="${n} de ${GUIDE} sesiones planificadas">${n} de ${GUIDE}${S.ancho==='tab'?'':' planificadas'}</span>${h?`<span class="pill">${h} ${h===1?'hecha':'hechas'}</span>`:''}</div>${DOW.map((_,d)=>dayCell(w,d,S.estado==='arrastrando'&&w===2&&d===3?{ok:true}:{})).join('')}</div>`;
}
function calendar(){
  if(S.estado==='cargando') return `<div class="gh"><span></span>${DOW.map(d=>`<span>${d}</span>`).join('')}</div><div class="weeks">${[0,1,2].map(()=>`<div class="wr" style="min-height:128px"><div class="sk" style="height:48px"></div>${[0,1,2,3,4,5,6].map(()=>'<div class="sk" style="height:104px;border-radius:12px"></div>').join('')}</div>`).join('')}</div>`;
  const rows=Array.from({length:weeksN()},(_,i)=>weekRow(i+1)).join('');
  const add=ro()?'':`<div class="addweek"><button class="btn sm" data-act="semana">${I.plus}Agregar una semana</button><span class="hint" style="align-self:center;margin:0 0 0 12px">Mueve el fin del ciclo al ${short(endIdx+7)}.</span></div>`;
  return `<div class="gh" aria-hidden="true"><span></span>${DOW.map(d=>`<span>${d}</span>`).join('')}</div><div class="weeks">${rows}</div>${add}
  <div class="legend"><span><i style="background:var(--b50);box-shadow:inset 0 0 0 2px var(--brand)"></i>Hoy</span><span><span class="ok-ic" style="width:14px;height:14px">${I.check}</span>Hecha</span><span><i style="background:#fff"></i>Pendiente</span><span><i style="background:var(--warn-bg)"></i>Omitida</span><span><i style="background:#fff;outline:1.5px dashed var(--ctl);outline-offset:-1.5px"></i>Día tentativo</span></div>`;
}
function ritem(r,o={}){
  return `<div class="ritem" draggable="true" data-rut="${r.id}" tabindex="0" aria-label="${r.n}. Arrástrala a un día o usa el + del día">${o.col?`<div class="top"><span class="grip">${I.grip}</span><span class="tic rt sm">${I.rt}</span></div><div class="nm"><b>${r.n}</b><div class="tg">${r.g.slice(0,2).map(g=>`<span class="pill">${g}</span>`).join('')}<span class="pill blue">${r.ex} ej.</span></div></div>`:`<span class="grip">${I.grip}</span><span class="tic rt sm">${I.rt}</span><div class="nm"><b>${r.n}</b><div class="tg">${r.g.slice(0,2).map(g=>`<span class="pill">${g}</span>`).join('')}<span class="pill blue">${r.ex} ej.</span></div></div>`}</div>`;
}
const norm=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const rutFiltradas=()=>S.estado==='sinrutinas'?[]:RUT.filter(r=>norm(r.n+' '+r.g.join(' ')).includes(norm(S.q)));
function rail(){
  const list=rutFiltradas(), none=S.estado==='sinrutinas';
  const body=none?`<div class="empty"><span class="tic rt">${I.rt}</span><h3>Aún no tienes rutinas</h3><p>Crea la primera y arrástrala a un día del calendario.</p><button class="btn p sm" data-act="crear">${I.plus}Crear rutina nueva</button></div>`
   :list.length?`<div class="rlist">${list.map(r=>ritem(r)).join('')}</div>`:`<div class="empty"><p>Ninguna rutina coincide con «${S.q}».</p></div>`;
  return `<aside class="rail" aria-label="Rutinas"><header><h2>Rutinas</h2><span class="pill">${none?0:RUT.length}</span><span class="sp"></span>${S.ancho==='tab'?`<button class="ghost" data-act="rail" aria-label="Cerrar">${I.x}</button>`:''}</header>${none?'':`<button class="btn p" data-act="crear">${I.plus}Crear rutina nueva</button><label class="search">${I.search}<input type="search" data-q placeholder="Buscar rutina" aria-label="Buscar rutina" value="${S.q}"></label>`}${body}</aside>`;
}
function tray(){
  const list=rutFiltradas(), none=S.estado==='sinrutinas';
  return `<section class="tray" aria-label="Rutinas"><div class="tl"><h2>Rutinas</h2>${none?'':`<label class="search">${I.search}<input type="search" data-q placeholder="Buscar rutina" aria-label="Buscar rutina" value="${S.q}"></label>`}<span class="hint" style="margin:0">${none?'Sin rutinas todavía':'Arrastra una rutina a un día'}</span></div><div class="tr">${none?`<div class="empty" style="flex:1;flex-direction:row;justify-content:center;gap:16px"><p>Aún no tienes rutinas. Crea la primera y arrástrala a un día.</p><button class="btn p sm" data-act="crear">${I.plus}Crear rutina nueva</button></div>`:`<button class="new" data-act="crear">${I.plus}Crear rutina nueva</button>${list.map(r=>ritem(r,{col:true})).join('')}`}</div></section>`;
}
function datosForm(){
  return `<div style="display:flex;flex-direction:column;gap:10px"><div><label class="lbl" for="d-n">Nombre</label><input id="d-n" class="inp" value="Hipertrofia de Camila"></div><div><label class="lbl" for="d-o">Objetivo</label><input id="d-o" class="inp" value="Ganar masa muscular en el tren superior"></div><div class="fgrid"><div><label class="lbl" for="d-i">Inicio</label><input id="d-i" class="inp" type="date" value="2026-10-26"></div><div><label class="lbl" for="d-f">Fin</label><input id="d-f" class="inp" type="date" value="${dt(endIdx).toISOString().slice(0,10)}"></div></div><div><label class="lbl" for="d-e">Estado</label><select id="d-e" class="inp"><option ${S.ciclo==='curso'||S.ciclo==='vencido'?'selected':''}>Activo</option><option ${S.ciclo==='completado'?'selected':''}>Completado</option><option ${S.ciclo==='archivado'?'selected':''}>Archivado</option></select></div><p class="hint" style="margin:0">Cada campo se guarda al salir de él.</p></div>`;
}
function banners(){
  const out=[];
  if(S.estado==='falla') return `<div class="banner err" role="alert"><span>No se pudo cargar este ciclo.</span><button class="btn sm" data-act="reintentar">Reintentar</button></div>`;
  if(S.estado==='error') out.push(`<div class="banner err" role="alert">${I.warn}<span>No se pudo guardar el cambio en «Pierna completa». Revisa tu conexión y vuelve a intentarlo.</span><button class="btn sm p" data-act="reintentar">Reintentar</button><button class="btn sm" data-act="descartar">Descartar el cambio</button></div>`);
  if(S.ciclo==='vencido') out.push(`<div class="banner warn">${I.warn}<span>El ciclo terminó el ${short(endIdx)}, pero sigue marcado como Activo.</span><button class="btn sm" data-act="completar">Marcar como completado</button><button class="btn sm" data-act="semana">Agregar una semana</button></div>`);
  if(S.ciclo==='completado') out.push(`<div class="banner info"><span>Este ciclo está completado: solo puedes consultarlo. Reábrelo para cambiar sus sesiones.</span><button class="btn sm" data-act="reabrir">Reabrir ciclo</button></div>`);
  if(S.ciclo==='archivado') out.push(`<div class="banner info"><span>Este ciclo está archivado: no aparece en la lista del atleta y no se puede editar.</span><button class="btn sm" data-act="reabrir">Reactivar ciclo</button></div>`);
  if(S.estado==='sinsesiones'&&!ro()) out.push(`<div class="banner info"><span><b>Ciclo nuevo.</b> Arrastra una rutina a un día, o toca el «+» de ese día. ${'Camila'} la verá en su celular apenas la asignes.</span></div>`);
  return out.join('');
}

function render(){
  const f=document.getElementById('frame');
  f.className='frame'+(S.ancho==='tab'?' tab':'');
  let html=header();
  if(S.pantalla==='estados') html+=catalogo();
  else html+=pantallaPizarra();
  if(S.pantalla==='pizarra'&&S.ver==='crear'||S.ver==='detalle') html+=drawer();
  if(S.ver==='detalle') html+=modal();
  if(['agregar','menu','mover','dup'].includes(S.ver)||(S.ver==='datos'&&S.variante==='A')) html+=popover();
  if(S.estado==='arrastrando'&&S.pantalla==='pizarra') html+=`<div class="floater" id="floater">${sesCard({id:'g',n:'Pierna completa',st:'pendiente',fecha:true},{static:true})}</div>`;

  const q=document.activeElement&&document.activeElement.matches('[data-q],[data-px],[data-rname]')?{k:document.activeElement.hasAttribute('data-q')?'[data-q]':document.activeElement.hasAttribute('data-px')?'[data-px]':'[data-rname]',s:document.activeElement.selectionStart}:null;
  f.innerHTML=html;

  document.querySelectorAll('#s-ver button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===S.verb||(!S.verb&&b.dataset.v==='cerrar'))));
  const piz=S.pantalla==='pizarra';
  ['g-variante','g-ancho','g-estado','g-ciclo','g-ver'].forEach(id=>document.getElementById(id).style.display=piz?'flex':'none');
  const el=document.getElementById('pop'); if(el) place(el);
  const fl=document.getElementById('floater'); if(fl){const c=f.querySelector('[data-cell="2:3"]'); if(c){const fr=f.getBoundingClientRect(),r=c.getBoundingClientRect(); fl.style.left=(r.left-fr.left+14)+'px'; fl.style.top=(r.top-fr.top+36)+'px';}}
  if(q){const n=f.querySelector(q.k); if(n){n.focus(); try{n.setSelectionRange(q.s,q.s)}catch(_){}}}
  else {const a=f.querySelector('[data-autofocus]'); if(a&&!S.noFocus) a.focus({preventScroll:true});}
  history.replaceState(null,'','#'+new URLSearchParams({p:S.pantalla,v:S.variante,w:S.ancho,e:S.estado,c:S.ciclo}));
}
function anchorFor(){
  if(S.ver==='agregar') return document.querySelector(`[data-add="${S.ctx.w}:${S.ctx.d}"]`);
  if(['menu','mover','dup'].includes(S.ver)) return document.querySelector(`[data-menu="${S.sid}"]`);
  if(S.ver==='datos') return document.getElementById('b-datos');
}
function place(el){
  const a=anchorFor(); if(!a) return;
  const r=a.getBoundingClientRect(), w=el.offsetWidth, h=el.offsetHeight;
  let left=Math.min(Math.max(8,r.left),innerWidth-w-8), top=r.bottom+6;
  if(top+h>innerHeight-8) top=Math.max(8,r.top-h-6);
  el.style.left=left+'px'; el.style.top=top+'px';
}
function commit(msg,undo){
  S.save='saving'; S.toast={msg,undo}; render();
  clearTimeout(S.t1); clearTimeout(S.t2);
  S.t1=setTimeout(()=>{S.save='saved';render()},700);
  S.t2=setTimeout(()=>{S.toast=null;render()},6000);

function addSes(rid,w,d){const r=RUT.find(x=>x.id===rid); if(!r)return; const id='n'+(++uid); SES.push({id,w,d,n:r.n,st:'pendiente',fecha:true}); S.ver='cerrar';S.verb=null;S.q=''; commit(`«${r.n}» agregada el ${lab(w,d)}`,()=>{SES=SES.filter(x=>x.id!==id)});}
function moveSes(id,w,d){const s=SES.find(x=>x.id===id); if(!s||s.st==='hecha')return; const p={w:s.w,d:s.d,fecha:s.fecha}; Object.assign(s,{w,d,fecha:true}); S.ver='cerrar';S.verb=null; commit(`«${s.n}» movida al ${lab(w,d)}`,()=>Object.assign(s,p));}
function dupSes(id,w,d){const s=SES.find(x=>x.id===id); if(!s)return; const nid='n'+(++uid); SES.push({id:nid,w,d,n:s.n,st:'pendiente',fecha:true}); S.ver='cerrar';S.verb=null; commit(`«${s.n}» duplicada el ${lab(w,d)}`,()=>{SES=SES.filter(x=>x.id!==nid)});}
function delSes(id){const i=SES.findIndex(x=>x.id===id); if(i<0||SES[i].st==='hecha')return; const [s]=SES.splice(i,1); S.ver='cerrar';S.verb=null; commit(`«${s.n}» quitada`,()=>SES.splice(i,0,s));}

const fr=()=>document.getElementById('frame');

    if(k==='datos'){S.ver=S.ver==='datos'?'cerrar':'datos'; S.verb=S.ver==='datos'?'datos':null;}

    else if(k==='quitar'){delSes(S.sid); return;}
    else if(k==='domover'||k==='dodup'){const s=SES.find(x=>x.id===S.sid); const w=Number(document.getElementById('p-w').value), d=Number(document.getElementById('p-d').value); S.pw=null;S.pd=null; (k==='domover'?moveSes:dupSes)(S.sid,w,d); return;}
    else if(k==='deshacer'){if(S.toast){S.toast.undo();S.toast=null;} S.save='saved';}
    else if(k==='semana'){endIdx+=7; commit(`Se agregó la semana ${weeksN()}: el ciclo termina el ${short(endIdx)}`,()=>{endIdx-=7}); return;}
    else if(k==='completar'){S.ciclo='completado';}
    else if(k==='reabrir'){S.ciclo='curso';}
    else if(k==='reintentar'||k==='descartar'){S.estado='normal';}
    else if(k==='quitaex'){S.dr.ex.splice(i,1);}
    else if(k==='serie'){const x=S.dr.ex[i]; x.se=Math.max(1,x.se+Number(a.dataset.n));}
    else if(k==='mserie'){const x=S.dr.ex[S.exi]; x.se=Math.max(1,x.se+Number(a.dataset.n));}
    else if(k==='detalle'){S.exi=i; S.ver='detalle'; S.verb='detalle';}
    else if(k==='cerrardet'||k==='guardadet'){S.ver='crear'; S.verb='crear';}
    else if(k==='pick'){S.dr.pick=!S.dr.pick;}
    else if(k==='mg'){S.dr.mg=a.dataset.g;}
    else if(k==='addex'){S.dr.ex.push({n:a.dataset.n,g:a.dataset.g,se:3,re:10,kg:'',rest:'',rir:''}); S.dr.pick=false;}
    else if(k==='guardarutina'){const id='r'+(++uid); RUT.unshift({id,n:S.dr.name,g:[...new Set(S.dr.ex.map(x=>x.g))],ex:S.dr.ex.length,se:S.dr.ex.reduce((s,x)=>s+x.se,0)}); S.ver='cerrar'; S.verb=null; S.estado=S.estado==='sinrutinas'?'normal':S.estado; S.toast={msg:`«${S.dr.name}» ya está en tus rutinas. Arrástrala a un día.`,undo:()=>{RUT=RUT.filter(r=>r.id!==id)}}; clearTimeout(S.t2); S.t2=setTimeout(()=>{S.toast=null;render()},6000);}
    render(); return;
  }
  // clic fuera de un popover
  if(['agregar','menu','mover','dup','datos'].includes(S.ver)&&!t.closest('#pop')&&!(S.ver==='datos'&&S.variante==='B')){S.ver='cerrar'; S.verb=null; render();}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('[data-q]')){S.q=t.value; render();}
  else if(t.matches('[data-px]')){S.dr.q=t.value; render();}
  else if(t.matches('[data-rname]')){S.dr.name=t.value; const b=document.querySelector('[data-act="guardarutina"]'); if(b) b.disabled=!(S.dr.name&&S.dr.ex.length);}
  else if(t.matches('[data-m="re"]')){S.dr.ex[S.exi].re=t.value.replace(/\D/g,''); const bad=S.dr.ex[S.exi].re===''; t.classList.toggle('bad',bad);}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-m]')){const k=t.dataset.m; S.dr.ex[S.exi][k]=t.value; S.noFocus=true; render(); S.noFocus=false;}
  else if(t.matches('[data-reps]')){S.dr.ex[Number(t.dataset.reps)].re=t.value.replace(/\D/g,'')||1; S.noFocus=true; render(); S.noFocus=false;}
  else if(t.matches('[data-pw]')){S.pw=Number(t.value); S.pd=Number(document.getElementById('p-d').value); render();}
  else if(t.matches('[data-pd]')){S.pd=Number(t.value);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.ver!=='cerrar'){S.ver=S.ver==='detalle'?'crear':'cerrar'; S.verb=S.ver==='crear'?'crear':null; render();}
  const r=e.target.closest&&e.target.closest('[data-rut]'); if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault(); S.ctx=S.ctx||{w:1,d:4}; S.ver='agregar'; S.verb='agregar'; render();}
});
/* Arrastrar y soltar (solo escritorio con ratón; en tablet táctil se usa el «+» y el menú ⋯) */
const clear=()=>document.querySelectorAll('.dc.ok,.dc.bad').forEach(c=>{if(!(S.estado==='arrastrando'&&c.dataset.cell==='2:3'))c.classList.remove('ok');if(!(S.estado==='arrastrando'&&c.dataset.out==='1'))c.classList.remove('bad')});
document.addEventListener('dragstart',e=>{
  const el=e.target.closest('[data-rut],[data-ses]'); if(!el) return;
  S.drag=el.dataset.rut?{k:'rut',id:el.dataset.rut}:{k:'ses',id:el.dataset.ses};
  e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',S.drag.id);
  setTimeout(()=>el.classList.add('lift'),0);
});
document.addEventListener('dragover',e=>{
  if(!S.drag) return; const c=e.target.closest('.dc[data-cell]'); if(!c) return;
  const out=c.dataset.out==='1'; clear();
  if(out){c.classList.add('bad'); e.dataTransfer.dropEffect='none'; return;}
  e.preventDefault(); e.dataTransfer.dropEffect='move'; c.classList.add('ok');
});
document.addEventListener('drop',e=>{
  if(!S.drag) return; const c=e.target.closest('.dc[data-cell]'); if(!c||c.dataset.out==='1') return; e.preventDefault();
  const [w,d]=c.dataset.cell.split(':').map(Number), dr=S.drag; S.drag=null;
  if(dr.k==='rut') addSes(dr.id,w,d); else moveSes(dr.id,w,d);
});
document.addEventListener('dragend',()=>{S.drag=null; document.querySelectorAll('.lift').forEach(x=>{if(!(S.estado==='arrastrando'))x.classList.remove('lift')}); clear();});
window.addEventListener('scroll',()=>{const el=document.getElementById('pop'); if(el) place(el);},{passive:true});
window.addEventListener('resize',()=>render());
/* Controles de la maqueta */
['pantalla','variante','ancho','estado','ciclo'].forEach(k=>document.getElementById('s-'+k).addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; S[k]=b.dataset.v; S.ver='cerrar'; S.verb=null; S.toast=null; S.rail=false;
  if(k==='estado'){ if(b.dataset.v==='sinsesiones') SES=[]; else if(!SES.length) SES=seed(); if(b.dataset.v!=='sinrutinas'&&!RUT.length) RUT=RUT0.slice(); }
  if(k==='ciclo'&&b.dataset.v==='vencido'){endIdx=25;}
  render();
}));
document.getElementById('s-ver').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; const v=b.dataset.v;
  S.toast=null; S.verb=v==='cerrar'?null:v; S.q='';
  if(v==='agregar'){S.ctx={w:2,d:1}; S.ver='agregar';}
  else if(v==='menu'){S.sid='s7'; S.ver='menu';}
  else if(v==='crear'){S.dr=newDr(); S.ver='crear';}
  else if(v==='detalle'){S.dr=newDr(); S.exi=0; S.ver='detalle';}
  else S.ver=v==='datos'?'datos':'cerrar';
  render();
  const a=anchorFor(); if(a&&!S.noScroll&&['agregar','menu','datos'].includes(S.ver)){a.scrollIntoView({block:'center'}); render();}
});
render();
if(P.get('r')){S.rail=true;render();}
if(P.get('o')){S.noScroll=true; document.querySelector(`#s-ver button[data-v="${P.get('o')}"]`).click(); S.noScroll=false;}
</script>
</body>
</html>
