# Red de seguridad mínima antes de mezclar a `main` (S-11, CYC-91): compila y
# prueba cada parte del monorepo en cada PR y en cada push a `main`. No despliega
# nada ni usa secretos. Ver docs/PLAN-Seguridad.md, 2C.
#
# - api: genera el cliente de Prisma, revisa tipos y corre Jest (Prisma simulado,
#   no necesita base de datos).
# - api-e2e: pruebas de autorización contra un Postgres de pruebas (CYC-90).
# - web: revisa tipos y compila con Vite.
# - mobile: revisa tipos y corre Jest (no compila la app; eso lo hace android.yml).
# - auditoría: `npm audit` de las dependencias de producción. Solo avisa (el paso
#   usa `continue-on-error`): hoy hay avisos que exigen migrar NestJS
#   (docs/SEGURIDAD.md, §3.4). Cuando esa migración esté hecha, quitarlo.
#
# - lint: ESLint de api, web y app móvil.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (tipos y pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Se instala todo el monorepo, como en Render y en local: los tipos de
      # `resend` necesitan `@types/react`, que llega con la web.
      - name: Instalar dependencias
        run: npm ci
      - name: Generar el cliente de Prisma
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Revisar tipos
        run: npm run typecheck --workspace apps/api
      - name: Pruebas
        run: npm test --workspace apps/api
      - name: Compilar la API y comprobar que arranca desde dist/main.js
        run: |
          npm run build --workspace apps/api
          test -f apps/api/dist/main.js || { echo "::error::La API no compiló a apps/api/dist/main.js (Render arranca 'node apps/api/dist/main.js'). Revisa que ningún archivo de la API importe valores de @cycles/shared."; exit 1; }

  # Pruebas de autorización de extremo a extremo (CYC-90, S-11): arrancan la API
  # real contra un Postgres de pruebas y recorren la matriz de cada endpoint
  # (sin sesión, rol equivocado, coach ajeno, relación terminada, atleta ajeno)
  # y los flujos de token. La base se llama `*_test`: las pruebas se niegan a
  # correr contra cualquier otra. Ver docs/PRUEBAS-E2E.md.
  api-e2e:
    name: API (autorización, con base de datos)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cycles_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cycles_e2e_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Generar el cliente de Prisma
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Aplicar las migraciones a la base de pruebas
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Pruebas de autorización
        run: npm run test:e2e --workspace apps/api

  # ESLint de los tres workspaces (CYC-97). Los avisos no bloquean; los errores sí.
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: ESLint
        run: npm run lint

  web:
    name: Web (tipos y compilación)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Revisar tipos y compilar
        run: npm run build --workspace apps/web
      - name: Pruebas de la web
        run: npm test --workspace apps/web

  mobile:
    name: App móvil (tipos y pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Revisar tipos
        run: npm run typecheck --workspace apps/mobile
      - name: Pruebas
        run: npm test --workspace apps/mobile

  auditoria:
    name: Auditoría de dependencias (solo aviso)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # El paso queda marcado con aviso (no con error) para no dejar el PR en rojo:
      # los avisos altos de hoy exigen migrar NestJS (CYC-94). Al migrar, quitar
      # `continue-on-error` para que bloquee.
      - name: npm audit (producción, severidad alta o crítica)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
